body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.75 "Assistant",Arial,sans-serif;padding-inline:16px}

</style><style>

<script>
(function(){
var API='/api/pricing?c=_timer',KEY='myluach-auth',$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sess(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function store(){try{return JSON.parse(localStorage.getItem('myTimers')||'{}')}catch(e){return {}}}
function remember(s,t){try{var o=store();o[s]=t;localStorage.setItem('myTimers',JSON.stringify(o))}catch(e){}}
function tok(){var j=sess();if(!j)return Promise.resolve('');
  if(j.access_token&&(!j.expires_at||j.expires_at*1000>Date.now()+60000))return Promise.resolve(j.access_token);
  var C=window.MYLUACH_CFG||{};if(!j.refresh_token||!C.supabaseUrl)return Promise.resolve('');
  return fetch(C.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:j.refresh_token})})
   .then(function(r){return r.ok?r.json():null}).then(function(n){if(!n||!n.access_token)return '';try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},j,{access_token:n.access_token,refresh_token:n.refresh_token||j.refresh_token,expires_at:n.expires_at})))}catch(e){}return n.access_token}).catch(function(){return ''})}
var TK='';
function call(url,body){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){return [r.status,j]})})}
function post(body){return call(API,body)}
function fmt(d){return d?d.split('-').reverse().join('.'):'ללא תאריך'}
function fmtT(d){try{return new Date(d).toLocaleDateString('he-IL')}catch(e){return ''}}
var D={events:null,contacts:null,profile:null,orders:null,email:''},TAB='ov',CT={q:'',g:'',sel:{},edit:''};
function loginView(){$('tabs').hidden=true;$('box').innerHTML='<p>כדי לראות את האזור האישי צריך להיכנס לחשבון. הכניסה בחינם, עם כתובת מייל: שולחים לכם קישור, לוחצים עליו ונכנסים. אפשר גם עם סיסמה או חשבון Google.</p><div class="acts"><a class="btnx pri" href="/app.html#login&back='+encodeURIComponent('/invite-my')+'">כניסה עם מייל</a><a class="btnx" href="/invite">בניית דף הזמנה חדש</a></div><p class="mute" style="font-size:14px">יש לכם כבר דף הזמנה שנבנה בלי חשבון? אחרי הכניסה הוא יתחבר לחשבון אוטומטית כשתפתחו אותו מאותו דפדפן, או מהקישור האישי שבמייל הרכישה.</p>'}
function msg(t,ok){var m=$('flash');if(!m)return;m.textContent=t;m.className='flash'+(ok===false?' bad':'');m.hidden=false;clearTimeout(msg.t);msg.t=setTimeout(function(){m.hidden=true},4000)}
/* ===== סקירה ===== */

  var yes=E.reduce(function(a,e){return a+(+e.yesP||0)},0),up=E.filter(function(e){return e.d&&e.d>=new Date().toISOString().slice(0,10)}).sort(function(a,b){return a.d<b.d?-1:1})[0];
  var h='<p class="mute" style="margin:0 0 6px">מחוברים כ־<b>'+esc(D.email)+'</b></p><div class="stats"><div class="stat"><b>'+E.length+'</b><span>אירועים</span></div><div class="stat"><b>'+yes+'</b><span>מגיעים (בכל האירועים)</span></div><div class="stat"><b>'+C.length+'</b><span>אנשי קשר</span></div><div class="stat"><b>'+Object.keys(gr).length+'</b><span>מאגרים</span></div></div>';
  if(up)h+='<div class="evc"><div><b>האירוע הקרוב: '+esc(up.t||up.slug)+'</b><small>'+esc(fmt(up.d))+' · '+(+up.n||0)+' נמענים · ✓ '+(+up.yesP||0)+' מגיעים</small></div><div class="acts" style="margin:0"><a class="btnx pri" data-s="'+esc(up.slug)+'" data-k="'+esc(up.token)+'" href="/invite?s='+esc(up.slug)+'">פתיחה וניהול</a></div></div>';
  h+='<div class="acts"><a class="btnx pri" href="/invite">➕ אירוע חדש</a><button type="button" class="btnx" data-go="ct">👥 אנשי הקשר שלי</button><button type="button" class="btnx" data-go="st">⚙️ הגדרות חשבון</button></div>';
  if(!E.length)h+='<p>עוד אין אירועים בחשבון הזה. בנו דף הזמנה והוא יופיע כאן.</p>';
  $('box').innerHTML=h}
/* ===== אירועים ===== */
function vEv(){var E=D.events||[],h='<div class="acts"><a class="btnx pri" href="/invite">➕ אירוע חדש</a></div>';
  if(!E.length)h+='<p>עוד אין אירועים בחשבון הזה. בנו דף הזמנה, והוא יופיע כאן. אם כבר בניתם אחד מהדפדפן הזה, פתחו אותו פעם אחת ("האירועים שלי" בבונה) והוא יתחבר לחשבון.</p>';
  h+=E.map(function(e){return '<div class="evc"><div><b>'+esc(e.t||e.slug)+'</b><span class="bdg'+(e.paid?' ok':'')+'">'+(e.paid?(e.free?'מסלול חינם':'פעיל'):'עוד לא הופעל')+'</span><small>'+esc(fmt(e.d))+' · '+(+e.n||0)+' נמענים · ✓ '+(+e.yesP||0)+' מגיעים · ✕ '+(+e.no||0)+' · ? '+(+e.maybe||0)+'</small></div><div class="acts" style="margin:0"><a class="btnx pri" data-s="'+esc(e.slug)+'" data-k="'+esc(e.token)+'" href="/invite?s='+esc(e.slug)+'">פתיחה וניהול</a><a class="btnx" target="_blank" rel="noopener" href="/t/'+esc(e.slug)+'">צפייה בדף</a></div></div>'}).join('');
  $('box').innerHTML=h}
/* ===== אנשי קשר ומאגרים ===== */
function groups(){var g={};(D.contacts||[]).forEach(function(c){if(c.g)g[c.g]=(g[c.g]||0)+1});return g}
function filt(){var q=CT.q.trim().toLowerCase();return (D.contacts||[]).filter(function(c){if(CT.g==='__none'&&c.g)return false;if(CT.g&&CT.g!=='__none'&&c.g!==CT.g)return false;return !q||[c.n,c.e,c.p,c.g].join(' ').toLowerCase().indexOf(q)>=0})}
function vCt(){var G=groups(),L=filt(),n=Object.keys(CT.sel).length;
  var h='<div class="card2"><h2>הוספה וייבוא</h2><div class="g4"><label>שם<input id="cN" maxlength="80"></label><label>טלפון<input id="cP" inputmode="tel" dir="ltr"></label><label>מייל<input id="cE" type="email" dir="ltr"></label><label>מאגר (קבוצה)<input id="cG" list="gl" maxlength="40"></label></div><datalist id="gl">'+Object.keys(G).map(function(k){return '<option value="'+esc(k)+'">'}).join('')+'</datalist><div class="acts"><button type="button" class="btnx pri" id="cAdd">הוספה</button><button type="button" class="btnx" id="cImpT">ייבוא מטקסט או קובץ</button><button type="button" class="btnx" id="cSync" title="מוסיף את כל הנמענים מהאירועים שלכם">⟳ ייבוא מהאירועים שלי</button></div>'
   +'<div id="impBox" hidden><p class="mute" style="font-size:15px;margin:4px 0">שורה לכל איש קשר: שם, טלפון, מייל, מאגר (מופרדים בפסיק או טאב). אפשר להדביק מאקסל, או לבחור קובץ CSV.</p><textarea id="impT" rows="6" style="width:100%" dir="auto"></textarea><div class="acts"><input type="file" id="impF" accept=".csv,.txt,text/csv,text/plain"><button type="button" class="btnx pri" id="impGo">ייבוא</button></div></div></div>'
   +'<div class="card2"><h2>האנשים שלי ('+(D.contacts||[]).length+')</h2><div class="g3"><label>חיפוש<input id="cQ" value="'+esc(CT.q)+'" placeholder="שם, טלפון, מייל"></label><label>מאגר<select id="cF"><option value="">הכל</option><option value="__none"'+(CT.g==='__none'?' selected':'')+'>ללא מאגר</option>'+Object.keys(G).sort().map(function(k){return '<option value="'+esc(k)+'"'+(CT.g===k?' selected':'')+'>'+esc(k)+' ('+G[k]+')</option>'}).join('')+'</select></label><div class="acts" style="align-self:end"><button type="button" class="btnx" id="cExp">⬇ ייצוא ל־CSV</button></div></div>'
   +'<div class="acts"><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="cAll"> בחירת כל המסוננים ('+L.length+')</label>'+(n?'<span class="mute">'+n+' נבחרו</span><input id="cBG" list="gl" placeholder="שם מאגר" style="max-width:150px" maxlength="40"><button type="button" class="btnx" id="cSetG">שיוך למאגר</button><button type="button" class="btnx danger" id="cDel">מחיקה</button>':'')+'</div>';
  if(!L.length)h+='<p class="mute">'+((D.contacts||[]).length?'אין תוצאות לחיפוש הזה.':'עוד אין אנשי קשר. הוסיפו, ייבאו, או ייבאו מהאירועים שלכם.')+'</p>';
  else h+='<div class="tw"><table class="ctb"><thead><tr><th></th><th>שם</th><th>טלפון</th><th>מייל</th><th>מאגר</th><th></th></tr></thead><tbody>'+L.slice(0,400).map(function(c){
    if(CT.edit===c.id)return '<tr><td></td><td><input data-f="n" value="'+esc(c.n)+'"></td><td><input data-f="p" dir="ltr" value="'+esc(c.p)+'"></td><td><input data-f="e" dir="ltr" value="'+esc(c.e)+'"></td><td><input data-f="g" list="gl" value="'+esc(c.g)+'"></td><td class="nw"><button type="button" class="btnx pri sm" data-sv="'+esc(c.id)+'">שמירה</button> <button type="button" class="btnx sm" data-cx="1">ביטול</button></td></tr>';
    return '<tr><td><input type="checkbox" data-sel="'+esc(c.id)+'"'+(CT.sel[c.id]?' checked':'')+'></td><td>'+esc(c.n||'ללא שם')+'</td><td dir="ltr">'+esc(c.p)+'</td><td dir="ltr">'+esc(c.e)+'</td><td>'+esc(c.g)+'</td><td class="nw"><button type="button" class="btnx sm" data-ed="'+esc(c.id)+'">עריכה</button></td></tr>'}).join('')+'</tbody></table></div>'+(L.length>400?'<p class="mute">מוצגים 400 הראשונים. צמצמו עם חיפוש או מאגר.</p>':'');
  h+='</div>';$('box').innerHTML=h}
function parseImp(t){var out=[];String(t||'').split(/\r?\n/).forEach(function(l,i){l=l.trim();if(!l)return;var p=l.indexOf('\t')>=0?l.split('\t'):l.split(/[,;]/);p=p.map(function(x){return x.trim().replace(/^"|"$/g,'')});
  var o={name:'',phone:'',email:'',grp:''};p.forEach(function(x,k){if(/@/.test(x))o.email=x;else if(/^[\d+\-\s()]{7,}$/.test(x))o.phone=x;else if(!o.name&&k===0)o.name=x;else if(o.name&&!o.grp&&x&&k>=1)o.grp=x});
  if(i===0&&!o.email&&!o.phone)return;if(o.email||o.phone)out.push(o)});return out}
function reloadCt(m){return post({act:'cpool'}).then(function(a){if(a[0]===200)D.contacts=a[1].contacts||[];CT.sel={};CT.edit='';if(TAB==='ct')vCtR();if(m)msg(m)})}
function csvOut(L){var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};return '﻿'+['שם','טלפון','מייל','מאגר'].map(q).join(',')+'\n'+L.map(function(c){return [c.n,c.p,c.e,c.g].map(q).join(',')}).join('\n')}
/* ===== רכישות ===== */
var PN={base:'בסיסית',event:'דף הזמנה לאירוע',greet:'ברכה / הזמנה מעוצבת',gift:'מתנה',wishd:'ברכה מעוצבת'};
function vPu(){if(D.orders===null){$('box').innerHTML='<p>טוען…</p>';return}var O=D.orders;
  $('box').innerHTML=O.length?'<div class="tw"><table class="ctb"><thead><tr><th>תאריך</th><th>מה נרכש</th><th>סכום</th><th>מספר</th></tr></thead><tbody>'+O.map(function(o){return '<tr><td>'+esc(fmtT(o.paid_at))+'</td><td>'+esc(PN[o.plan]||o.plan)+'</td><td>'+(+o.amount?(+o.amount).toLocaleString('he-IL')+' ₪':'חינם')+'</td><td dir="ltr">'+esc(o.id)+'</td></tr>'}).join('')+'</tbody></table></div><p class="mute" style="font-size:15px">קבלות נשלחות למייל בעת התשלום. לא מצאתם? כתבו לנו מהמייל הזה דרך עמוד התמיכה.</p>':'<p>עוד אין רכישות בחשבון הזה.</p>'}
