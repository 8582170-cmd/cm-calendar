(function(){
  var o=document.getElementById('o'),L=[];function w(k,v){L.push(k+': '+v);o.textContent=L.join('\n')}

  var g=null,c=null;try{g=localStorage.getItem('myluach-geo');c=localStorage.getItem('myluach-shabbat')}catch(e){w('localStorage','ERROR '+e.message)}
