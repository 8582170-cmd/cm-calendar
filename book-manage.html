<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},box=$('box'),nav=$('nav');

  a.innerHTML='מחובר כ־<b dir="ltr">'+esc(m)+'</b> · <a href="#" id="acs">החלפת חשבון</a>';$('acs').onclick=function(e){e.preventDefault();switchAcct()}}
function sess(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function tok(){var j=sess();if(!j)return Promise.resolve('');
  if(j.access_token&&(!j.expires_at||j.expires_at*1000>Date.now()+60000))return Promise.resolve(j.access_token);

function loadSb(){return window.supabase?Promise.resolve():new Promise(function(res,rej){var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=res;s.onerror=function(){var s2=document.createElement('script');s2.src='/cdn/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s2.onload=res;s2.onerror=rej;document.head.appendChild(s2)};document.head.appendChild(s)})}

function authMsg(e){var m=String(e&&e.message||e||'');if(/invalid login/i.test(m))return 'המייל או הסיסמה שגויים. אם אין לכם סיסמה, השתמשו בקישור במייל.';if(/rate|limit|seconds/i.test(m))return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';if(/provider|not enabled|unsupported/i.test(m))return 'הכניסה עם Google עדיין לא הופעלה באתר. אפשר להיכנס עם קישור במייל.';return 'שגיאה: '+esc(m)}
function login(msg0){nav.innerHTML='';
  box.innerHTML='<div class="card" style="max-width:440px"><h1>כניסה לניהול התורים</h1><p class="hint" style="margin:0 0 10px">כניסה באותו מייל שהוגדר לבעל העסק. אין צורך בסיסמה.</p>'
