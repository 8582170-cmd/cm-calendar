<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול קמפיין התרמה · MyLuach</title>

<style>

.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}.kpi span{font-size:13px;color:var(--mute)}.kpi b{font-size:24px}

label.f small,.hint{font-weight:400;color:var(--mute);font-size:13px}

.btn{height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.bad{color:var(--bad);border-color:#E3B3AD}

.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:right}
th{background:#F8F9FB;color:var(--mute);font-weight:500;padding:10px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid #EEF0F4;vertical-align:top}
td input,td select{height:38px;min-width:70px}
td input:not([type=checkbox]):not([type=file]),td select,td textarea{min-width:120px}td input[type=checkbox]{width:20px;height:20px;min-width:0}td input[type=file]{min-width:0;width:auto}td textarea{min-width:200px}
tr.click{cursor:pointer}tr.click:hover{background:#FAFAF6}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:#E4E7EF}
.pill.ok{background:#DDF1E7;color:#145A3F}.pill.wait{background:var(--cream);color:var(--cream-ink)}.pill.bad{background:#FBE9E7;color:var(--bad)}

.flash.bad{background:var(--bad)}
.note{background:var(--cream);border:1px solid var(--cream-line);color:var(--cream-ink);border-radius:10px;padding:12px 14px;font-size:14px}
.mono{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.two>*{flex:1 1 320px;min-width:0}
.drawbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.win{width:100%;max-width:560px;background:var(--navy);color:#fff;border-radius:14px;padding:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;text-align:right}
.win .s{font-size:36px;font-weight:700;letter-spacing:3px;direction:ltr}.win small{color:#D5DAE6}.win .k{color:var(--gold2);font-size:13px}
.drawgo{min-height:62px;padding:0 40px;border:0;border-radius:14px;background:var(--gold);color:var(--navy);font-size:21px;font-weight:700;cursor:pointer}
.prodlist{display:flex;flex-direction:column;gap:8px}
.prodlist button{min-height:52px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;text-align:right;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prodlist button[aria-pressed="true"]{border-color:var(--gold);background:var(--cream)}
.full{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:30px}
.full .p{font-family:"Frank Ruhl Libre",serif;font-size:clamp(36px,6vw,70px)}.full .s{font-size:clamp(60px,12vw,150px);font-weight:700;letter-spacing:6px;color:var(--gold2);direction:ltr}.full .n{font-size:clamp(28px,4vw,50px)}
.shuf{font-size:clamp(40px,8vw,110px);font-weight:700;direction:ltr;color:#D5DAE6;letter-spacing:4px}
:focus-visible{outline:3px solid #2A5BD7;outline-offset:2px}
@media print{nav.side,.noprint,.flash{display:none!important}main{padding:0}body{background:#fff}}
</style>
<script src="/assets/config.js"></script>
</head>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},box=$('box'),nav=$('nav');

function meMail(){var j=sess();if(!j)return '';if(j.user&&j.user.email)return j.user.email;try{var p=(j.access_token||'').split('.')[1];return JSON.parse(decodeURIComponent(escape(atob(p.replace(/-/g,'+').replace(/_/g,'/'))))).email||''}catch(e){return ''}}

  a.innerHTML='מחובר כ־<b dir="ltr">'+esc(m)+'</b> · <a href="#" id="acs">החלפת חשבון</a>';$('acs').onclick=function(e){e.preventDefault();switchAcct()}}
function sess(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function tok(){var j=sess();if(!j)return Promise.resolve('');
  if(j.access_token&&(!j.expires_at||j.expires_at*1000>Date.now()+60000))return Promise.resolve(j.access_token);
  var C=window.MYLUACH_CFG||{};if(!j.refresh_token||!C.supabaseUrl)return Promise.resolve('');

   .then(function(r){return r.ok?r.json():null}).then(function(n){if(!n||!n.access_token)return '';try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},j,{access_token:n.access_token,refresh_token:n.refresh_token||j.refresh_token,expires_at:n.expires_at})))}catch(e){}return n.access_token}).catch(function(){return ''})}
function call(b){return tok().then(function(t){TK=t;return fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:JSON.stringify(Object.assign({s:SLUG},b))})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){j._st=r.status;if(r.status===401)login();if(j.error==='setup')flash(j.message,1);return j})})}
function loadSb(){return window.supabase?Promise.resolve():new Promise(function(res,rej){var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=res;s.onerror=function(){var s2=document.createElement('script');s2.src='/cdn/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s2.onload=res;s2.onerror=rej;document.head.appendChild(s2)};document.head.appendChild(s)})}

function authMsg(e){var m=String(e&&e.message||e||'');if(/invalid login/i.test(m))return 'המייל או הסיסמה שגויים. אם אין לכם סיסמה, השתמשו בקישור במייל.';if(/rate|limit|seconds/i.test(m))return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';if(/provider|not enabled|unsupported/i.test(m))return 'הכניסה עם Google עדיין לא הופעלה באתר. אפשר להיכנס עם קישור במייל.';return 'שגיאה: '+esc(m)}
function login(msg0){nav.innerHTML='';
  box.innerHTML='<div class="card" style="max-width:440px"><h1>כניסה לניהול הקמפיין</h1><p class="hint" style="margin:0 0 10px">כניסה באותו מייל שהוגדר למנהל הקמפיין. אין צורך בסיסמה.</p>'
   +'<div class="acts"><button class="btn" type="button" id="lgg" style="width:100%">כניסה עם Google</button></div>'
   +'<p class="hint" style="text-align:center;margin:10px 0">או</p>'

   +'<div class="acts"><button class="btn pri" type="button" id="lgl" style="width:100%">שלחו לי קישור כניסה למייל</button></div>'
   +'<details style="margin-top:12px"><summary style="cursor:pointer;font-size:14px">יש לי סיסמה</summary><label class="f" for="lgp">סיסמה<input id="lgp" type="password" dir="ltr" autocomplete="current-password"></label><div class="acts"><button class="btn" type="button" id="lgi">כניסה עם סיסמה</button></div></details>'
   +'<p class="hint" id="lgx" style="margin:10px 0 0"></p></div>';
  var X=$('lgx'),say=function(t,bad){X.innerHTML=t;X.style.color=bad?'#b00020':''};if(msg0)say(msg0,1);

  var here=location.origin+location.pathname;

  $('lgg').onclick=function(){say('עוברים לגוגל…');mark();sbReady().then(function(sb){return sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:here,queryParams:{prompt:'select_account'}}})}).then(function(r){if(r&&r.error)say(authMsg(r.error),1)}).catch(function(e){say(authMsg(e),1)})};

  var pw=function(){var m=mail(),p=$('lgp').value,C=window.MYLUACH_CFG||{};if(!m)return;if(!p){say('נא למלא סיסמה.',1);return}if(!C.supabaseUrl){say('הכניסה לא זמינה כרגע.',1);return}$('lgi').disabled=true;say('נכנסים…');
    fetch(C.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({email:m,password:p})})
     .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(o){
       if(!o.ok||!o.j.access_token){$('lgi').disabled=false;say(/invalid|credentials/i.test(JSON.stringify(o.j))?'המייל או הסיסמה שגויים. אם אין לכם סיסמה, השתמשו בקישור במייל.':'הכניסה נכשלה. נסו שוב.',1);return}
       try{localStorage.setItem(KEY,JSON.stringify(o.j))}catch(e){}location.reload()}).catch(function(){$('lgi').disabled=false;say('תקלת תקשורת. נסו שוב.',1)})};
  $('lgi').onclick=pw;$('lgp').onkeydown=function(e){if(e.key==='Enter')pw()}}
/* חזרה מכניסה עם Google או מקישור במייל: הכתובת מגיעה עם הטוקן, ספריית הכניסה שומרת אותו, ואז נכנסים לניהול */

  var clean=function(){var s='';try{s=localStorage.getItem('ml-s')||'';localStorage.removeItem('ml-s');localStorage.removeItem('ml-back2');sessionStorage.removeItem('ml-back')}catch(e){}return location.pathname+(SLUG||!s?location.search:'?s='+encodeURIComponent(s))};
  if(err){history.replaceState(null,'',location.pathname+location.search);return login('הכניסה נכשלה: '+esc(decodeURIComponent(err[1].replace(/\+/g,' '))))}
  sbReady().then(function(sb){return new Promise(function(res){var d=0;sb.auth.onAuthStateChange(function(ev,s){if(s&&!d){d=1;res(s)}});setTimeout(function(){if(!d){d=1;res(null)}},5000)})}).then(function(s){if(!s)return login('הכניסה לא הושלמה. נסו שוב.');location.replace(clean())}).catch(function(){login('הכניסה לא הושלמה. נסו שוב.')})}

  var t='﻿'+[head].concat(rows).map(function(r){return r.map(e).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()}

function listView(){nav.innerHTML='<div class="ttl">קמפיין התרמה</div><div class="org">ניהול</div>';
  call({a:'mine'}).then(function(j){if(j._st!==200)return;ME=j;
    var h='<div class="hd"><h1>הקמפיינים שלי</h1></div>'+table(['שם','כתובת','מצב',''],j.list.map(function(s){return '<tr><td>'+esc(s.title)+'</td><td class="mono">'+esc(s.slug)+'</td><td>'+stPill(s.status)+'</td><td><button class="btn dark" data-open="'+esc(s.slug)+'">ניהול</button></td></tr>'}));

  if(E){var m=E.match||{};h+='<div class="card"><h2>'+(E._new?'יום נתינה חדש':'עריכת יום נתינה')+'</h2><div class="two"><label class="f" for="dy1">כתובת באנגלית (אותיות קטנות, ספרות ומקף)<input id="dy1" dir="ltr" value="'+esc(E.id||'')+'"'+(E._new?'':' disabled')+'></label><label class="f" for="dy2">שם<input id="dy2" value="'+esc(E.title||'')+'"></label></div>'
   +'<label class="f" for="dy3">משפט פתיחה<textarea id="dy3">'+esc(E.sub||'')+'</textarea></label><div class="two"><label class="f" for="dy4">התחלה<input id="dy4" type="datetime-local" value="'+loc(E.start)+'"></label><label class="f" for="dy5">סיום<input id="dy5" type="datetime-local" value="'+loc(E.end)+'"></label></div>'
   +'<div class="two"><label class="f" for="dy6">יעד משותף (₪, לא חובה)<input id="dy6" type="number" value="'+(E.goal||'')+'"></label><label class="f" for="dy7">הודעה בראש הדף<input id="dy7" value="'+esc(E.note||'')+'"></label></div>'
   +'<label class="ck"><input type="checkbox" id="dy8"'+(m.on?' checked':'')+'> להציג הכפלה משותפת (תורמים מכפילים ליום)</label><div class="two"><label class="f" for="dy9">יחס (2 = כפול)<input id="dy9" type="number" step="0.1" value="'+(m.ratio||2)+'"></label><label class="f" for="dya">תקרת ההכפלה (₪)<input id="dya" type="number" value="'+(m.cap||'')+'"></label></div><label class="f" for="dyb">נוסח על ההכפלה (למשל: משפחת כהן מכפילה עד 100,000 ₪)<input id="dyb" value="'+esc(m.text||'')+'"></label>'
   +'<p class="hint" style="margin:0">ההכפלה המשותפת מוצגת בדף כהודעה ומחושבת לפי הסכום המצטבר. היא לא מתווספת לסכומים של הקמפיינים, וההכפלה בפועל היא התחייבות של התורמים המכפילים אליכם.</p>'
   +'<label class="f" for="dyc">הקמפיינים המשתתפים (כתובת הקמפיין בכל שורה)<textarea id="dyc" dir="ltr" style="min-height:90px">'+esc((E.campaigns||[]).join('\n'))+'</textarea></label>'
   +'<label class="ck"><input type="checkbox" id="dyd"'+(E.joinOpen?' checked':'')+'> לאפשר למנהלי קמפיינים להצטרף בעצמם (מהלשונית "קישורים והקרנה" בקמפיין שלהם)</label><label class="ck"><input type="checkbox" id="dye"'+(E.listed?' checked':'')+'> להציג בדף הפתיחה /give</label><label class="ck"><input type="checkbox" id="dyf"'+(E.on?' checked':'')+'> הדף פתוח לציבור</label>'
   +'<div class="acts"><button class="btn pri" id="dys">שמירה</button><button class="btn" id="dyx">ביטול</button>'+(E._new?'':'<button class="btn bad" id="dyr">מחיקה</button>')+'</div></div>'}
  b.innerHTML=h;
  b.onclick=function(e){var t=e.target;if(t.id==='dyn'){DYE={_new:true,on:false,match:{}};dayDraw();return}
    if(t.dataset.dye!=null){DYE=JSON.parse(JSON.stringify(DYX.list[+t.dataset.dye]));dayDraw();$('gdy').scrollIntoView({block:'nearest'});return}
    if(t.dataset.cpw){navigator.clipboard&&navigator.clipboard.writeText(t.dataset.cpw);flash('הקישור הועתק');return}
    if(t.id==='dyx'){DYE=null;dayDraw();return}
    if(t.id==='dyr'&&confirm('למחוק את יום הנתינה? הקמפיינים עצמם לא נמחקים.'))call({a:'dayDel',id:DYE.id}).then(function(r){DYX=r;DYE=null;dayDraw();flash('נמחק')});
    if(t.id==='dys'){var g=function(i){var x=$(i);return x?x.value.trim():''},iso=function(i){var x=g(i);return x?new Date(x).toISOString():''};
      var o={id:g('dy1'),title:g('dy2'),sub:g('dy3'),start:iso('dy4'),end:iso('dy5'),goal:+g('dy6')||0,note:g('dy7'),match:{on:ck('dy8'),ratio:+g('dy9')||2,cap:+g('dya')||0,text:g('dyb')},campaigns:g('dyc').split(/\s+/).filter(Boolean),joinOpen:ck('dyd'),listed:ck('dye'),on:ck('dyf')};
      call({a:'daySave',day:o}).then(function(r){if(r._st!==200){flash(r.message||'לא נשמר',1);return}DYX=r;DYE=null;dayDraw();flash('נשמר')})}}}
/* ימי נתינה בלשונית הקישורים של הקמפיין: הצטרפות ויציאה */
function dayMine(){call({a:'dayMine'}).then(function(r){var b=$('dym');if(!b||!r.days)return;
  b.innerHTML=r.days.length?'<div class="card"><h2>ימי נתינה</h2><p class="hint" style="margin:0">הצטרפות ליום נתינה משותף מוסיפה את הקמפיין לדף המשותף ולוח התוצאות שלו.</p>'+table(['יום נתינה','מתי','',''],r.days.map(function(d){return '<tr><td><b>'+esc(d.title)+'</b><br><a href="'+esc(d.url)+'" target="_blank" rel="noopener">לדף היום</a></td><td>'+(d.start?dt(d.start):'')+(d.end?' עד '+dt(d.end):'')+'</td><td>'+(d.joined?'<span class="pill ok">הקמפיין משתתף</span>':'<span class="pill">לא משתתף</span>')+'</td><td><button class="btn'+(d.joined?' bad':' pri')+'" data-dj="'+esc(d.id)+'" data-l="'+(d.joined?1:0)+'">'+(d.joined?'יציאה מהיום':'הצטרפות')+'</button></td></tr>'}))+'</div>':'';
  b.onclick=function(e){var x=e.target.closest('[data-dj]');if(!x)return;if(x.dataset.l==='1'&&!confirm('להוציא את הקמפיין מיום הנתינה?'))return;call({a:'dayJoin',day:x.dataset.dj,leave:x.dataset.l==='1'}).then(function(j){if(j._st!==200){flash(j.message||'לא בוצע',1);return}flash(x.dataset.l==='1'?'הקמפיין יצא מהיום':'הקמפיין הצטרף');dayMine()})}})}

function lnk(){var u=S.url,L=[['דף הקמפיין',u],['מסך הקרנה לאירוע (מסך מלא, מתעדכן לבד)',u+'?screen=1']];
  S.teams.forEach(function(t){L.push(['קבוצה: '+t.name,u+'?t='+t.id])});
  box.innerHTML=head('קישורים והקרנה')+'<div class="card"><p class="hint" style="margin:0">מסך ההקרנה מתאים למקרן או לטלוויזיה באולם: סכום ענק, פס התקדמות, שעון, תרומות אחרונות ולוח מובילים. פותחים אותו בדפדפן ולוחצים F11.</p>'+table(['',''],L.map(function(x){return '<tr><td>'+esc(x[0])+'<br><span class="mono">'+esc(x[1])+'</span></td><td><div class="acts"><button class="btn" data-cpw="'+esc(x[1])+'">העתקה</button><a class="btn" href="'+esc(x[1])+'" target="_blank" rel="noopener">פתיחה</a></div></td></tr>'}))+'</div><p class="hint">הקישורים האישיים של הנציגים: בלשונית "נציגים" (גם בייצוא לאקסל).</p><div id="dym"></div>';wireHead();dayMine()}

if(/[?&]out=1\b/.test(location.search)){try{localStorage.removeItem(KEY)}catch(e){}}
if(/[#&](access_token|error_description)=/.test(location.hash))finishHash();else tok().then(function(t){TK=t;if(!t)return login();acctBar();SLUG?loadSale().then(show).catch(function(){}):listView()});
})();
