<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הפרטים שלי בספרי הטלפונים | MyLuach</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/greetings/greetings.css?v=7">
<script src="/assets/a11y.js?v=1" defer></script>
<style>
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin:0 0 14px;max-width:640px}
.card h2{font-size:22px;margin:0}
.card p{margin:0;font-size:17px;line-height:1.6}
.card input{font:inherit;font-size:17px;min-height:46px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper,#fff);color:var(--ink);width:100%;box-sizing:border-box}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:6px 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);cursor:pointer}
.b.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.b.no{border-color:#b3261e;color:#b3261e}
.msg{min-height:1.4em;font-size:16px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card select{font:inherit;font-size:17px;min-height:46px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:var(--paper,#fff);color:var(--ink)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
h1{font-size:clamp(28px,4vw,40px);font-weight:900;margin:8px 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav"><a class="logo" href="/"><img class="logo-img" src="/assets/logo.svg?v=2" alt="" width="36" height="36">MyLuach</a></header>
  <main id="main">
    <h1>הפרטים שלי</h1>
    <div id="box"></div>
  </main>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); }, B = $('box'), Q = new URLSearchParams(location.search), T = Q.get('t');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function post(b){ return fetch('/api/pricing?c=_dirme', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw Object.assign(new Error(j.error || r.status), { code: j.error }); return j; }); }); }
  /* כניסה: קישור למייל, או קוד בשיחת טלפון */
  function ask(note){
    B.innerHTML = (note ? '<div class="card"><p><b>' + esc(note) + '</b></p></div>' : '') +
      '<div class="card"><p>אם אתם רשומים בספרי הטלפונים של MyLuach, או שקיבלתם דרכנו הזמנה (במייל או בטלפון), כאן אפשר לראות ולעדכן את כל הפרטים שלכם: שם, שם האב, שם החותן, כתובת, טלפונים ומייל. אפשר גם להימחק מהמאגר, או לבקש שלא יתקשרו אליכם.</p></div>' +
      '<div class="card"><h2>📞 כניסה עם מספר טלפון</h2><p>נתקשר אליכם עכשיו ונקריא קוד של 4 ספרות (לא בלילה ולא בשבת ובחג).</p>' +
      '<label>מספר הטלפון<input type="tel" id="ph" dir="ltr" autocomplete="tel"></label><div class="btns"><button class="b pri" type="button" id="pgo">התקשרו אליי עם קוד</button></div>' +
      '<div id="pcode" hidden><label>הקוד ששמעתם<input type="text" id="code" inputmode="numeric" maxlength="4" dir="ltr"></label><div class="btns"><button class="b pri" type="button" id="pver">כניסה</button></div></div><p class="msg" id="pm" role="status"></p></div>' +
      '<div class="card"><h2>✉ כניסה עם מייל</h2><p>נשלח קישור אישי לכתובת (תקף ליומיים).</p>' +
      '<label>כתובת המייל<input type="email" id="em" dir="ltr" autocomplete="email"></label><div class="btns"><button class="b pri" type="button" id="go">שליחת קישור</button></div><p class="msg" id="m" role="status"></p></div>' +
      '<div class="card"><h2>הסרה מהשיחות בלי להיכנס</h2><p>בכל שיחת הזמנה מ־MyLuach אפשר להקיש 9, ואז לא נתקשר יותר למספר הזה, מאף אירוע.</p></div>';
    $('go').onclick = function(){ var e = $('em').value.trim(); if (!/@/.test(e)) { $('m').textContent = 'נא לכתוב כתובת מייל.'; return; }
      $('go').disabled = true; $('m').textContent = 'שולח…';
      post({ act: 'req', email: e }).then(function(){ $('m').textContent = 'אם הכתובת נמצאת אצלנו, נשלח אליה עכשיו קישור. כדאי לבדוק גם בתיקיית הספאם.'; })
        .catch(function(){ $('go').disabled = false; $('m').textContent = 'לא הצלחנו לשלוח. נסו שוב.'; }); };
    $('pgo').onclick = function(){ var p = $('ph').value.trim(); if (p.replace(/\D/g, '').length < 9) { $('pm').textContent = 'נא לכתוב מספר טלפון מלא.'; return; }
      $('pgo').disabled = true; $('pm').textContent = 'רגע…';
      post({ act: 'preq', phone: p }).then(function(){ $('pcode').hidden = false; $('code').focus(); $('pm').textContent = 'אם המספר רשום אצלנו, תקבלו עכשיו שיחה עם הקוד.'; })
        .catch(function(x){ $('pgo').disabled = false; $('pm').textContent = x.code === 'night' ? 'אפשר לקבל שיחה בין 8:00 ל־22:00. בינתיים אפשר להיכנס עם מייל.' : x.code === 'shabbat' ? 'בשבת ובחג לא מתקשרים.' : x.code === 'phone' ? 'המספר לא תקין.' : 'אי אפשר להתקשר כרגע. אפשר להיכנס עם מייל.'; }); };
    $('pver').onclick = function(){ post({ act: 'pver', phone: $('ph').value.trim(), code: $('code').value.trim() }).then(function(j){ T = j.t; try { history.replaceState(null, '', '/dir/?t=' + T); } catch (e) {} show(); })
      .catch(function(){ $('pm').textContent = 'הקוד לא נכון או שפג תוקפו (אפשר לנסות עד 5 פעמים, תוך רבע שעה).'; }); };
  }
  var F = [['title', 'תואר'], ['first', 'שם פרטי'], ['last', 'שם משפחה'], ['wife', 'שם האשה'], ['father', 'שם האב'], ['fil', 'שם החותן'], ['street', 'רחוב ומספר'], ['city', 'עיר'], ['phone', 'טלפון בבית'], ['mobile', 'נייד'], ['email', 'מייל']];
  function show(){
    post({ act: 'get', t: T }).then(function(j){
      var h = '<div class="card"><h2>נכנסתם עם ' + (j.by === 'email' ? 'המייל' : 'הטלפון') + ': <span dir="ltr">' + esc(j.who) + '</span></h2>' + (j.events ? '<p>הפרטים שלכם נמצאים ברשימת המוזמנים של ' + j.events + ' אירועים.</p>' : '') + '<p>בעלי האירועים לא רואים את הטלפון ואת המייל. הם רואים רק שם, שם האב, שם החותן וכתובת, כדי לזהות אתכם.</p></div>';
      h += j.people.map(function(p){ return '<div class="card" data-p="' + p.id + '"><h2>הפרטים שלי בספרי הטלפונים</h2><div class="grid">' +
        F.map(function(f){ return '<label>' + f[1] + '<input data-f="' + f[0] + '" value="' + esc(p[f[0]]) + '"' + (/phone|mobile|email/.test(f[0]) ? ' dir="ltr"' : '') + (f[0] === 'email' ? ' type="email"' : /phone|mobile/.test(f[0]) ? ' type="tel"' : '') + '></label>'; }).join('') +
        '<label>שפה בשיחות<select data-f="lang"><option value="">עברית</option><option value="yi"' + (p.lang === 'yi' ? ' selected' : '') + '>אידיש</option></select></label></div>' +
        '<div class="btns"><button class="b pri" type="button" data-save>שמירה</button><button class="b no" type="button" data-del>מחיקה מספרי הטלפונים</button></div><p class="msg" role="status"></p></div>'; }).join('');
      if (!j.people.length && j.by === 'email') h += '<div class="card"><h2>המייל</h2><label>כתובת חדשה<input type="email" id="ne" dir="ltr" autocomplete="email"></label>' +
        '<div class="btns"><button class="b pri" type="button" id="set">עדכון הכתובת</button><button class="b no" type="button" id="del">מחיקת המייל</button></div><p class="msg" id="m" role="status"></p></div>';
      if (j.phones.length) h += '<div class="card"><h2>שיחות טלפון</h2>' + j.phones.map(function(p){ return '<div class="ph"><span dir="ltr">' + esc(p.p) + '</span>' + (p.blocked ? '<span>🔕 לא מקבל שיחות <button class="b" type="button" data-u="' + p.id + '">להחזיר</button></span>' : '<button class="b no" type="button" data-k="' + p.id + '">🔕 לא להתקשר אליי יותר</button>') + '</div>'; }).join('') + '<p class="msg" id="m2" role="status"></p></div>';
      B.innerHTML = h;
      if ($('set')) $('set').onclick = function(){ var e = $('ne').value.trim(); if (!/@/.test(e)) { $('m').textContent = 'נא לכתוב כתובת חדשה.'; return; }
        post({ act: 'set', t: T, email: e }).then(function(){ $('m').textContent = '✓ הכתובת עודכנה.'; }).catch(function(x){ $('m').textContent = x.code === 'email' ? 'הכתובת לא תקינה.' : 'לא הצליח. נסו שוב.'; }); };
      if ($('del')) $('del').onclick = function(){ var b = $('del'); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'בטוח? ללחוץ שוב למחיקה'; return; }
        post({ act: 'del', t: T }).then(function(){ B.innerHTML = '<div class="card"><h2>✓ המייל נמחק</h2><p>לא יישלחו יותר הזמנות לכתובת הזאת דרך MyLuach.</p></div>'; }).catch(function(){ $('m').textContent = 'לא הצליח. נסו שוב.'; }); };
      B.onclick = function(e){
        var card = e.target.closest('[data-p]'), msg = card && card.querySelector('.msg');
        if (e.target.closest('[data-save]')) { var p = {}; card.querySelectorAll('[data-f]').forEach(function(i){ p[i.dataset.f] = i.value.trim(); }); msg.textContent = 'שומר…';
          post({ act: 'pset', t: T, id: card.dataset.p, p: p }).then(function(){ msg.textContent = '✓ נשמר. הפרטים שתיקנתם לא יידרסו בעדכונים הבאים של המאגר.'; })
            .catch(function(x){ msg.textContent = { name: 'צריך לפחות שם פרטי או שם משפחה.', contact: 'צריך לפחות טלפון או מייל (אפשר במקום זה למחוק את הרשומה).', dup: 'המספר הזה כבר רשום אצלנו על משפחה אחרת. לתיקון: contact@myluach.org', blocked: 'המספר הזה חסום לשיחות.' }[x.code] || 'לא הצליח. נסו שוב.'; }); return; }
        var d = e.target.closest('[data-del]');
        if (d) { if (!d.dataset.sure) { d.dataset.sure = 1; d.textContent = 'בטוח? ללחוץ שוב (אפשר גם לסמן חסימה לשיחות למטה)'; return; }
          post({ act: 'pdel', t: T, id: card.dataset.p }).then(function(){ card.innerHTML = '<h2>✓ נמחקתם מספרי הטלפונים</h2><p>בעלי אירועים לא יוכלו לבחור אתכם מהמאגר. כדי שגם לא יתקשרו אליכם מאירועים שכבר הוסיפו אתכם, לחצו למטה "לא להתקשר אליי יותר".</p>'; }).catch(function(){ msg.textContent = 'לא הצליח. נסו שוב.'; }); return; }
        var k = e.target.closest('[data-k],[data-u]'); if (!k) return;
        post({ act: k.dataset.k ? 'block' : 'unblock', t: T, id: k.dataset.k || k.dataset.u }).then(show).catch(function(){ var m = $('m2'); if (m) m.textContent = 'לא הצליח. נסו שוב.'; }); };
    }).catch(function(e){ T = null; ask(e.code === 'token' ? 'הקישור לא בתוקף. אפשר להיכנס מחדש.' : ''); });
  }
  if (T) { B.innerHTML = '<p>טוען…</p>'; show(); } else ask();
})();
</script>
</body>
</html>
