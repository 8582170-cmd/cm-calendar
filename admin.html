<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול · MyLuach</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-180.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{--paper:#f6f7f4;--sheet:#fff;--ink:#172126;--mute:#5c686c;--line:#dde2df;--teal:#1f5c63;--teal-ink:#fff;--teal-soft:#e4eeec;--bad:#b3261e;--ok:#1f7a3a;--warn-bg:#fff4d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1517;--sheet:#172024;--ink:#e6ecea;--mute:#9aa7a8;--line:#28343a;--teal:#79c0b8;--teal-ink:#0d1a1b;--teal-soft:#1b2b2d;--bad:#ef8a80;--ok:#7fd49a;--warn-bg:#3a3018;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f1517;--sheet:#172024;--ink:#e6ecea;--mute:#9aa7a8;--line:#28343a;--teal:#79c0b8;--teal-ink:#0d1a1b;--teal-soft:#1b2b2d;--bad:#ef8a80;--ok:#7fd49a;--warn-bg:#3a3018;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Assistant",Arial,sans-serif;padding-inline:16px}
.wrap{max-width:980px;margin-inline:auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px}
h2{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 12px;color:var(--mute);font-size:14px}
/* כיווץ ופתיחה של כל חלק בניהול (נשמר בדפדפן) */
section>h2{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
section>h2::before{content:"▾";font-size:.8em;color:var(--mute,#5c686c);transition:transform .15s}
section.fold>h2::before{transform:rotate(90deg)}
section.fold>*:not(h2){display:none!important}
section.fold{padding-block:10px}section.fold>h2{margin:0}
.fold-all{position:fixed;bottom:12px;left:12px;z-index:50;display:flex;gap:6px}
.fold-all button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #c9d1ce;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .12)}
section{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
input[type=number]{width:90px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:8px 16px;border-radius:9px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:start;font-size:13px;color:var(--mute);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row label{display:flex;gap:6px;align-items:center;font-weight:600}
.plans{display:inline-flex;gap:10px;flex-wrap:wrap}
.plans label{font-weight:400;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.note{font-size:13px;color:var(--mute)}
.warn{background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-weight:700}
.msg{font-weight:700}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.st-paid{color:var(--ok);font-weight:700}.st-failed,.st-underpaid{color:var(--bad);font-weight:700}.st-pending{color:var(--mute)}
.login{max-width:360px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
.preview{font-size:14px;color:var(--mute)}
.bar{position:sticky;bottom:0;background:var(--paper);padding-block:10px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.tk-list{max-height:420px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}.tk-i{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5}
.cms-wrap{display:flex;gap:12px;margin-top:10px;align-items:flex-start}.cms-wrap iframe{flex:1;min-width:0;height:720px;border:1px solid var(--line);border-radius:10px;background:#fff}.cms-vars{flex:0 0 190px;display:flex;flex-direction:column;gap:8px;font-size:14px}.cms-vars label{display:flex;justify-content:space-between;align-items:center;gap:6px}@media (max-width:800px){.cms-wrap{flex-direction:column}.cms-wrap iframe{width:100%;height:560px}.cms-vars{flex-basis:auto;width:100%}}
.yze-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;margin:8px 0}.yze-r{border:1px solid #dde3e2;border-radius:10px;padding:8px}.yze-r.ch{border-color:#d08a1a;background:#fffaf0}.yze-r textarea{width:100%;margin-top:6px;font:inherit}.yze-r .row{gap:6px;flex-wrap:wrap;align-items:center}.yze-bar{position:sticky;bottom:0;background:#fff;padding:6px 0}
.purge{margin-top:12px;padding:10px;border:1px dashed #d9b4b0;border-radius:10px}.purge .row{flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}.btn.danger{color:#b4231b;border-color:#e3b5b1}.pg-msg{font-size:13px}
</style>
<script src="/assets/library/index.js?v=1"></script>
<script src="/assets/articles-list.js?v=1"></script>
<style>.libg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.libc{display:flex;flex-direction:column;gap:4px;border:1px solid #ddd;border-radius:10px;padding:6px;background:#fff}.libc.off{opacity:.45}.libc img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px}.libc input:not([type=checkbox]),.libc select{width:100%}.pg-f{display:flex;flex-direction:column;gap:3px;font-size:14px}.pg-tb{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;position:sticky;top:0;background:#fff;padding:6px 0;z-index:2}.pg-tb .btn{padding:4px 10px;font-size:14px}.pg-body{min-height:340px;border:1.5px solid #cfd8da;border-radius:10px;padding:14px 18px;background:#fff;font-size:17px;line-height:1.7;margin-top:6px}.pg-body:focus{outline:2px solid #1f5c63}.pg-body h2{font-size:24px}.pg-body h3{font-size:19px}.pg-body blockquote{border-inline-start:4px solid #b8892d;margin:10px 0;padding:6px 14px;background:#faf6ec}.pg-body .art-box{background:#eef6f4;border-radius:10px;padding:10px 14px;margin:10px 0}.pg-body table{border-collapse:collapse}.pg-body td,.pg-body th{border:1px solid #ccc;padding:6px 10px;min-width:60px}.pg-body img{max-width:100%}.pg-src{width:100%;min-height:340px;font:13px/1.5 monospace;margin-top:6px}</style>
<script src="/assets/hpick.js?v=1" defer></script>
</head>
<body>
<div class="wrap" id="app">
  <form class="login" id="login">
    <h1>ניהול MyLuach</h1>
    <label>סיסמה<br><input type="password" id="pw" autocomplete="current-password" style="width:100%"></label>
    <button class="btn primary" type="submit">כניסה</button>
    <span class="msg bad" id="lmsg"></span>
  </form>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW='',D=null,C=null;
try{PW=sessionStorage.getItem('myluach-admin')||''}catch(e){}
const MAIL_KIND={refund:'החזר תשלום ללקוח',confirm:'אישור תזכורת',reminder:'תזכורת',test:'בדיקה',appt:'תזכורת לפגישה',purchase:'אישור רכישה ללקוח',owner:'הודעה לך על רכישה',welcome:'ברוכים הבאים (הרשמה)',alert:'התראת אחסון',other:'אחר'};
function mailRoute(M){
  const R=M.route||{},E=M.routeEnv||{},cp=R.caps||{},PN=['resend','brevo','mailjet','ses'],DEF={resend:[100,3000,0],brevo:[300,0,0],mailjet:[200,6000,30],ses:[0,0,0]};
  const v=x=>x==null?'':x;
  return '<h3 style="margin:18px 0 4px">ניתוב מיילים</h3><p class="sub">איזה ספק שולח כל סוג מייל, לפי סדר. ספק שהגיע למכסה היומית או החודשית מדולג, והמייל עובר לספק הבא ברשימה. אם משאירים ריק: משתנה הסביבה (MAIL_INVITE_ORDER / MAIL_OTHER_ORDER) ואם אין, ברירת המחדל. ספקים: resend, brevo, mailjet, ses.</p>'+
   '<div class="row"><label>הזמנות דיגיטליות<input id="mrInv" dir="ltr" value="'+esc((R.inv||[]).join(','))+'" placeholder="'+esc(E.inv||'brevo')+'"></label><label>לוח, ברכות ושאר האתר<input id="mrOth" dir="ltr" value="'+esc((R.other||[]).join(','))+'" placeholder="'+esc(E.other||'resend,mailjet,brevo')+'"></label></div>'+
   '<div class="scroll"><table class="tbl"><thead><tr><th>ספק</th><th>מחובר</th><th>נשלחו החודש</th><th>מכסה יומית</th><th>מכסה חודשית</th><th>מכסה לשעה</th></tr></thead><tbody>'+PN.map(k=>'<tr><td>'+k+'</td><td>'+((M.providers||{})[k]?'✅':'—')+'</td><td>'+((M.month||{})[k]||0)+'</td>'+['day','month','hour'].map((f,i)=>'<td><input type="number" min="0" data-mr="'+k+'.'+f+'" value="'+v((cp[k]||{})[f])+'" placeholder="'+(DEF[k][i]||'ללא')+'" style="width:84px"></td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
   '<p class="sub">0 או ריק בשדה מכסה: ברירת המחדל של הספק (בעמודות: יומית, חודשית, לשעה). כדי לבטל מגבלה לגמרי (חבילה בתשלום) הזינו מספר גדול, למשל 1000000.</p><div class="row"><button type="button" id="mrSave">שמירת ניתוב</button><span id="mrMsg"></span></div>'}
function mailReport(M){
  const P=['resend','brevo','mailjet','ses'],days=Object.keys(M.byDay||{}).sort().reverse();
  const tot={failed:0};days.forEach(d=>{const o=M.byDay[d];P.forEach(k=>tot[k]=(tot[k]||0)+(o[k]||0));tot.failed+=o.failed||0});
  const cell=v=>'<td style="font-variant-numeric:tabular-nums">'+(v||'')+'</td>';
  return '<section><h2>המיילים שהלקוחות מקבלים</h2><p class="sub">אחרי הרשמה: מייל ברוכים הבאים (פעם אחת). אחרי רכישה: אישור רכישה ללקוח, והודעה אליך. גם: החזר תשלום, דף הזמנה לאירוע, מתנה לבעל אירוע, ברכה מעוצבת, ואישור ותזכורות מהלוח המקוון. כאן רואים איך הם נראים ועורכים את הנוסח.</p><button class="btn" type="button" id="mpGo">הצגה ועריכה של המיילים</button><div id="mpOut"></div></section>'+
  '<section><h2>דוח מיילים</h2><p class="sub">מיילים שהאתר שלח (תזכורות, אישורים, בדיקות) ב-30 הימים האחרונים. מיילי הכניסה לחשבון נשלחים ישירות מ-Supabase ומופיעים בדוחות של השרת שמוגדר שם.</p>'+
   (days.length?'<div class="scroll"><table class="tbl"><thead><tr><th>תאריך</th>'+P.map(k=>'<th dir="ltr">'+k+'</th>').join('')+'<th>נכשלו</th></tr></thead><tbody>'+
    days.map(d=>{const o=M.byDay[d];return '<tr><td>'+new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})+'</td>'+P.map(k=>cell(o[k])).join('')+'<td class="'+(o.failed?'st-failed':'')+'">'+(o.failed||'')+'</td></tr>'}).join('')+
    '<tr style="font-weight:800"><td>סה״כ</td>'+P.map(k=>cell(tot[k])).join('')+cell(tot.failed)+'</tr></tbody></table></div>':'<p>עדיין אין נתונים.</p>')+
   (M.byKind&&Object.keys(M.byKind).length?'<p style="margin-top:12px"><b>לפי סוג (30 יום):</b> '+Object.entries(M.byKind).sort((a,b)=>b[1].ok-a[1].ok).map(([k,v])=>esc(MAIL_KIND[k]||k)+': '+v.ok+(v.failed?' <span class="st-failed">('+v.failed+' נכשלו)</span>':'')).join(' · ')+'</p>':'')+
   '<h3 style="margin:16px 0 6px">מי קיבל איזה מייל</h3>'+
   ((M.recent||[]).length&&!(M.recent||[]).some(l=>l.to_email)?'<p class="st-failed">לא נשמרים הנמען והנושא של המיילים. כדי לראות למי נשלח כל מייל, צריך להריץ פעם אחת ב-Supabase (SQL Editor) את הקוד שבקובץ tools/supabase_email_log2.sql. מהרגע הזה כל מייל יירשם עם הנמען.</p>':'')+
   ((M.recent||[]).length?'<div class="row"><select id="mlKind"><option value="">כל הסוגים</option>'+[...new Set(M.recent.map(l=>l.kind||'other'))].map(k=>'<option value="'+esc(k)+'">'+esc(MAIL_KIND[k]||k)+'</option>').join('')+'</select><input type="search" id="mlQ" placeholder="חיפוש לפי מייל או נושא" style="width:220px"><span class="sub" id="mlN"></span></div>'+
    '<div class="scroll" style="margin-top:8px;max-height:460px;overflow:auto"><table class="tbl" id="mlT"><thead><tr><th>זמן</th><th>סוג המייל</th><th>נשלח אל</th><th>נושא</th><th>שרת</th><th>מצב</th></tr></thead><tbody>'+
    M.recent.map(l=>'<tr data-k="'+esc(l.kind||'other')+'" data-s="'+esc(((l.to_email||'')+' '+(l.subject||'')).toLowerCase())+'"><td>'+new Date(l.created_at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})+'</td><td><b>'+esc(MAIL_KIND[l.kind]||l.kind||'')+'</b></td><td dir="ltr">'+esc(l.to_email||'—')+'</td><td>'+esc(l.subject||'')+'</td><td dir="ltr">'+esc(l.provider||'')+'</td><td class="'+(l.ok?'st-paid':'st-failed')+'"'+(l.error?' title="'+esc(l.error)+'"':'')+'>'+(l.ok?'נשלח':'נכשל'+(l.error?' ⓘ':''))+'</td></tr>').join('')+
    '</tbody></table></div><p class="sub">200 המיילים האחרונים. ב"נכשל" מעבירים את העכבר על ⓘ כדי לראות את השגיאה. למחיקת שורות: "מסד הנתונים" ← "מיילים שנשלחו".</p>':'<p class="sub">עוד לא נשלחו מיילים.</p>')+
   '</section>';
}
function api(body){return fetch('/api/admin',{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-password':PW},body:body?JSON.stringify(body):undefined}).then(r=>r.text().then(t=>{let j;try{j=JSON.parse(t)}catch(e){
  /* תשובה שאינה JSON: בדרך כלל דף שגיאה של Cloudflare (למשל חריגה מזמן העיבוד). מציגים את הקוד שלה */
  const code=(/Error (\d{3,4})/.exec(t)||[])[1],title=((/<title>([^<]*)/i.exec(t)||[])[1]||'').trim();throw Object.assign(new Error('השרת החזיר שגיאה '+r.status+(code?' (Cloudflare '+code+')':'')+(title?': '+title.slice(0,80):'')),{code:r.status})}
  if(!r.ok)throw Object.assign(new Error(j.error||j.message||('שגיאה '+r.status)),{code:r.status,j});return j}))}
function login(){api().then(d=>{try{sessionStorage.setItem('myluach-admin',PW);localStorage.setItem('myluach-maint-bypass','1')}catch(e){}D=d;C=JSON.parse(JSON.stringify(d.config||{}));render()})
  .catch(e=>{const m=$('#lmsg');if(m)m.textContent=e.code===429?'יותר מדי ניסיונות שגויים. אפשר לנסות שוב '+(e.j&&e.j.until?'בשעה '+new Date(e.j.until).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'מאוחר יותר')+'.':e.code===401?'סיסמה שגויה':e.code===503?'לא הוגדרה סיסמה: צריך להוסיף ב-Vercel את המשתנה ADMIN_PASSWORD (לפחות 8 תווים)':'שגיאה: '+(e.j&&e.j.message||e.message);try{sessionStorage.removeItem('myluach-admin')}catch(x){}})}
$('#login').onsubmit=e=>{e.preventDefault();PW=$('#pw').value;login()};
if(PW)login();

const IDS=()=>Object.keys(D.defaults);
const planChecks=(sel,name)=>'<span class="plans">'+IDS().map(id=>'<label><input type="checkbox" data-pl="'+name+'" value="'+id+'"'+(!sel||!sel.length||sel.indexOf(id)>=0?' checked':'')+'>'+esc(D.defaults[id].name)+'</label>').join('')+(/^c\d+$/.test(name)?'<label><input type="checkbox" data-pl="'+name+'" value="event"'+(sel&&sel.indexOf('event')>=0?' checked':'')+'>הזמנות דיגיטליות</label>':'')+'</span>';
const val=v=>v==null?'':v;
const cpnRow=(c,i)=>'<tr data-i="'+i+'"><td><input type="checkbox" data-k="on"'+(c.on?' checked':'')+'></td><td><input type="text" data-k="code" value="'+esc(c.code)+'" dir="ltr" style="width:130px;text-transform:uppercase"></td><td><input type="number" data-k="percent" min="1" max="100" value="'+val(c.percent)+'" style="width:70px"></td><td>'+planChecks(c.plans,'c'+i)+'</td><td><input type="date" data-k="until" value="'+esc(c.until)+'"></td><td><input type="number" data-k="max" min="0" value="'+val(c.max||0)+'" style="width:70px"></td><td>'+((D.uses||{})[String(c.code).toUpperCase()]||0)+'</td><td><input type="text" data-k="note" value="'+esc(c.note)+'" style="width:140px"></td><td><button class="btn danger" type="button" data-del="'+i+'">מחיקה</button></td></tr>';
function render(){
  C.plans=C.plans||{};C.sale=C.sale||{on:false,percent:20,plans:[],until:'',label:''};C.coupons=C.coupons||[];
  const eff=D.effective||{plans:{}};
  app.innerHTML='<div class="top"><h1>ניהול MyLuach</h1><div class="row"><a class="btn primary" href="/admin-events">ניהול אירועים</a><a class="btn" href="/admin-studio">סטודיו רקעים לברכות</a><button class="btn" type="button" id="out">יציאה</button></div></div>'+
  actSection()+mailSection()+custSection()+finSection()+subsSection()+gmSection()+dirSection()+schedSection()+healthSection()+maintSection()+alogSection()+secSection()+cronSection()+'<section><h2>הזמנות לאירועים</h2><p class="sub">כל מה שקשור לדפי ההזמנה (אירועים, מחירים, הודעות קוליות ו־SMS, מתנות ומיילים מתוזמנים) עבר לאזור נפרד.</p><a class="btn primary" href="/admin-events">לניהול האירועים ←</a></section>'+msgSection()+fbSection()+usageSection()+
  (D.testAmount?'<div class="warn">מצב בדיקה פעיל: כל רכישת מסלול נגבית כ־'+esc(D.testAmount)+' ₪, בלי קשר למחירים כאן. כדי לבטל: למחוק ב-Vercel את NEDARIM_TEST_AMOUNT ולעשות Redeploy.</div>':'')+
  '<section><h2>מחירים</h2><p class="sub">שדה ריק = המחיר שבקובץ (מוצג באפור). הנחת היכרות היא הנחה קבועה באחוזים למסלול. "מוצג למכירה" כבוי = המסלול לא מופיע באתר ולא נמכר (מי שכבר קנה ממשיך להשתמש בו).</p><div class="scroll"><table class="tbl"><thead><tr><th>מסלול</th><th>מחיר ₪</th><th>מחיר $</th><th>הנחת היכרות %</th><th>מחיר בפועל</th><th>מוצג למכירה</th></tr></thead><tbody>'+

      try{const r=await fetch('https://api.indexnow.org/indexnow',{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify({host:q.host,key:q.key,keyLocation:q.keyLocation,urlList:q.urls})});
        if(r.ok||r.status===202){ok=true;how='✅ נשלחו '+q.urls.length+' דפים, ובינג אישר ('+r.status+')'}else if(r.status===429){M.textContent='❌ בינג חוסם גם מהמחשב שלכם (429). נסו מחר.';B.disabled=false;return}else how='בינג ענה '+r.status+'. ';}catch(e){}
      if(!ok){for(let i=0;i<q.urls.length;i++){M.textContent='שולח מהדפדפן… '+(i+1)+' / '+q.urls.length;try{await fetch('https://www.bing.com/indexnow?url='+encodeURIComponent(q.urls[i])+'&key='+q.key,{mode:'no-cors'})}catch(e){}await new Promise(r=>setTimeout(r,300))}
        how=(how||'')+'✅ נשלחו '+q.urls.length+' דפים מהדפדפן, דף אחר דף (הדפדפן לא מקבל אישור מבינג, אז כדאי לבדוק מחר ב-Bing Webmaster שהדפים נסרקו)';ok=true}
      const m=await api({action:'indexmark',urls:q.urls});M.innerHTML='<div>'+how+'</div><div>נשארו לשליחה בפעם הבאה: '+m.left+' מתוך '+m.total+'</div><details><summary>אילו דפים נשלחו ('+q.urls.length+')</summary><div dir="ltr" style="font-size:13px;max-height:220px;overflow:auto">'+q.urls.map(u=>u.replace('https://www.myluach.org','').replace(/</g,'&lt;')||'/').join('<br>')+'</div></details>'}
    catch(e){M.textContent='❌ '+e.message}B.disabled=false};
  if($('#inNow'))$('#inNow').onclick=()=>{$('#inMsg').textContent='שולח…';api({action:'indexnow',max:+$('#inMax').value||100}).then(r=>{
    const L=[];
    /* בינג (שליחת כתובות עם מכסה): מופיע רק אם הוגדר BING_API_KEY */
    if(r.via==='vercel')L.push('↪️ השרת ב-Cloudflare נחסם, ולכן נשלח דרך Vercel');
    if(r.proxyErr)L.push('❌ השליחה דרך Vercel נכשלה: '+r.proxyErr);
    if(!r.hasKey)L.push('🔑 מפתח API של בינג: לא מוגדר (BING_API_KEY)');
    else{L.push(r.quota!=null?'🔑 מכסה בבינג היום לפני השליחה: '+r.quota:'🔑 בדיקת המכסה בבינג נכשלה: '+(r.quotaErr||'אין תשובה'));
      if(r.bing)L.push(r.bing===200?'✅ בינג (שליחת כתובות): נשלחו '+r.count:'❌ בינג (שליחת כתובות): '+r.bing+' '+(r.bingErr||''))}
    if(r.nothing)L.push('✅ אין מה לשלוח: כל '+r.total+' הדפים נשלחו לאחרונה');
    else if(r.status)L.push(r.status===200||r.status===202?'✅ IndexNow: נשלחו '+r.count:'❌ IndexNow: '+(r.status===429?'יותר מדי שליחות לאחרונה (חסום זמנית, נסו מחר)':r.status===403?'בינג לא מצא את קובץ המפתח באתר':r.status===422?'חלק מהכתובות לא שייכות לאתר':(r.error||r.status)));
    else if(r.error)L.push('❌ '+r.error);
    if(!r.nothing)L.push((r.ok?'נשארו לשליחה בפעם הבאה: ':'לא סומן כנשלח. נשארו לשליחה: ')+(r.ok?r.left:r.queue)+' מתוך '+r.total);
    $('#inMsg').innerHTML=L.map(x=>'<div>'+x.replace(/</g,'&lt;')+'</div>').join('')}).catch(e=>{$('#inMsg').textContent='❌ '+e.message})};
  if($('#cmsP')){$('#cmsP').value=CMS.page;$('#cmsP').onchange=e=>{CMS.page=e.target.value;cmsOpen()};
    $('#cmsSave').onclick=()=>{$('#cmsMsg').textContent='שומר…';$('#cmsF').contentWindow.postMessage({type:'cms-collect'},location.origin)};
    $('#cmsReset').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='בטוח? כל השינויים בדף יימחקו';return}api({action:'contentreset',page:CMS.page}).then(()=>{b.dataset.sure='';b.textContent='החזרת הדף למקור';cmsOpen()})};cmsOpen()}
  if($('#vBox'))voiceLoad();
  if($('#libBox'))libLoad();
  if($('#pgList'))pgLoad();
  actBind();shabbatBind();usageBind();yzBind();
  if($('#torahOn'))$('#torahOn').onchange=e=>{C.torah={...(C.torah||{}),on:e.target.checked}};
  if($('#dbT')){$('#dbT').value=DBS.name;$('#dbQ').value=DBS.q;const go=()=>{DBS={name:$('#dbT').value,q:$('#dbQ').value.trim(),offset:0};dbLoad()};$('#dbGo').onclick=go;$('#dbT').onchange=go;$('#dbQ').onkeydown=e=>{if(e.key==='Enter')go()};$('#dbCsv').onclick=dbCsv;dbLoad()}
  if($('#tkMode')){$('#tkMode').value=C.ticker.mode;$('#tkMode').onchange=e=>{C.ticker.mode=e.target.value;$('#tkList').innerHTML=''};
    $('#tkDay').onclick=()=>{$('#tkList').textContent='טוען…';api({action:'yzday',date:$('#tkDate').value}).then(r=>tickerList(r.items,r.heb)).catch(e=>{$('#tkList').textContent=e.message})};
    $('#tkFind').onclick=()=>{$('#tkList').textContent='מחפש…';api({action:'yzsearch',q:$('#tkQ').value}).then(r=>tickerList(r.items,'תוצאות חיפוש')).catch(e=>{$('#tkList').textContent=e.message})}}
  if($('#mrSave'))$('#mrSave').onclick=()=>{const caps={};document.querySelectorAll('[data-mr]').forEach(i=>{const[k,f]=i.dataset.mr.split('.');if(i.value!=='')(caps[k]=caps[k]||{})[f]=+i.value});const m=$('#mrMsg');m.textContent='שומר…';api({action:'mailroute',inv:$('#mrInv').value,other:$('#mrOth').value,caps}).then(()=>{m.textContent='✅ נשמר (נכנס לתוקף תוך חצי דקה)'}).catch(e=>{m.textContent='❌ '+e.message})};
  if($('#mtGo'))$('#mtGo').onclick=()=>{const m=$('#mtMsg');m.textContent='שולח…';api({action:'mailtest',to:$('#mtTo').value,provider:$('#mtP').value}).then(()=>{m.textContent='✅ נשלח. בדקו את תיבת הדואר (וגם בספאם).'}).catch(e=>{m.textContent='❌ '+e.message})};
  $('#out').onclick=()=>{try{sessionStorage.removeItem('myluach-admin')}catch(e){}location.reload()};
  app.addEventListener('input',preview);
  $('#addC').onclick=()=>{collect();C.coupons.push({on:true,code:'',percent:10,plans:[],until:'',max:0,note:''});render();const last=document.querySelector('#cpn tbody tr:last-child [data-k="code"]');if(last)last.focus()};
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='בטוח?';return}collect();C.coupons.splice(+b.dataset.del,1);render()});
  $('#save').onclick=()=>{collect();const m=$('#smsg');
    const bad=C.coupons.find(c=>!c.code||!(c.percent>0));if(bad){m.className='msg bad';m.textContent='לכל קופון צריך קוד והנחה גדולה מ-0';return}
    $('#save').disabled=true;m.className='msg';m.textContent='שומר…';
    api({action:'save',config:C}).then(()=>api()).then(d=>{D=d;C=JSON.parse(JSON.stringify(d.config||{}));render();const mm=$('#smsg');mm.className='msg ok';mm.textContent='נשמר. האתר מתעדכן תוך דקה.'})
      .catch(e=>{$('#save').disabled=false;m.className='msg bad';m.textContent='השמירה נכשלה: '+(e.j&&e.j.message||e.message)})};
}
})();
</script>

<script>
/* כיווץ חלקים בניהול: בכניסה הכל מכווץ, ולחיצה על כותרת פותחת או סוגרת אותה (לא פעיל כשיש תפריט צד) */
(function(){
  if(window.ADMIN_NAV){window.openSection=function(){};return}
  var O={};
  function key(sec){var h=sec.querySelector(':scope>h2');return h?h.textContent.trim().slice(0,40):''}
  function apply(){document.querySelectorAll('section').forEach(function(sec){var k=key(sec);if(k)sec.classList.toggle('fold',!O[k])})}
  document.addEventListener('click',function(e){var h=e.target.closest('section>h2');if(!h||e.target.closest('a,button,input,select,label'))return;var sec=h.parentNode,k=key(sec);if(O[k])delete O[k];else O[k]=1;sec.classList.toggle('fold',!O[k])});
  new MutationObserver(function(){apply();bar()}).observe(document.body,{childList:true,subtree:true});
  function bar(){if(document.querySelector('.fold-all')||!document.querySelector('section>h2'))return;var b=document.createElement('div');b.className='fold-all';
    b.innerHTML='<button type="button" data-f="1">כיווץ הכל</button><button type="button" data-f="0">פתיחת הכל</button>';
    b.onclick=function(e){var t=e.target.closest('[data-f]');if(!t)return;O={};if(t.dataset.f==='0')document.querySelectorAll('section').forEach(function(sec){var k=key(sec);if(k)O[k]=1});apply()};document.body.appendChild(b)}
  /* פתיחה של חלק מתוך הקוד (למשל "✉ תשובה" פותח את שליחת המייל) */
  window.openSection=function(sec){var k=key(sec);if(k){O[k]=1;sec.classList.remove('fold')}};
  apply();bar();
})();
</script>
