<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול מכירה סינית · MyLuach</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--navy:#15203B;--gold:#C9A24B;--gold2:#E6C36F;--cream:#FBF4DF;--cream-line:#E8D9A8;--cream-ink:#4A3A0E;--bg:#F3F4F7;--ink:#1B2338;--mute:#505869;--line:#DFE2EA;--line2:#C5CAD6;--bad:#A3261B;--good:#1C7A56}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Heebo,Arial,sans-serif}
h1,h2,h3{margin:0}h1{font-family:"Frank Ruhl Libre",serif;font-size:28px}h2{font-size:19px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#8A6516}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 220px;max-width:260px;background:var(--navy);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:4px}
nav.side .ttl{font-family:"Frank Ruhl Libre",serif;font-size:21px;font-weight:700;padding:0 10px}
nav.side .org{font-size:13px;color:var(--gold2);padding:0 10px 12px}
nav.side button,nav.side a{display:block;text-align:right;width:100%;padding:10px 12px;border-radius:8px;border:0;background:transparent;color:#D5DAE6;font-size:15px;cursor:pointer;text-decoration:none;min-height:42px}
nav.side button[aria-current="page"]{background:var(--gold2);color:var(--navy);font-weight:700}
nav.side button:hover{background:#1F2C4D}nav.side button[aria-current="page"]:hover{background:var(--gold2)}
main{flex:999 1 560px;min-width:0;padding:28px 32px 60px;display:flex;flex-direction:column;gap:22px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}.kpi span{font-size:13px;color:var(--mute)}.kpi b{font-size:24px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
label.f small,.hint{font-weight:400;color:var(--mute);font-size:13px}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input:not([type]),select,textarea{height:42px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;width:100%}
textarea{height:auto;min-height:80px;padding:8px 10px;resize:vertical}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;min-height:32px;cursor:pointer}label.ck input{width:18px;height:18px}
.btn{height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.bad{color:var(--bad);border-color:#E3B3AD}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:right}
th{background:#F8F9FB;color:var(--mute);font-weight:500;padding:10px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid #EEF0F4;vertical-align:top}
td input,td select{height:38px;min-width:70px}
tr.click{cursor:pointer}tr.click:hover{background:#FAFAF6}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:#E4E7EF}
.pill.ok{background:#DDF1E7;color:#145A3F}.pill.wait{background:var(--cream);color:var(--cream-ink)}.pill.bad{background:#FBE9E7;color:var(--bad)}
.flash{position:fixed;bottom:18px;left:18px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:420px}
.flash.bad{background:var(--bad)}
.note{background:var(--cream);border:1px solid var(--cream-line);color:var(--cream-ink);border-radius:10px;padding:12px 14px;font-size:14px}
.mono{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.two>*{flex:1 1 320px;min-width:0}
.drawbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.win{width:100%;max-width:560px;background:var(--navy);color:#fff;border-radius:14px;padding:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;text-align:right}
.win .s{font-size:36px;font-weight:700;letter-spacing:3px;direction:ltr}.win small{color:#D5DAE6}.win .k{color:var(--gold2);font-size:13px}
.drawgo{min-height:62px;padding:0 40px;border:0;border-radius:14px;background:var(--gold);color:var(--navy);font-size:21px;font-weight:700;cursor:pointer}
.prodlist{display:flex;flex-direction:column;gap:8px}
.prodlist button{min-height:52px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;text-align:right;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prodlist button[aria-pressed="true"]{border-color:var(--gold);background:var(--cream)}
.full{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:30px}
.full .p{font-family:"Frank Ruhl Libre",serif;font-size:clamp(36px,6vw,70px)}.full .s{font-size:clamp(60px,12vw,150px);font-weight:700;letter-spacing:6px;color:var(--gold2);direction:ltr}.full .n{font-size:clamp(28px,4vw,50px)}
.shuf{font-size:clamp(40px,8vw,110px);font-weight:700;direction:ltr;color:#D5DAE6;letter-spacing:4px}
:focus-visible{outline:3px solid #2A5BD7;outline-offset:2px}
@media print{nav.side,.noprint,.flash{display:none!important}main{padding:0}body{background:#fff}}
</style>
<script src="/assets/config.js"></script>
<script src="/assets/auction-price.js?v=1"></script>
</head>
<body>
<div class="app"><nav class="side noprint" id="nav" aria-label="ניהול המכירה"></nav><main id="box"><p>טוען…</p></main></div>
<div class="flash" id="flash" role="status" hidden></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},box=$('box'),nav=$('nav');
var API='/api/pricing?c=_auction',KEY='myluach-auth',TK='';
var Q=new URLSearchParams(location.search),SLUG=Q.get('s')||'',TAB=Q.get('t')||'ov';
var S=null,REPS=null,CUST=null,ORD=null,REP=null,DRAWS=null,SEL=null,ME={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nis(n){return (Math.round(+n*100)/100).toLocaleString('he-IL')+' ₪'}
function dt(d){try{return d?new Date(d).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):''}catch(e){return ''}}
function flash(t,bad){var m=$('flash');m.textContent=t;m.className='flash'+(bad?' bad':'');m.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(function(){m.hidden=true},4500)}
function sess(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function tok(){var j=sess();if(!j)return Promise.resolve('');
  if(j.access_token&&(!j.expires_at||j.expires_at*1000>Date.now()+60000))return Promise.resolve(j.access_token);
  var C=window.MYLUACH_CFG||{};if(!j.refresh_token||!C.supabaseUrl)return Promise.resolve('');
  return fetch(C.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:j.refresh_token})})
   .then(function(r){return r.ok?r.json():null}).then(function(n){if(!n||!n.access_token)return '';try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},j,{access_token:n.access_token,refresh_token:n.refresh_token||j.refresh_token,expires_at:n.expires_at})))}catch(e){}return n.access_token}).catch(function(){return ''})}
function call(b){return tok().then(function(t){TK=t;return fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:JSON.stringify(Object.assign({s:SLUG},b))})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){j._st=r.status;if(r.status===401)login();if(j.error==='setup')flash(j.message,1);return j})})}
function login(){nav.innerHTML='';box.innerHTML='<div class="card" style="max-width:560px"><h1>ניהול מכירה סינית</h1><p>כדי לנהל מכירה צריך להיכנס לחשבון באתר. הכניסה בחינם, עם כתובת מייל.</p><div class="acts"><a class="btn pri" href="/app.html#login&back='+encodeURIComponent(location.pathname+location.search)+'">כניסה לחשבון</a></div></div>'}
function go(t,s){var u=new URL(location.href);if(s!==undefined){u.searchParams.set('s',s);SLUG=s}u.searchParams.set('t',t);history.replaceState(null,'',u);TAB=t;show()}
function csv(name,head,rows){var e=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var t='﻿'+[head].concat(rows).map(function(r){return r.map(e).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()}
function table(head,rows,cls){return '<div class="tw"><table><thead><tr>'+head.map(function(h){return '<th scope="col">'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+head.length+'" class="hint">אין נתונים</td></tr>')+'</tbody></table></div>'}
function pill(st){return {paid:'<span class="pill ok">שולם</span>',pending:'<span class="pill wait">ממתין</span>',failed:'<span class="pill bad">נכשל</span>',underpaid:'<span class="pill bad">שולם חלקית</span>',refunded:'<span class="pill">זוכה</span>'}[st]||esc(st)}
function chName(c){return {web:'אתר',phone:'טלפון',manual:'ידני',rep:'דרך נציג'}[c]||c}
var PUB=location.origin+'/auction?s=';
document.addEventListener('click',function(e){var b=e.target.closest('[data-cpw]');if(b&&navigator.clipboard)navigator.clipboard.writeText(b.dataset.cpw).then(function(){flash('הקישור הועתק')})});

tok().then(function(t){TK=t;if(!t)return login();SLUG?loadSale().then(show):listView()});

/* ===== רשימת המכירות ===== */
function listView(){nav.innerHTML='<div class="ttl">מכירה סינית</div><div class="org">ניהול</div>';
  call({a:'mine'}).then(function(j){if(j._st!==200)return;ME=j;
    var h='<div class="hd"><h1>המכירות שלי</h1></div>';
    h+=table(['שם','כתובת','מצב',''],j.sales.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="mono">'+esc(s.slug)+'</td><td>'+(s.open?'<span class="pill ok">פתוחה</span>':s.status==='draft'?'<span class="pill wait">טיוטה</span>':'<span class="pill">סגורה</span>')+'</td><td><button class="btn dark" data-open="'+esc(s.slug)+'">ניהול</button></td></tr>'}));
    if(j.site.open||j.admin)h+='<div class="card" style="max-width:620px"><h2>מכירה חדשה</h2><div class="two"><label class="f" for="nn">שם הארגון / המכירה<input id="nn"></label><label class="f" for="ns">כתובת הדף (באנגלית)<input id="ns" dir="ltr" placeholder="beit-chinuch"><small>הדף יהיה myluach.org/auction?s=<span id="nsv">…</span></small></label></div>'
      +(j.admin?'<label class="f" for="nm">מייל של מנהל המכירה בארגון (לא חובה)<input id="nm" type="email" dir="ltr"><small>הוא יקבל מייל עם קישור, וייכנס לניהול עם המייל הזה. אפשר להוסיף עוד מנהלים אחר כך בהגדרות המכירה</small></label>':'')
      +'<div class="acts"><button class="btn pri" id="mk">יצירת המכירה</button></div></div>';
    else h+=reqForm();
    if(j.admin)h+='<div id="stats"></div><div id="reqs"></div>';
    if(j.admin)h+='<div class="card" style="max-width:620px"><h2>הגדרות האגף (בעל האתר)</h2><label class="ck"><input type="checkbox" id="so"'+(j.site.open?' checked':'')+'> כל משתמש רשום יכול לפתוח מכירה</label><label class="ck"><input type="checkbox" id="sp"'+(j.site.sitePay?' checked':'')+'> סליקה דרך האתר (חשבון נדרים פלוס של MyLuach)</label><label class="ck"><input type="checkbox" id="sk"'+(j.site.kehilot?' checked':'')+'> סליקת קשר / קהילות</label><label class="ck"><input type="checkbox" id="sc"'+(j.site.cancel?' checked':'')+'> מנהלי מכירות יכולים לאפשר ביטול הזמנות ששולמו (כל מכירה מחליטה בנפרד)</label><p class="hint">סליקה דרך האתר: הכסף נכנס לחשבון של האתר, וההעברה לארגון ידנית.</p><div id="ipsbox" class="note" hidden></div><label class="f" for="snote">הערות פנימיות<textarea id="snote">'+esc(j.site.note)+'</textarea></label><div class="acts"><button class="btn dark" id="ssave">שמירה</button><label class="ck"><input type="checkbox" id="sall"> להציג ברשימה למעלה את המכירות של כל הארגונים (לא רק אלה שאני מנהל)</label></div></div>';
    box.innerHTML=h;
    box.onclick=function(e){var b=e.target.closest('[data-open]');if(b){location.href='?s='+b.dataset.open;return}
      var m=e.target.closest('[data-rqmk]');if(m&&$('nn')){$('nn').value=m.dataset.org;if($('nm'))$('nm').value=m.dataset.mail;$('mk').dataset.req=m.dataset.rqmk;$('ns').focus();window.scrollTo(0,0);flash('ממלאים כתובת לדף ולוחצים "יצירת המכירה"');return}
      var x=e.target.closest('[data-rqx]');if(x){call({a:'site',reqDone:x.dataset.rqx}).then(function(){x.closest('.note').remove()})}};
    if($('ns'))$('ns').oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'');$('nsv').textContent=this.value||'…'};
    if(!j.site.open&&!j.admin)wireReq();
    if(j.admin){siteStats();}
    if($('mk'))$('mk').onclick=function(){call({a:'create',name:$('nn').value,slug:$('ns').value,managers:$('nm')?[$('nm').value]:[],req:$('mk').dataset.req||null}).then(function(r){if(r.slug)location.href='?s='+r.slug+'&t=set';else flash(r.message||'לא נוצר',1)})};
    if(j.admin)call({a:'site'}).then(function(r){var rq=(r.requests||[]).filter(function(x){return !x.done});
      if($('reqs'))$('reqs').innerHTML=rq.length?'<div class="card"><h2>בקשות לפתיחת מכירה ('+rq.length+')</h2>'+rq.map(function(x){return '<div class="note" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><span><b>'+esc(x.org)+'</b> · '+esc(x.name)+' · <span dir="ltr">'+esc(x.phone||'')+'</span> · <span dir="ltr">'+esc(x.email||'')+'</span>'+(x.note?'<br><span style="white-space:pre-line">'+esc(x.note)+'</span>':'')+'<br><small>'+dt(x.at)+'</small></span><span class="acts"><button class="btn dark" data-rqmk="'+esc(x.id)+'" data-org="'+esc(x.org)+'" data-mail="'+esc(x.email||'')+'">פתיחת מכירה עבורם</button><button class="btn" data-rqx="'+esc(x.id)+'">סגירת הבקשה</button></span></div>'}).join('')+'</div>':'';
      var el=$('ipsbox');if(!el)return;el.hidden=false;
      el.innerHTML='<b>כתובות השרתים ששלחו אישורי תשלום מנדרים פלוס:</b> '+(r.ips&&r.ips.length?'<span class="mono">'+esc(r.ips.join(','))+'</span>':'עוד לא התקבל אישור תשלום')+'<br><b>מוגדר כרגע ב-NEDARIM_CALLBACK_IPS:</b> '+(r.ipsSet?'<span class="mono">'+esc(r.ipsSet)+'</span>':'לא מוגדר (כל כתובת מתקבלת)')})
    if($('ssave'))$('ssave').onclick=function(){call({a:'site',set:{open:$('so').checked,sitePay:$('sp').checked,kehilot:$('sk').checked,cancel:$('sc').checked,note:$('snote').value}}).then(function(r){flash(r.site?'נשמר':'לא נשמר',!r.site)})};
    if($('sall'))$('sall').onchange=function(){if(this.checked)call({a:'mine',all:1}).then(function(r){box.querySelector('tbody').innerHTML=r.sales.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="mono">'+esc(s.slug)+'</td><td>'+esc(s.status)+'</td><td><button class="btn dark" data-open="'+esc(s.slug)+'">ניהול</button></td></tr>'}).join('')})};
  })}

function reqForm(){return '<div class="card" style="max-width:620px"><h2>בקשה לפתיחת מכירה סינית</h2><p class="hint" style="margin:0">פתיחת מכירות עצמאית עוד לא פתוחה. שלחו בקשה ונחזור אליכם.</p><div class="two"><label class="f" for="q1">שם הארגון<input id="q1"></label><label class="f" for="q2">איש קשר<input id="q2"></label><label class="f" for="q3">טלפון<input id="q3" type="tel" dir="ltr"></label><label class="f" for="q4">מייל<input id="q4" type="email" dir="ltr" value="'+esc(ME.email||'')+'"></label></div><label class="f" for="q5">פרטים (מתי המכירה, כמה מוצרים, טלפון / אתר)<textarea id="q5"></textarea></label><div class="acts"><button class="btn pri" id="qgo">שליחת הבקשה</button></div></div>'}
function wireReq(){$('qgo').onclick=function(){var b=this;b.disabled=true;call({a:'request',org:$('q1').value,name:$('q2').value,phone:$('q3').value,email:$('q4').value,note:$('q5').value}).then(function(r){b.disabled=false;if(r.ok){b.closest('.card').innerHTML='<h2>הבקשה נשלחה</h2><p>תודה! נחזור אליכם בהקדם.</p>'}else flash(r.message||'לא נשלח',1)})}}
var MN={nedarim:'נדרים פלוס',kehilot:'קשר',phonecc:'אשראי בטלפון',rep:'מזומן דרך נציג',manual:'ידני',later:'תשלום מאוחר',site:'דרך האתר'};
function siteStats(){call({a:'siteStats'}).then(function(r){if(!r.sales||!$('stats'))return;var T=r.total;
  $('stats').innerHTML='<div class="card"><div class="hd"><h2>כל המכירות באתר</h2><button class="btn" id="stx">אקסל</button></div><div class="grid"><div class="kpi"><span>מכירות</span><b>'+T.sales+'</b></div><div class="kpi"><span>פתוחות עכשיו</span><b>'+T.open+'</b></div><div class="kpi"><span>הזמנות ששולמו</span><b>'+T.orders+'</b></div><div class="kpi"><span>סך הכל</span><b>'+nis(T.amount)+'</b></div>'+Object.keys(T.m).map(function(k){return '<div class="kpi"><span>'+esc(MN[k]||k)+'</span><b>'+nis(T.m[k])+'</b></div>'}).join('')+'</div>'

  return '<div style="display:flex;flex-direction:column;gap:8px"><b>'+label+'</b><div id="'+id+'pv">'+pv+'</div><input id="'+id+'" dir="ltr" value="'+esc(val||'')+'" placeholder="https://..." aria-label="'+label+' (כתובת)"><div class="acts"><label class="btn" style="cursor:pointer">העלאה<input type="file" accept="'+accept+'" data-up="'+id+'" data-kind="'+kind+'" hidden></label><button type="button" class="btn bad" data-clr="'+id+'">הסרה</button></div><small class="hint">'+hint+'</small></div>'}
var FAQ_DEMO=[['איך מתבצעת ההגרלה?','לכל כרטיס יש מספר סידורי. לפני כל הגרלה רשימת הכרטיסים של המוצר מעורבבת שלוש פעמים, ורק אז מוגרל כרטיס זוכה, באופן ממוחשב ואקראי. במוצר עם כמה הגרלות, כל הגרלה נעשית בנפרד.'],['מתי ההגרלה?','ההגרלה תתקיים ב[תאריך ושעה], ב[מקום]. הזוכים יקבלו הודעה בטלפון ובמייל.'],['איך אדע את מספרי הכרטיסים שלי?','מיד אחרי התשלום המספרים מוצגים במסך ונשלחים למייל. ברכישה בטלפון הם מושמעים בסוף השיחה.'],['אפשר לקנות בטלפון?','כן, בקו [מספר הקו]. מקישים את מספר המוצר ואת כמות הכרטיסים. אפשר גם לשמור סל ולהשלים בהתקשרות הבאה.'],['מה זה חבילה?','חבילה נותנת מחיר מוזל: כמה כרטיסים לחלוקה בין המוצרים, הרכב קבוע של כרטיסים, או כרטיסים בשווי מסוים. כרטיסים מעבר לחבילה בתשלום רגיל.'],['אם אני זוכה, איך מקבלים את המוצר?','[איסוף / משלוח: פרטים]. מוצר שלא נאסף עד [תאריך] [מה קורה].'],['האם מקבלים קבלה?','כן, הקבלה נשלחת מחברת הסליקה למייל שמילאתם.']];
function faqRow(q,a){return '<div class="fqr" style="border:1px solid #EEF0F4;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px"><input class="fq-q" value="'+esc(q||'')+'" placeholder="שאלה" aria-label="שאלה"><textarea class="fq-a" placeholder="תשובה" aria-label="תשובה" style="min-height:60px">'+esc(a||'')+'</textarea><div><button type="button" class="btn bad" data-fqdel>הסרה</button></div></div>'}
function readFaq(){return [].map.call(document.querySelectorAll('.fqr'),function(r){return {q:r.querySelector('.fq-q').value.trim(),a:r.querySelector('.fq-a').value.trim()}}).filter(function(x){return x.q&&x.a})}
var TERMS_DEMO='תקנון המכירה הסינית של [שם הארגון]\n\n1. המכירה נערכת על ידי [שם הארגון], [מספר עמותה / מוסד], לטובת [מטרה].\n2. תקופת המכירה: מ־[תאריך] ועד [תאריך ושעה]. אחרי סגירת המכירה לא ניתן לרכוש כרטיסים.\n3. כל כרטיס מקנה השתתפות בהגרלה של המוצר שעבורו נרכש בלבד. מחיר כרטיס ומספר ההגרלות מופיעים ליד כל מוצר.\n4. ההגרלה תיערך ב־[תאריך] באופן ממוחשב ואקראי, בנוכחות [נוכחים / עורך דין]. תוצאות ההגרלה סופיות.\n5. כרטיסים נכנסים להגרלה רק לאחר שהתשלום עבורם התקבל במלואו.\n6. הזוכים יקבלו הודעה בטלפון ו/או במייל. מוצר שלא נדרש עד [תאריך] [יועבר לזוכה החלופי הבא / יוגרל מחדש].\n7. המוצרים יימסרו כפי שהם. תמונות המוצרים להמחשה בלבד.\n8. [מדיניות ביטולים והחזרים].\n9. עובדי הארגון ובני משפחותיהם [רשאים / אינם רשאים] להשתתף.\n10. הארגון רשאי לשנות את מועד ההגרלה מסיבות שאינן בשליטתו, בהודעה מראש לרוכשים.\n11. ההגרלה נערכת לפי היתר [מספר היתר, אם נדרש].\n12. בכל שאלה: [טלפון / מייל].';
function opt(L,v){return L.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+(o[2]?' disabled':'')+'>'+o[1]+'</option>'}).join('')}

function pay(){var p=S.cfg.pay||{},k=p.kesher||{},site=S.site||{};
  box.innerHTML='<h1>סליקה</h1><div class="card"><label class="f" for="pv">חברת הסליקה<select id="pv">'+opt([['nedarim','נדרים פלוס (חשבון הארגון)'],['kehilot','קשר / קהילות (חשבון הארגון)'+(site.kehilot?'':' (כבוי בהגדרות האתר)'),!site.kehilot],['site','סליקה דרך האתר (בקרוב)',!site.sitePay]],p.prov||'nedarim')+'</select><small>הכסף נכנס ישירות לחשבון הארגון. האתר לא נוגע בכסף.</small></label>'
   +'<div id="pn"'+((p.prov||'nedarim')==='nedarim'?'':' hidden')+'><div class="two"><label class="f" for="pm">מספר מוסד בנדרים פלוס<input id="pm" inputmode="numeric" dir="ltr" value="'+esc(p.mosad||'')+'"></label><label class="f" for="pa">קוד אימות לטופס (ApiValid)<input id="pa" dir="ltr" value="'+esc(p.apiValid||'')+'"><small>בממשק הניהול של נדרים פלוס, תחת "מפתחות API"</small></label></div>'
   +'<label class="f" for="pg">קטגוריה בנדרים פלוס (Groupe, לא חובה)<input id="pg" value="'+esc(p.groupe||'')+'"></label></div>'
   +'<div id="pk"'+(p.prov==='kehilot'?'':' hidden')+'><label class="f" for="k1">הקישור לדף התשלום בקשר<input id="k1" dir="ltr" value="'+esc(k.pageUrl||'')+'" placeholder="https://..."><small>בממשק הניהול של קשר: "פרויקטים ודפי תשלום" → יוצרים דף תשלום ומעתיקים את הקישור שלו</small></label>'
   +'<div class="two"><label class="f" for="k2">מספר דף התשלום (PaymentPageId, לא חובה)<input id="k2" dir="ltr" value="'+esc(k.pageId||'')+'"></label><label class="f" for="k3">שם משתמש ל-API של קשר<input id="k3" dir="ltr" value="'+esc(k.userName||'')+'"></label></div>'
   +'<label class="f" for="k4">סיסמת API של קשר<input id="k4" type="password" dir="ltr" autocomplete="new-password" placeholder="'+(k.hasPassword?'שמורה. להחלפה מקלידים חדשה':'')+'"><small>נשמרת בשרת ולא מוצגת שוב. משמשת לפתיחת דף תשלום עם סכום נעול ולבדיקה שהתשלום באמת עבר</small></label></div>'
   +'<div class="note">'+(S.provs.length?'הסליקה מוגדרת ופעילה.':'הסליקה עוד לא מוגדרת. בלי סליקה אי אפשר לפתוח את המכירה לרכישה באתר.')+'<br>הקבלות נשלחות לרוכשים מחברת הסליקה, לפי ההגדרות בחשבון הארגון.</div>'
   +'<div class="acts"><button class="btn pri" id="sv">שמירה</button>'+(k.hasPassword?'<button class="btn bad" id="kc">מחיקת סיסמת קשר</button>':'')+'</div></div>';
  $('pv').onchange=function(){$('pn').hidden=this.value!=='nedarim';$('pk').hidden=this.value!=='kehilot'};
  $('sv').onclick=function(){var K={pageUrl:$('k1').value,pageId:$('k2').value,userName:$('k3').value};if($('k4').value.trim())K.password=$('k4').value.trim();
    saveCfg({pay:{prov:$('pv').value,mosad:$('pm').value,apiValid:$('pa').value,groupe:$('pg').value,kesher:K}})};
  if($('kc'))$('kc').onclick=function(){saveCfg({pay:{kesher:{clearPassword:true}}})}}

/* --- מוצרים --- */
function prod(){var L=S.products.map(function(p){return Object.assign({},p,{cfg:Object.assign({},p.cfg||{})})});
  function row(p,i){var c=p.cfg||{};return '<tr data-i="'+i+'"><td><input type="number" data-k="num" value="'+(p.num||'')+'" style="width:80px" aria-label="מק&quot;ט"></td><td><input data-k="name" value="'+esc(p.name||'')+'" style="min-width:160px" aria-label="שם"></td><td><input type="number" data-k="price" min="0" value="'+(p.price!=null?p.price:'')+'" style="width:80px" aria-label="מחיר כרטיס"></td><td><input type="number" data-k="draws" min="1" value="'+(p.draws||1)+'" style="width:70px" aria-label="מספר הגרלות"></td>'
    +'<td><input type="number" data-c="maxPer" min="0" value="'+(c.maxPer||'')+'" style="width:70px" placeholder="ללא" aria-label="מגבלה לרוכש"></td><td><input type="number" data-c="reserves" min="0" value="'+(c.reserves||'')+'" style="width:60px" aria-label="זוכים חלופיים"></td><td><label class="ck"><input type="checkbox" data-c="repeatWin"'+(c.repeatWin?' checked':'')+'> כן</label></td>'
    +'<td><input data-k="descr" value="'+esc(p.descr||'')+'" aria-label="תיאור"><input data-c="sponsor" value="'+esc(c.sponsor||'')+'" placeholder="בחסות" style="margin-top:4px" aria-label="בחסות"><input data-k="img" dir="ltr" value="'+esc(p.img||'')+'" placeholder="https://… תמונה" style="margin-top:4px" aria-label="תמונה"><div class="acts" style="margin-top:4px">'+(p.img?'<img src="'+esc(p.img)+'" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px">':'')+'<label class="btn" style="cursor:pointer;height:36px">העלאת תמונה<input type="file" accept="image/png,image/jpeg,image/webp" data-pimg="'+i+'" hidden></label></div></td>'
    +'<td>'+(p.id?'<button class="btn" data-au="'+p.id+'">'+(p.audio?'החלפת שמע':'העלאת שמע')+'</button>'+(p.audio?'<br><audio controls src="'+esc(p.audio)+'" style="width:160px;margin-top:4px"></audio>'+(c.y?'<br><span class="pill ok">בטלפון</span>':'<br><span class="pill wait">רק באתר</span>'):''):'<span class="hint">שומרים קודם</span>')+'</td>'
    +'<td><label class="ck"><input type="checkbox" data-k="active"'+(p.active!==false?' checked':'')+'> פעיל</label><button class="btn bad" data-del="'+i+'" style="margin-top:4px">מחיקה</button></td></tr>'}
  function draw(){box.innerHTML='<div class="hd"><h1>מוצרים</h1><div class="acts"><button class="btn" id="add">+ מוצר</button><button class="btn" id="one">מחיר אחיד לכולם</button><button class="btn pri" id="sv">שמירה</button></div></div>'
    +'<p class="hint">מק"ט = המספר שמקישים בטלפון ומופיע על המוצר. מספר הגרלות: כמה זוכים במוצר (כשיותר מ-1, זה מוצג ללקוח). שמע: מושמע בטלפון אחרי הקשת המק"ט, וכשמבקשים לשמוע את כל המוצרים.</p>'
    +'<details class="hint" style="max-width:760px"><summary><b>מה זה "זוכים חלופיים"?</b></summary><p style="margin:6px 0 0">לפעמים זוכה לא נמצא (טלפון לא נכון, לא עונה), מוותר על הפרס, או שלא עומד בתנאי התקנון. כדי לא להגריל מחדש מול כולם, אפשר להגריל מראש זוכים חלופיים, לפי סדר: חלופי 1, חלופי 2 וכן הלאה. אם הזוכה המקורי לא מקבל את הפרס, הוא עובר לחלופי 1. אם גם הוא לא, לחלופי 2.</p><p style="margin:6px 0 0">המספר בעמודה הוא כמה זוכים חלופיים מותר להגריל במוצר. מגרילים אותם בלשונית "ביצוע ההגרלות", רק אחרי שכל ההגרלות הרגילות של המוצר בוצעו. הם לא מופיעים ברשימת הזוכים לציבור. 0 או ריק = בלי הגבלה (המנהל מחליט כמה להגריל).</p></details>'
    +table(['מק"ט','שם','מחיר כרטיס','הגרלות','מקסימום לרוכש','זוכים חלופיים','אותו אדם יזכה פעמיים','תיאור, חסות ותמונה','שמע לטלפון',''],L.map(function(p,i){return p.del?'':row(p,i)}))
    +'<input type="file" id="af" accept="audio/*" hidden>';
    $('add').onclick=function(){sync();var mx=L.reduce(function(m,p){return Math.max(m,+p.num||0)},100);L.push({num:mx+1,name:'',price:'',draws:1,cfg:{},active:true});draw()};
    $('one').onclick=function(){var v=prompt('מחיר כרטיס לכל המוצרים (₪):');if(v==null||isNaN(+v))return;sync();L.forEach(function(p){p.price=+v});draw()};
    $('sv').onclick=function(){sync();call({a:'products',list:L}).then(function(j){if(j.products){S.products=j.products;if(j.errors.length)flash(j.errors.map(function(e){return e.error}).join(' · '),1);else flash('נשמר');prod()}else flash(j.message||'לא נשמר',1)})};
    box.onclick=function(e){var d=e.target.closest('[data-del]');if(d){sync();var p=L[+d.dataset.del];if(!p.id)L.splice(+d.dataset.del,1);else if(confirm('למחוק את המוצר? (מחיקה תתבצע בשמירה)'))p.del=true;draw();return}
      var a=e.target.closest('[data-au]');if(a){$('af').dataset.p=a.dataset.au;$('af').click()}};
    box.onchange=function(e){var f=e.target.closest('[data-pimg]');if(!f||!f.files[0])return;var file=f.files[0],i=+f.dataset.pimg;f.value='';if(file.size>10e6)return flash('התמונה גדולה מדי (עד 10MB)',1);
      sync();flash('מעלה…');upload('product',file).then(function(url){L[i].img=url;draw();flash('התמונה הועלתה. לוחצים "שמירה"')}).catch(function(er){flash(er.message||'שגיאה',1)})};
    $('af').onchange=function(){var f=this.files[0],pid=this.dataset.p;this.value='';if(!f)return;if(f.size>15e6)return flash('הקובץ גדול מדי (עד 15MB)',1);
      var ext=(f.name.split('.').pop()||'mp3').toLowerCase();flash('מעלה…');
      call({a:'audioUrl',product:pid,ext:ext}).then(function(u){if(!u.upload)throw new Error(u.message||'אין אחסון');return fetch(u.upload,{method:'PUT',body:f}).then(function(r){if(!r.ok)throw new Error('העלאה נכשלה');return u.url})})
       .then(function(url){return call({a:'audioSet',product:pid,url:url})}).then(function(r){flash(r.warn||'הקובץ הועלה',!!r.warn);return loadSale()}).then(prod).catch(function(e){flash(e.message||'שגיאה',1)})};
  }
  function sync(){[].forEach.call(box.querySelectorAll('tr[data-i]'),function(tr){var p=L[+tr.dataset.i];[].forEach.call(tr.querySelectorAll('[data-k]'),function(x){p[x.dataset.k]=x.type==='checkbox'?x.checked:x.value});[].forEach.call(tr.querySelectorAll('[data-c]'),function(x){p.cfg[x.dataset.c]=x.type==='checkbox'?x.checked:x.value})})}
  draw()}

/* --- חבילות --- */
function pkgs(){var L=S.pkgs.map(function(k){return Object.assign({},k,{cfg:Object.assign({},k.cfg||{})})}),P=S.products;
  function card(k,i){var all=!k.products||!k.products.length,cm={};(k.comp||[]).forEach(function(c){cm[c.p]=c.n});
    return '<div class="card" data-i="'+i+'"><div class="two"><label class="f">שם החבילה<input data-k="name" value="'+esc(k.name||'')+'"></label><label class="f">סוג<select data-k="kind">'+opt([['free','כרטיסים לחלוקה חופשית'],['fixed','הרכב קבוע'],['credit','לפי שווי']],k.kind||'free')+'</select></label></div>'
     +'<div class="two"><label class="f">מחיר החבילה (₪)<input type="number" min="0" data-k="price" value="'+(k.price!=null?k.price:'')+'"></label>'
     +(k.kind==='credit'?'<label class="f">שווי לניצול (₪)<input type="number" min="0" data-k="credit" value="'+(k.credit||'')+'"></label>':k.kind==='fixed'?'<div class="hint">ההרכב: כמה כרטיסים מכל מוצר (ריק = כרטיס אחד בכל מוצר שהחבילה חלה עליו)</div>':'<label class="f">מספר כרטיסים<input type="number" min="1" data-k="qty" value="'+(k.qty||'')+'"></label>')+'</div>'
     +'<label class="f">תיאור (לא חובה)<input data-k="descr" value="'+esc(k.descr||'')+'"></label>'
     +'<details><summary>על אילו מוצרים החבילה חלה'+(all?' (כל המוצרים)':' ('+k.products.length+')')+'</summary><label class="ck"><input type="checkbox" data-allp'+(all?' checked':'')+'> כל המוצרים</label><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px">'+P.map(function(p){return '<label class="ck"><input type="checkbox" data-pp="'+p.id+'"'+(!all&&k.products.indexOf(p.id)>=0?' checked':'')+'> '+p.num+' · '+esc(p.name)+'</label>'}).join('')+'</div></details>'
     +(k.kind==='fixed'?'<details><summary>ההרכב הקבוע</summary><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px">'+P.map(function(p){return '<label class="f" style="font-weight:400">'+p.num+' · '+esc(p.name)+'<input type="number" min="0" data-cm="'+p.id+'" value="'+(cm[p.id]||'')+'"></label>'}).join('')+'</div></details>':'')
     +'<div class="two"><label class="f">בתוקף עד (לא חובה)<input type="date" data-c="until" value="'+esc(k.cfg.until||'')+'"></label><label class="f">ההקשה בטלפון<input type="number" min="1" max="9" data-c="key" value="'+(k.cfg.key||i+1)+'"></label></div>'
     +'<div class="acts"><label class="ck"><input type="checkbox" data-k="active"'+(k.active!==false?' checked':'')+'> פעילה</label><button class="btn bad" data-del="'+i+'">מחיקה</button></div></div>'}
  function draw(){box.innerHTML='<div class="hd"><h1>חבילות</h1><div class="acts"><button class="btn" id="add">+ חבילה</button><button class="btn pri" id="sv">שמירה</button></div></div><p class="hint">שלושה סוגים: כרטיסים לחלוקה חופשית (למשל 40 כרטיסים בין כל המוצרים), הרכב קבוע (למשל כרטיס אחד בכל מוצר), או לפי שווי (למשל כרטיסים בשווי 1,000 ₪ ב-750 ₪). כרטיסים מעבר לחבילה בתשלום רגיל.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">'+L.map(function(k,i){return k.del?'':card(k,i)}).join('')+'</div>';
    $('add').onclick=function(){sync();L.push({name:'',kind:'free',price:'',qty:40,cfg:{},active:true});draw()};

    city:[['עיר','רוכשים','הזמנות','סכום'],R.cities.map(function(c){return [c.city,c.buyers,c.orders,c.amount]})]};
  box.innerHTML='<div class="hd"><h1>דוחות</h1><div class="acts"><button class="btn" id="tk">רשימת כל הכרטיסים (אקסל)</button><button class="btn" onclick="print()">הדפסה</button></div></div>'
   +'<div class="grid"><div class="kpi"><span>גויס</span><b>'+nis(T.amount)+'</b></div><div class="kpi"><span>הזמנות</span><b>'+T.orders+'</b></div><div class="kpi"><span>כרטיסים</span><b>'+T.tickets+'</b></div><div class="kpi"><span>רוכשים</span><b>'+T.buyers+'</b></div><div class="kpi"><span>בלי מגייס</span><b>'+nis(T.noRep.amount)+'</b></div><div class="kpi"><span>ממתינות / נכשלו / זוכו</span><b>'+T.pending+' / '+T.failed+' / '+T.refunded+'</b></div></div>'
   +sec('prod','כרטיסים לפי מוצר',D.prod[0],D.prod[1])+sec('reps','מגייסים',D.reps[0],D.reps[1])+sec('grp','קבוצות',D.grp[0],D.grp[1])+sec('pkg','חבילות',D.pkg[0],D.pkg[1])+'<div class="two">'+sec('ch','אתר מול טלפון',D.ch[0],D.ch[1])+sec('city','ערים',D.city[0],D.city[1])+'</div>'+sec('day','קצב המכירה לפי ימים',D.day[0],D.day[1]);
  box.onclick=function(e){var b=e.target.closest('[data-x]');if(b){var d=D[b.dataset.x];csv(b.closest('section').querySelector('h2').textContent,d[0],d[1])}};
  $('tk').onclick=function(){flash('מכין…');call({a:'tickets'}).then(function(j){csv('כרטיסים',['מספר כרטיס','מק"ט','מוצר','שם','טלפון','עיר','הזמנה','מחבילה'],j.tickets.map(function(t){return [t.serial,t.num,t.product,t.name,t.phone,t.city,t.order,t.pkg?'כן':'']}))})}})}

/* --- טלפון --- */
function ivr(){var v=S.cfg.ivr||{},cc=v.cc||{};
  box.innerHTML='<h1>שלוחה טלפונית (ימות המשיח)</h1><div class="card"><label class="ck"><input type="checkbox" id="i0"'+(v.on!==false?' checked':'')+'> השלוחה פעילה</label>'
   +'<label class="f">הכתובת לשלוחה בימות<div class="mono" style="background:#F3F4F7;padding:10px;border-radius:8px">'+esc(S.ivrUrl)+'</div></label>'
   +'<div class="note">בימות המשיח, בקובץ ext.ini של השלוחה:<div class="mono" style="margin-top:6px">type=api<br>api_link='+esc(S.ivrUrl)+'</div>הכתובת כוללת מפתח סודי. אם הוא דלף, יוצרים מפתח חדש ומעדכנים בימות.</div>'
   +'<div class="two"><label class="f" for="i1">מספר השלוחה (לקבצי השמע של המוצרים)<input id="i1" dir="ltr" value="'+esc(v.path||'')+'" placeholder="5"><small>התיקייה בימות שאליה יועלו קבצי השמע</small></label><label class="f" for="i2">טוקן ימות המשיח של הארגון<input id="i2" dir="ltr" placeholder="'+(v.hasToken?'שמור. להחלפה מקלידים חדש':'')+'"><small>נשמר בשרת ולא מוצג שוב. משמש רק להעלאת קבצי השמע</small></label></div>'
   +'<label class="f" for="i3">שלוחת הסליקה הטלפונית (לא חובה)<input id="i3" dir="ltr" value="'+esc(v.payPath||'')+'"><small>אם מוגדרת: בסיום הרכישה המתקשר מועבר אליה לתשלום. אם לא: ההזמנה נרשמת כממתינה, ונציג חוזר להשלמת התשלום.</small></label>'
   +'<div class="card" style="background:#FAFAF6"><h2>תשלום בכרטיס אשראי בטלפון (מודול הסליקה של ימות)</h2><label class="ck"><input type="checkbox" id="c0"'+(cc.on?' checked':'')+'> בסיום הרכישה המתקשר משלם בטלפון, בסכום הקבוע של ההזמנה</label>'
   +'<label class="f" for="c1">חברת הסליקה<select id="c1">'+opt([['nedarim_plus','נדרים פלוס'],['kesherhk','קשר / קהילות'],['other','אחרת (הגדרה ידנית)']],cc.type==='nedarim_plus'||cc.type==='kesherhk'?cc.type:(cc.type?'other':'nedarim_plus'))+'</select><small>בנדרים פלוס ובקשר הפרטים נלקחים אוטומטית מלשונית "סליקה". בקשר צריך רק את מספר הפרויקט</small></label>'
   +'<div class="grid"><label class="f" for="c7" id="c7w">שם החברה בימות (credit_card_type)<input id="c7" dir="ltr" value="'+esc(cc.type&&cc.type!=='nedarim_plus'&&cc.type!=='kesherhk'?cc.type:'')+'" placeholder="tranzila"></label><label class="f" for="c2">מספר חנות / פרויקט<input id="c2" dir="ltr" value="'+esc(cc.register||'')+'"></label><label class="f" for="c3">שם משתמש<input id="c3" dir="ltr" value="'+esc(cc.user||'')+'"></label><label class="f" for="c4">מספר מסוף<input id="c4" dir="ltr" value="'+esc(cc.terminal||'')+'" placeholder="אוטומטי"></label><label class="f" for="c5">סיסמה<input id="c5" type="password" dir="ltr" autocomplete="new-password" placeholder="'+(cc.hasPassword?'שמורה':'אוטומטי')+'"></label><label class="f" for="c6">קודי הצלחה (CreditCard_CODE)<input id="c6" dir="ltr" value="'+esc(cc.okCodes||'000,OK')+'"></label></div>'
   +'<p class="hint">הערכים לפי מה שמוגדר אצלכם בשלוחת סליקה בימות המשיח. אחרי הסליקה ימות מחזירים לשרת קוד תשובה: אם הוא באחד מקודי ההצלחה, ההזמנה מסומנת כשולמה והמתקשר שומע את מספרי הכרטיסים. אחרת ההזמנה נשמרת כממתינה. מומלץ לבדוק פעם אחת בסכום קטן.</p></div>'
   +'<div class="acts"><button class="btn pri" id="sv">שמירה</button><button class="btn" id="nk">מפתח חדש</button>'+(v.hasToken?'<button class="btn bad" id="ct">מחיקת הטוקן</button>':'')+'</div></div>'
   +'<div class="card"><h2>נוסחי ההודעות בשיחה</h2><p class="hint" style="margin:0">משנים את הטקסט שמוקרא. שדה ריק = הנוסח הרגיל (מוצג באפור). מספרי ההקשה קבועים, אז אם משנים נוסח של תפריט, כדאי להשאיר בו את אותם מספרים. אפשר להשתמש ב־{מכירה}, {סכום}, {כרטיסים} ו־{חבילה}. אין להשתמש בנקודה ובמקף.</p><div id="ivt" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"></div><div class="acts"><button class="btn pri" id="ivs">שמירת הנוסחים</button></div></div>'
   +'<div class="card"><h2>מהלך השיחה</h2><ol style="margin:0;padding-inline-start:20px;line-height:1.9"><li>פתיחה: "שלום וברוכים הבאים למכירה הסינית של '+esc(S.eff.title)+'"</li><li>קוד נציג (לפי ההגדרות: בהתחלה, לפני התשלום, או בשניהם. אפס לדילוג)</li><li>תפריט: 1 חבילה · 2 בחירת כרטיסים לפי מספר מוצר · 3 שמיעת כל המוצרים ברצף</li><li>מספר מוצר וסולמית: מושמע קובץ השמע של המוצר (או הקראת השם), המחיר ומספר ההגרלות</li><li>כמות כרטיסים · ואז 1 מוצר נוסף, 2 סיום ותשלום, 3 שמיעת הסל, 4 שמירת הסל להתקשרות הבאה, 5 שינוי כמות או הסרה של מוצר</li><li>סיכום הסכום ואישור</li><li>מעבר לתשלום</li><li>מי שיש לו סל שמור שומע אותו בתחילת השיחה, וממשיך ממנו (מוסיף, עורך, משלם) או מרוקן אותו</li></ol><p class="hint">קבצי השמע של המוצרים מועלים בלשונית "מוצרים". השלוחה סגורה בשבת ובחג.</p></div>';
  $('sv').onclick=function(){var o={on:$('i0').checked,path:$('i1').value,payPath:$('i3').value};if($('i2').value.trim())o.token=$('i2').value.trim();
    o.cc={on:$('c0').checked,type:$('c1').value==='other'?$('c7').value.trim():$('c1').value,register:$('c2').value.trim(),user:$('c3').value.trim(),terminal:$('c4').value.trim(),okCodes:$('c6').value};if($('c5').value.trim())o.cc.password=$('c5').value.trim();saveCfg({ivr:o})};
  var cw=function(){$('c7w').hidden=$('c1').value!=='other'};$('c1').onchange=cw;cw();
  var D=S.ivrDefaults||{},own=S.cfg.ivrtxt||{};
  $('ivt').innerHTML=Object.keys(D).map(function(k){return '<label class="f" for="iv_'+k+'">'+esc(D[k][0])+'<textarea id="iv_'+k+'" data-iv="'+k+'" rows="2" placeholder="'+esc(D[k][1])+'" style="min-height:58px">'+esc(own[k]||'')+'</textarea></label>'}).join('');
  $('ivs').onclick=function(){var o={};[].forEach.call(document.querySelectorAll('[data-iv]'),function(x){if(x.value.trim())o[x.dataset.iv]=x.value.trim()});saveCfg({ivrtxt:o})};
  $('nk').onclick=function(){if(confirm('ליצור מפתח חדש? הכתובת הישנה תפסיק לעבוד, וצריך לעדכן אותה בימות.'))saveCfg({ivr:{newKey:true}})};
  if($('ct'))$('ct').onclick=function(){saveCfg({ivr:{clearToken:true}})}}

/* --- הגרלות --- */
function draw(){box.innerHTML='<h1>ביצוע ההגרלות</h1><p>טוען…</p>';call({a:'draws'}).then(function(j){DRAWS=j;var P=S.products.filter(function(p){return (j.counts[p.id]||0)>0||p.active!==false});
  if(!SEL||!P.some(function(p){return p.id===SEL}))SEL=P[0]&&P[0].id;
  var by=function(pid,k){return j.draws.filter(function(d){return d.product_id===pid&&d.kind===k})};
  var done=P.filter(function(p){return by(p.id,'win').length>=(p.draws||1)}).length,cur=P.filter(function(p){return p.id===SEL})[0];
  var h='<div class="hd noprint"><h1>ביצוע ההגרלות</h1><div class="acts"><button class="btn" id="fs">תצוגת מסך מלא לאירוע</button><button class="btn" id="pr">הדפסת פרוטוקול</button></div></div>';
  if(j.open)h+='<div class="note noprint">המכירה עדיין פתוחה. כדי שרשימת הכרטיסים תינעל, סוגרים את המכירה לפני ההגרלה. <button class="btn bad" id="cl">סגירת המכירה עכשיו</button></div>';
  h+='<div class="two noprint"><div><h2 style="margin-bottom:8px">המוצרים · הושלמו '+done+' מתוך '+P.length+'</h2><div class="prodlist">'+P.map(function(p){var n=by(p.id,'win').length,d=p.draws||1;return '<button type="button" data-p="'+p.id+'" aria-pressed="'+(p.id===SEL)+'"><span><b>'+p.num+'</b> · '+esc(p.name)+'</span><span class="pill '+(n>=d?'ok':'')+'">'+(n>=d?'הוגרל':n?n+' מתוך '+d:d>1?d+' הגרלות':'ממתין')+'</span></button>'}).join('')+'</div></div>';
  if(cur){var W=by(cur.id,'win'),RS=by(cur.id,'reserve'),d=cur.draws||1,rf=(cur.cfg||{}).reserves||0;
    h+='<div class="drawbox" id="db"><span class="hint">מוצר '+cur.num+'</span><h2 style="font-family:Frank Ruhl Libre,serif;font-size:34px">'+esc(cur.name)+'</h2><span>'+(j.counts[cur.id]||0)+' כרטיסים משתתפים'+(d>1?' · '+d+' הגרלות':'')+'</span>'
      +W.map(function(w){return winBox(w,d>1?'זוכה בהגרלה '+w.round+' מתוך '+d:'הכרטיס הזוכה')}).join('')
      +RS.map(function(w){return winBox(w,'זוכה חלופי '+w.round)}).join('')
      +(W.length<d?'<button type="button" class="drawgo" id="dg"'+(j.open?' disabled':'')+'>3 ערבובים והגרלה'+(d>1?' '+(W.length+1)+' מתוך '+d:'')+'</button>':'')
      +(W.length>=d&&(!rf||RS.length<rf)?'<button type="button" class="btn" id="dr">הגרלת זוכה חלופי</button>':'')
      +'<p class="hint" style="max-width:560px">לכל כרטיס ששולם יש מספר סידורי. לפני כל הגרלה רשימת הכרטיסים של המוצר מעורבבת שלוש פעמים, ורק אז מוגרל כרטיס אחד, בשרת, עם מחולל אקראיות קריפטוגרפי. במוצר עם כמה הגרלות כל הגרלה נעשית בנפרד. כל תוצאה נשמרת עם טביעת אצבע של רשימת הכרטיסים, ואי אפשר למחוק אותה.</p>'+(W.length>=d?'<p class="hint" style="max-width:560px">זוכה חלופי מקבל את הפרס רק אם הזוכה לא נמצא, מוותר או לא עומד בתנאים, לפי הסדר: חלופי 1, אחריו חלופי 2 וכן הלאה.</p>':'')+'</div>'}
  h+='</div><div id="proto" style="display:none"></div>';
  box.innerHTML=h;
  box.onclick=function(e){var b=e.target.closest('[data-p]');if(b){SEL=+b.dataset.p;draw()}};
  if($('cl'))$('cl').onclick=function(){if(confirm('לסגור את המכירה עכשיו?'))call({a:'close'}).then(function(){loadSale().then(function(){draw()})})};
  if($('dg'))$('dg').onclick=function(){run('win')};
  if($('dr'))$('dr').onclick=function(){run('reserve')};
  $('fs').onclick=function(){full(cur)};
  $('pr').onclick=function(){proto();setTimeout(print,50)};
  function run(kind){var b=$('dg')||$('dr');if(b)b.disabled=true;var ov=animate(cur);
    call({a:'draw',product:cur.id,kind:kind}).then(function(r){setTimeout(function(){ov.stop(r.draw);if(!r.draw)flash(r.message||'ההגרלה לא בוצעה',1);setTimeout(function(){draw()},r.draw?0:0)},2400)})}
})}
function winBox(w,lab){return '<div class="win"><div><div class="k">'+esc(lab)+'</div><div style="font-family:Frank Ruhl Libre,serif;font-size:24px;font-weight:700">'+esc(w.name||w.phone||'—')+'</div><small>'+esc([w.city,w.channel?'נרכש '+(w.channel==='phone'?'בטלפון':w.channel==='manual'?'ידנית':'באתר'):'',w.rep?'מגייס: '+w.rep:''].filter(Boolean).join(' · '))+'</small></div><div style="text-align:center"><small>כרטיס מספר</small><div class="s">'+w.serial+'</div></div></div>'}
/* אנימציה של ערבוב במסך מלא, בזמן שההגרלה רצה בשרת */
function animate(p){var el=document.createElement('div');el.className='full';el.innerHTML='<div class="p">'+esc(p.num+' · '+p.name)+'</div><div class="n" id="ph">ערבוב ראשון…</div><div class="shuf" id="sh">—</div>';document.body.appendChild(el);
  var n=0,t=setInterval(function(){$('sh').textContent=Math.floor(Math.random()*9000+1);n++;if(n===8)$('ph').textContent='ערבוב שני…';if(n===16)$('ph').textContent='ערבוב שלישי…';if(n===24)$('ph').textContent='מגרילים…'},90);
  return {stop:function(d){clearInterval(t);if(!d){el.remove();return}el.innerHTML='<div class="p">'+esc(p.num+' · '+p.name)+'</div><div class="n">'+(d.kind==='reserve'?'זוכה חלופי':'הכרטיס הזוכה')+'</div><div class="s">'+d.serial+'</div><div class="n">'+esc(d.name||d.phone||'')+'</div><div style="font-size:22px;color:#D5DAE6">'+esc(d.city||'')+'</div><button class="btn pri" style="margin-top:20px;font-size:18px;height:52px" id="cx">סגירה</button>';$('cx').onclick=function(){el.remove()};$('cx').focus()}}}
function full(cur){var el=document.createElement('div');el.className='full';var W=DRAWS.draws.filter(function(d){return d.product_id===cur.id&&d.kind==='win'});
  el.innerHTML='<div class="p">'+esc(cur.num+' · '+cur.name)+'</div>'+(W.length?W.map(function(w){return '<div><div class="s" style="font-size:clamp(50px,9vw,110px)">'+w.serial+'</div><div class="n">'+esc(w.name||'')+'</div></div>'}).join(''):'<div class="n">ממתין להגרלה</div>')+'<button class="btn pri" id="cx" style="font-size:18px;height:52px">סגירה</button>';document.body.appendChild(el);$('cx').onclick=function(){el.remove()};$('cx').focus()}
function proto(){var pn={};S.products.forEach(function(p){pn[p.id]=p});var el=$('proto');el.style.display='block';
  el.innerHTML='<h1>פרוטוקול הגרלות: '+esc(S.eff.title)+'</h1><p>הופק ב־'+new Date().toLocaleString('he-IL')+'</p>'+table(['מוצר','הגרלה','כרטיס','זוכה','עיר','טלפון','כרטיסים בהגרלה','ערבובים','בוצע ב','על ידי','טביעת אצבע של רשימת הכרטיסים'],DRAWS.draws.map(function(d){var p=pn[d.product_id]||{};return '<tr><td>'+p.num+' · '+esc(p.name||'')+'</td><td>'+(d.kind==='reserve'?'חלופי ':'')+d.round+'</td><td><b>'+d.serial+'</b></td><td>'+esc(d.name)+'</td><td>'+esc(d.city)+'</td><td dir="ltr">'+esc(d.phone)+'</td><td>'+d.pool+'</td><td>'+d.shuffles+'</td><td>'+dt(d.created_at)+'</td><td>'+esc(d.by_email||'')+'</td><td class="mono" style="font-size:10px">'+esc(d.pool_hash)+'</td></tr>'}))}
})();
</script>
</body>
</html>
