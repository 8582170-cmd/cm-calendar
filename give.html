  else if(ts)h+='<label class="f" for="ft">לזכות קבוצה (לא חובה)<select id="ft"><option value="">בלי</option>'+D.teams.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('')+'</select></label>';
  if(c.f.dedic||c.f.message||c.f.anon){h+='<details class="more"><summary>הקדשה, הודעה ואפשרויות</summary>';

    if(c.f.message)h+='<label class="f" for="fmsg">הודעה שתוצג ברשימת התורמים<textarea id="fmsg" maxlength="300"></textarea></label>';

  h+='<button class="go" id="go" type="button" disabled>בוחרים סכום</button><p class="msg" id="pmsg" role="status"></p></aside>';return h}
function wireDon(){if(!$('go'))return;var c=D.cfg;
  try{var B=JSON.parse(localStorage.getItem('give-donor')||'null');if(B){$('fn').value=B.n||'';$('fp').value=B.p||'';$('fe').value=B.e||''}}catch(e){}

  $('fa').oninput=function(){F.amount=+this.value||0;btns.forEach(function(x){x.setAttribute('aria-pressed','false')});upd()};
  if($('m1')){var seg=function(m){F.monthly=m;$('m1').setAttribute('aria-pressed',!m);$('m2').setAttribute('aria-pressed',m);$('fmw').hidden=!m;upd()};$('m1').onclick=function(){seg(false)};$('m2').onclick=function(){seg(true)};$('fm').onchange=function(){F.months=+this.value;upd()};F.months=+$('fm').value}
  if(D.payVia==='kehilot'){ready=true;upd();$('go').onclick=pay;return}
  var frame=$('frame'),postF=function(d){frame.contentWindow&&frame.contentWindow.postMessage(d,'*')};
  frame.addEventListener('load',function(){postF({Name:'GetHeight'})});
  window.addEventListener('message',function(e){if(!/^https:\/\/(www\.)?matara\.pro$/.test(e.origin))return;var d=e.data;if(!d||!d.Name)return;
    if(d.Name==='Height'){ready=true;frame.style.height=Math.max(430,parseInt(d.Value,10)+30)+'px';upd()}
    else if(d.Name==='TransactionResponse'){busy=false;var v=d.Value||{};if(v.Status==='Error'){upd();var em=String(v.Message||'');msg(/zeout/i.test(em)?'לכרטיס הזה נדרש מספר תעודת זהות.':(em||'התשלום לא עבר. בדקו את הפרטים ונסו שוב.'),1)}else thanks()}});
  $('go').onclick=function(){pay(postF)}}
function upd(){var g=$('go'),c=D.cfg;if(!g)return;var a=F.amount,x=$('xn'),tot=F.monthly?(c.monthly.count==='first'?a:a*(F.months||c.monthly.countUnl)):a;
  if(x){var t=[];if(F.monthly&&a)t.push(nis(a)+' לחודש'+(F.months?' × '+F.months+' חודשים = '+nis(a*F.months):' ללא הגבלה'));if(c.match.on&&a)t.push('עם ההכפלה, הקמפיין יקבל '+nis(tot*c.match.ratio));x.innerHTML=t.join('<br>');x.hidden=!t.length}
  g.disabled=busy||!ready||!(a>=c.min);g.textContent=busy?'מעבד…':a>=c.min?'לתרומה של '+nis(a)+(F.monthly?' לחודש':''):a?'הסכום המינימלי: '+nis(c.min):'בוחרים סכום'}
function msg(t,bad){var m=$('pmsg');if(m){m.textContent=t;m.className='msg'+(bad?' bad':'')}}
function pay(postF){if(busy)return;var c=D.cfg,n=$('fn').value.trim(),p=$('fp').value.trim(),e=$('fe').value.trim();
  if(n.split(/\s+/).length<2){$('fn').focus();return msg('נא למלא שם פרטי ושם משפחה.',1)}
  if(!/^0\d{8,9}$/.test(p.replace(/\D/g,''))&&!e){$('fp').focus();return msg('נא למלא טלפון או מייל.',1)}
  if(e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){$('fe').focus();return msg('כתובת המייל לא תקינה.',1)}
  try{localStorage.setItem('give-donor',JSON.stringify({n:n,p:p,e:e}))}catch(x){}
  var rep='';if($('fr')&&$('fr').value){var m=/·\s*(\d+)\s*$/.exec($('fr').value)||/^(\d+)$/.exec($('fr').value.trim());if(m)rep=m[1];else{var hit=D.reps.find(function(r){return r.name===$('fr').value.trim()});if(hit)rep=hit.code;else{$('fr').focus();return msg('הנציג לא נמצא. בחרו מהרשימה או השאירו ריק.',1)}}}
  var v=function(i){return $(i)?$(i).value.trim():''};

  post({a:'donate',s:SLUG,amount:F.amount,monthly:F.monthly,months:F.months,name:n,phone:p,email:e,link:D.rep?D.rep.code:'',rep:rep,team:D.team?D.team.id:v('ft'),dedicType:v('fdt'),dedicName:v('fdn'),message:v('fmsg'),showName:v('fsn'),anon:$('fan')?$('fan').checked:false}).then(function(j){
    if(j._st!==200){busy=false;upd();return msg(j.message||'לא הצלחנו להתחיל את התרומה.',1)}donId=j.id;
    try{sessionStorage.setItem('give-last',JSON.stringify({id:j.id,amount:F.amount,monthly:F.monthly}))}catch(x){}
    if(j.url){location.href=j.url;return}
    postF({Name:'FinishTransaction2',Value:Object.assign({},j.tx,{Zeout:v('fz').replace(/\D/g,''),FirstName:n,LastName:'',Phone:p,Mail:e})});
  }).catch(function(){busy=false;upd();msg('אין חיבור לשרת. נסו שוב.',1)})}

  a.innerHTML='<div class="done" role="status"><div class="big" aria-hidden="true">♥</div><h2>תודה רבה!</h2><p>התרומה שלכם ('+nis(F.amount)+(F.monthly?' לחודש':'')+') התקבלה.'+(c.match.on?' עם ההכפלה זה '+nis(F.amount*c.match.ratio*(F.monthly&&c.monthly.count!=='first'?(F.months||c.monthly.countUnl):1))+' לקמפיין!':'')+'</p>'+(c.thanks?'<p class="story">'+esc(c.thanks)+'</p>':'')+shareHtml()+'<button class="btn" type="button" id="again">לתרומה נוספת</button></div>';

function kesherBack(){var id=Q.get('kp'),tn=Q.get('transactionNumber')||Q.get('TransactionNumber')||Q.get('tn')||'';var a=document.querySelector('.don');

    history.replaceState(null,'',location.pathname+(SLUG&&!/^\/give\//.test(location.pathname)?'?s='+SLUG:''));if(j.ok)thanks();else if(a)a.innerHTML='<div class="closed">'+esc(j.message||'לא הצלחנו לאשר את התשלום. אם חויבתם, פנו למארגנים.')+'</div>'})}

  if(!L.length)return PB?'<div class="tabs">'+PB+'</div>':'';if(!L.some(function(x){return x[0]===TAB}))TAB=L[0][0];
  return '<div class="tabs" role="tablist">'+L.map(function(x){return '<button type="button" role="tab" id="tb-'+x[0]+'" aria-selected="'+(x[0]===TAB)+'" aria-controls="pane">'+x[1]+'</button>'}).join('')+PB+'</div><div id="pane" role="tabpanel"></div>'}

  if(/^o(about|faq|terms|contact)$/.test(TAB)){var ok=TAB.slice(1);p.innerHTML=MLOrg.html(D.org,ok);MLOrg.wire(p,ok,function(x){x.a='orgmsg';x.s=SLUG;return post(x)})}
  else if(TAB==='about'){var h='';if(c.video)h+='<div class="vid">'+vid(c.video)+'</div>';if(c.story)h+='<div class="story">'+esc(c.story)+'</div>';
    if(c.gallery.length)h+='<div class="gal">'+c.gallery.map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy">'}).join('')+'</div>';
    if(c.match.on&&c.match.matchers.length)h+='<h3 style="margin:22px 0 10px">התורמים המכפילים</h3><div class="mt">'+c.match.matchers.map(function(m){return '<div class="mm">'+(m.logo?'<img src="'+esc(m.logo)+'" alt="">':'')+'<b>'+esc(m.name)+'</b>'+(m.amount?'<span class="msg">'+nis(m.amount)+'</span>':'')+'</div>'}).join('')+'</div>';
    if(c.faq.length&&!(D.org&&D.org.faq))h+='<h3 style="margin:22px 0 6px">שאלות נפוצות</h3><div class="faq">'+c.faq.map(function(f){return '<details><summary>'+esc(f.q)+'</summary><p style="white-space:pre-line">'+esc(f.a)+'</p></details>'}).join('')+'</div>';
    p.innerHTML=h}
  else if(TAB==='feed'){p.innerHTML='<div class="tools"><label class="sr" for="fq">חיפוש תורם</label><input id="fq" placeholder="חיפוש לפי שם, הקדשה או הודעה"><label class="sr" for="fso">מיון</label><select id="fso"><option value="new">החדשים קודם</option><option value="big">הגדולים קודם</option></select></div><div class="feed" id="fd"></div><p style="text-align:center"><button class="btn" id="fmr" type="button" hidden>עוד תורמים</button></p>';
    var off=0,run=function(add){var q={a:'feed',s:SLUG,off:off,sort:$('fso').value,q:$('fq').value.trim()};if(D.rep)q.r=D.rep.code;if(D.team)q.t=D.team.id;get(q).then(function(j){var h=(j.feed||[]).map(dnHtml).join('');$('fd').innerHTML=(add?$('fd').innerHTML:'')+(h||(add?'':'<p class="msg">עוד אין תורמים. היו הראשונים!</p>'));off+=(j.feed||[]).length;$('fmr').hidden=off>=j.total})};
    $('fso').value=c.feedSort||'new';$('fso').onchange=function(){off=0;run()};var tq;$('fq').oninput=function(){clearTimeout(tq);tq=setTimeout(function(){off=0;run()},350)};$('fmr').onclick=function(){run(1)};run()}
  else if(TAB==='teams')p.innerHTML=board(D.teams,'t');
  else if(TAB==='reps'){var L=D.team?D.reps.filter(function(r){return r.team===D.team.id}):D.reps;p.innerHTML='<div class="tools"><label class="sr" for="rq">חיפוש נציג</label><input id="rq" placeholder="חיפוש נציג"></div><div id="rb">'+board(L,'r')+'</div>';
    $('rq').oninput=function(){var q=this.value.trim();$('rb').innerHTML=board(L.filter(function(r){return !q||r.name.indexOf(q)>=0||r.code===q}),'r')}}

function dnHtml(d){return '<article class="dn'+(d.pinned?' pin':'')+'">'+(d.amount!=null?'<div class="a">'+nis(d.amount)+(d.monthly?' <small style="font-size:12px;font-weight:500">('+nis(d.monthly.amount)+' לחודש)</small>':'')+'</div>':'')+'<div class="n">'+esc(d.name)+'</div>'+(d.dedic?'<div class="d">'+esc(d.dedic)+'</div>':'')+(d.message?'<div class="m">"'+esc(d.message)+'"</div>':'')+'<div class="t">'+ago(d.at)+(d.rep?' · דרך '+esc(d.rep):'')+'</div></article>'}
function board(L,k){L=L.slice().sort(function(a,b){return b.amount-a.amount});if(!L.length)return '<p class="msg">אין עדיין.</p>';var teamN={};D.teams.forEach(function(t){teamN[t.id]=t.name});

function chartHtml(){var h='',one=function(t,L){L=L.slice().sort(function(a,b){return b.amount-a.amount}).slice(0,40);if(!L.length)return '';var mx=Math.max.apply(null,L.map(function(x){return Math.max(x.amount,x.goal||0)}))||1;

   +(T.goal?'<div class="bar"><i style="width:'+p+'%"></i><b>'+p+'%</b></div>':'')+(c.match.on?'<div class="match"><span class="x">×'+c.match.ratio+'</span><span>כל תרומה מוכפלת</span></div>':'')+(c.screenNote?'<div style="font-size:2.6vh;color:#B9C1D9">'+esc(c.screenNote)+'</div>':'')+'</div>'

})();
