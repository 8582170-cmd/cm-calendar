<style>
/* Layout: a filterable wall of miniature printed pages, each with what it is and a button to start from it */
:root{
  --paper:#f6f7f4; --sheet:#ffffff; --ink:#172126; --mute:#5c686c; --line:#dde2df;
  --teal:#1f5c63; --teal-ink:#ffffff; --teal-soft:#e4eeec; --chag:#b3261e;

  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1517; --sheet:#172024; --ink:#e6ecea; --mute:#9aa7a8; --line:#28343a;
  --teal:#79c0b8; --teal-ink:#0d1a1b; --teal-soft:#1b2b2d; --chag:#ef8a80;

  --shadow:0 1px 2px rgb(0 0 0 / .4),0 14px 30px -16px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-inline:20px}
a{color:var(--teal)}

.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}
.logo{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;text-decoration:none;cursor:pointer;border:1.5px solid var(--teal)}
.btn-primary{background:var(--teal);color:var(--teal-ink)}

.nav .btn{padding:8px 16px}
.intro{display:flex;flex-direction:column;gap:10px;padding-block:24px 18px;max-width:46em}

.tb .hd{background:var(--acc-t);font-weight:700;color:var(--acc)}
.tb .sh{background:var(--acc-t)}
.hist{flex:1;columns:2 22cqw;column-gap:3cqw;column-rule:.2cqw solid var(--ln);font-size:1.8cqw;line-height:1.3;overflow:hidden}
.mp p{font-size:inherit;color:inherit;line-height:inherit}
.hist p{margin:0 0 .6cqw;break-inside:avoid}
.hist .gl{height:1.1cqw;background:#e3e7ea;border-radius:.4cqw;margin-bottom:1cqw}
.mp.tight .ms{flex-basis:16%;font-size:1.2cqw}.mp.tight .ms>b{font-size:1.5cqw}.mp.tight .ms.narrow{flex-basis:9%}.mp.tight .mb{flex-basis:5%;font-size:1.8cqw}.mp.land .mh b{font-size:7cqw}.mp.land .mh span{font-size:3cqw}.mp.land .mh small{font-size:1.6cqw}.mp.land .mg>div{font-size:1.25cqw}.mp.land .mg .z{font-size:1.15cqw;white-space:nowrap;line-height:1.2}.mp.land .mg .t{line-height:1.25}.mp.land .mg .d b{font-size:2.2cqw}.mp.land .mg .w{font-size:1.4cqw}.mp.land .mg .d i{font-size:1.1cqw}.mp.land .hist{font-size:1.3cqw}.mp.land .mpi{gap:1.4cqw}.mp.land .mf{font-size:1.2cqw}.mp.land .mg .ci~.t,.mp.land .mg .ci~.f{font-size:1.1cqw}.hist b{color:var(--acc);font-family:var(--f-display)}
.cover{flex:1;display:flex;flex-direction:column;gap:3cqw}
.cover .ttl{font-family:var(--f-display);font-weight:900;font-size:8cqw;text-align:center;color:var(--acc);line-height:1.1}

/* photo-like art, drawn with gradients */

.a4{background:radial-gradient(circle at 50% 120%,#2e5a3a 0 45%,transparent 46%),radial-gradient(circle at 15% 110%,#3f6f47 0 35%,transparent 36%),radial-gradient(circle at 85% 115%,#38653f 0 38%,transparent 39%),linear-gradient(#bfe0d0,#e7f1e9)}
.a5{background:radial-gradient(circle at 80% 25%,#fff 0 3%,transparent 3.5%),radial-gradient(circle at 20% 15%,#fff8 0 1%,transparent 1.5%),radial-gradient(circle at 45% 35%,#fff8 0 1%,transparent 1.5%),radial-gradient(circle at 65% 10%,#fff8 0 1%,transparent 1.5%),linear-gradient(#1f2a4d,#3c4c7d 70%,#5d4f73)}

<body>
<div class="wrap">
  <header class="nav">
    <a class="logo" href="index.html">לוחנו</a>
    <nav class="nav-links" aria-label="ניווט ראשי">
      <a href="index.html#what">מה בלוח</a>
      <a href="gallery.html" aria-current="page">גלריה</a>
      <a href="online/">לוח שנה אונליין</a>
      <a href="index.html#plans">מסלולים</a>
      <a href="index.html#faq">שאלות</a>
      <a class="btn btn-primary" href="app.html">לבנות לוח</a>
    </nav>
  </header>
  <main>
    <div class="intro">
      <h1>גלריה</h1>
      <p>כמה מהדרכים לעצב את הלוח: למשפחה, לבית הכנסת, לישיבה או לבית הספר, כלוח קיר, שולחני או יומן. בוחרים דוגמה, מתחילים ממנה, ומשנים הכל.</p>
    </div>
    <div class="filters" role="group" aria-label="סינון">
      <button type="button" data-f="all" aria-pressed="true">הכל</button>
      <button type="button" data-f="family" aria-pressed="false">משפחה</button>
      <button type="button" data-f="org" aria-pressed="false">מוסדות וקהילות</button>
      <button type="button" data-f="size" aria-pressed="false">גדלים</button>
      <button type="button" data-f="view" aria-pressed="false">תצוגות</button>
    </div>
    <div class="gal" id="gal"></div>
    <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbTitle"><div class="lb-top"><h2 id="lbTitle"></h2><button class="lb-close" type="button" id="lbClose">סגירה</button></div><div class="lb-pages" id="lbPages"></div></div>
  </main>
  <footer>הדוגמאות מוקטנות ומציגות חודש תשרי תשפ״ז. בלוח שלכם יופיעו השנה, העיר והאירועים שתבחרו.</footer>
</div>
<script>
(function(){
  'use strict';
  const L=['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא','כב','כג','כד','כה','כו','כז','כח','כט','ל'];
  const heb=i=>{const s=L[i-1];return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳'};

  /* month grid */
  function gridGreg(){
    /* ספטמבר 2026: 1 בספטמבר הוא יום שלישי, י״ט באלול */
