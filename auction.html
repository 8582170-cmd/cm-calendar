<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מכירה סינית · MyLuach</title>
<meta name="description" content="מכירה סינית לארגונים: מוצרים, כרטיסים וחבילות, תשלום באתר ובטלפון, מגייסים והגרלה מסודרת. בקשה לפתיחת מכירה.">
<link rel="canonical" href="https://www.myluach.org/auction">
<meta name="robots" content="index,follow">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-180.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--navy:#15203B;--gold:#C9A24B;--gold2:#E6C36F;--cream:#FBF4DF;--cream-line:#E8D9A8;--cream-ink:#4A3A0E;--bg:#F3F4F7;--card:#fff;--ink:#1B2338;--mute:#505869;--line:#DFE2EA;--line2:#C5CAD6;--bad:#A3261B;--good:#1C7A56}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Heebo,Arial,sans-serif}
h1,h2,h3{font-family:"Frank Ruhl Libre",serif;font-weight:700;margin:0}
button,input,select{font:inherit;color:inherit}
a{color:#8A6516}
.wrap{padding:0 6%}
header.top{background:var(--navy);color:#fff;padding:36px 6%;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}
header.top .t{display:flex;flex-direction:column;gap:8px;flex:1 1 420px}
.kick{font-size:15px;color:var(--gold2);font-weight:500}
header.top h1{font-size:clamp(30px,4.6vw,44px);line-height:1.15}
header.top .sub{color:#D5DAE6;font-size:17px;white-space:pre-line}
header.top img.logo{max-height:72px;max-width:200px;border-radius:8px;background:#fff;padding:6px}
.phonecard{flex:0 1 340px;border:1px solid var(--gold2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.phonecard b{font-size:26px;direction:ltr;text-align:right}
.phonecard span{font-size:14px;color:#D5DAE6}
.band{background:var(--cream);border-bottom:1px solid var(--cream-line);padding:13px 6%;color:var(--cream-ink);font-size:15px;display:flex;gap:8px;align-items:center}
.band.bad{background:#FBE9E7;border-color:#F0C2BC;color:var(--bad)}
main{padding:32px 6% 56px;display:flex;flex-direction:column;gap:32px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:26px}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pkg{text-align:right;cursor:pointer;min-height:108px;padding:16px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:4px}
.pkg[aria-pressed="true"]{border-color:var(--gold);background:var(--cream)}
.pkg b{font-size:18px}.pkg span{font-size:14px;color:var(--mute)}.pkg .pr{font-size:17px;font-weight:700;color:#8A6516;margin-top:auto}
.cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.cols>.prods{flex:999 1 560px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.prod .im{height:150px;background:#E4E7EF;position:relative;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.prod .im img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.num{right:10px;background:var(--navy);color:#fff;font-weight:500}.tag.dr{left:10px;background:var(--gold2);color:var(--navy)}
.prod .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex-grow:1}
.prod .nm{font-size:17px;font-weight:700;line-height:1.3}
.prod .ds{font-size:14px;color:var(--mute)}
.prod .pp{font-size:14px;color:var(--mute)}.prod .pp b{color:var(--ink)}
.inpkg{font-size:13px;color:var(--cream-ink);background:var(--cream);border-radius:6px;padding:4px 8px;align-self:flex-start}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:22px;cursor:pointer}
.qty button.plus{background:var(--navy);border-color:var(--navy);color:#fff}
.qty input{width:64px;height:44px;text-align:center;border:1px solid var(--line2);border-radius:10px;font-size:20px;font-weight:700}
.listen{align-self:flex-start;background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:32px}
aside.sum{flex:1 1 320px;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
aside.sum h2{font-size:24px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px}.row span{color:var(--mute)}
.note{background:var(--cream);color:var(--cream-ink);border-radius:8px;padding:10px 12px;font-size:14px}
.tot{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}.tot b{font-size:32px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
label.f input{height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:16px;font-weight:400}
label.f small{font-weight:400;color:var(--mute);font-size:13px}
.go{height:52px;border:none;border-radius:10px;background:var(--gold);color:var(--navy);font-size:18px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
.ghost{height:46px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:15px;cursor:pointer;padding:0 16px}
.fine{font-size:13px;color:var(--mute);text-align:center}
.msg{font-size:14px;color:var(--mute)}.msg.bad{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
iframe.pay{width:100%;border:0;min-height:430px}
.done{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px;max-width:720px}
.done table{border-collapse:collapse;width:100%}.done td{padding:8px 10px;border-bottom:1px solid #EEF0F4;font-size:15px}.done td.s{direction:ltr;text-align:left;font-weight:700}
.cdw{max-width:1100px;width:calc(100% - 32px);margin:18px auto 0;padding:16px 18px;border-radius:16px;background:var(--cream,#FBF6E9);border:1px solid var(--cream-line,#EADFC0);text-align:center}
.cdt{font-weight:700;font-size:17px}.cdd{font-size:14px;opacity:.8;margin-top:4px}
.cdb{display:flex;justify-content:center;gap:10px;margin-top:10px;direction:rtl}
.cdb span{min-width:70px;background:#fff;border:1px solid var(--cream-line,#EADFC0);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center}
.cdb b{font:700 32px/1.1 'Secular One',Heebo,sans-serif;font-variant-numeric:tabular-nums}.cdb i{font-style:normal;font-size:13px;opacity:.75}
@media(max-width:420px){.cdb span{min-width:60px}.cdb b{font-size:26px}}
.wins{display:flex;flex-direction:column;gap:10px}
.win{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line,#E4E7EF);border-radius:14px;padding:12px 14px}
.win img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:#E4E7EF}
.win .pn{font-weight:700}.win ul{list-style:none;margin:4px 0 0;padding:0}.win li{padding:2px 0}.win small{opacity:.7}
.hero{width:100%;max-height:420px;object-fit:cover;display:block;background:#E4E7EF}
.vid{max-width:900px;width:100%;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9}.vid video,.vid iframe{width:100%;height:100%;border:0;display:block}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px}.faq summary{cursor:pointer;font-weight:700;padding:14px 0;min-height:44px}.faq details p{margin:0 0 14px;white-space:pre-line;color:#2B3349}
.agr{display:flex;gap:8px;align-items:flex-start;font-size:14px}.agr input{width:20px;height:20px;margin-top:2px}
.terms{max-width:820px;margin:0 auto;padding:28px 6% 56px;display:flex;flex-direction:column;gap:20px}.terms .txt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;white-space:pre-line;line-height:1.75}
.cen{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
/* דף התקדמות */
.pg header.top{flex-direction:column;align-items:stretch}
.big{font-family:"Frank Ruhl Libre",serif;font-size:clamp(48px,8vw,80px);font-weight:700;line-height:1}
.bar{height:22px;background:#2B3757;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold2);border-radius:999px;transition:width .8s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpis div{border:1px solid #45517A;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}.kpis span{font-size:14px;color:#D5DAE6}.kpis b{font-size:28px}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.board{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lb{display:flex;flex-direction:column;gap:6px}.lb .r{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.lb .t{height:8px;background:#E4E7EF;border-radius:999px;overflow:hidden}.lb .t i{display:block;height:100%;background:var(--gold);border-radius:999px}
/* דף מגייס */
.repw{max-width:520px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.code{font-size:30px;font-weight:700;letter-spacing:3px;color:var(--navy)}
.lnk{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;direction:ltr;text-align:left;word-break:break-all}

.hm{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.hbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.hb{display:inline-block;border:2px solid currentColor;color:inherit;border-radius:999px;padding:10px 22px;font-weight:700;text-decoration:none;background:transparent;cursor:pointer;font-size:16px}
.hb.pri{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.hfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.hf{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}.hf b{font-size:17px}.hf span{font-size:14px;color:var(--mute)}
.hsteps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:st}
.hsteps li{counter-increment:st;background:var(--cream);border:1px solid var(--cream-line);border-radius:12px;padding:16px 18px;color:var(--cream-ink)}
.hsteps li::before{content:counter(st);display:block;font:700 26px "Frank Ruhl Libre",serif;color:#8A6516}
.hinfo{white-space:pre-line;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.rform{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.rform label{display:flex;flex-direction:column;gap:4px;font-weight:500}
.rform input:not([type=radio]),.rform textarea{border:1px solid var(--line2);border-radius:8px;padding:10px;background:#fff;min-height:44px}.rform textarea{min-height:90px}
.rform .rk{display:flex;flex-wrap:wrap;gap:18px}.rform .rk label{flex-direction:row;align-items:center;gap:8px}
.rform .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rform .hb{align-self:flex-start;color:var(--navy)}.rmsg{margin:0;min-height:1.4em}.rmsg.bad{color:var(--bad)}
.rdone{text-align:center;padding:20px}
:focus-visible{outline:3px solid #2A5BD7;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){aside.sum{position:static;max-width:none}}
</style>

<body>
<div id="app"><p class="cen">טוען…</p></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},app=$('app');
var Q=new URLSearchParams(location.search),SLUG=(Q.get('s')||(location.pathname.match(/^\/auction\/([a-z0-9-]+)/)||[])[1]||'').toLowerCase();
var API='/api/pricing?c=_auction';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nis(n){n=Math.round(+n*100)/100;return n.toLocaleString('he-IL')+' ₪'}
function tok(){try{var j=JSON.parse(localStorage.getItem('myluach-auth')||'null');return j&&j.access_token||''}catch(e){return ''}}
function get(p){return fetch(API+'&'+new URLSearchParams(p),{headers:Q.get('preview')&&tok()?{Authorization:'Bearer '+tok()}:{}}).then(function(r){return r.json().then(function(j){j._st=r.status;return j})})}
function post(b){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){j._st=r.status;return j})})}
/* שעון ספירה לאחור: לפתיחה, לסגירה ולהגרלה */
var CDT=null;
function cdPick(c,open,status){var now=Date.now(),cd=c.cd||{open:true,close:true,draw:true},T=function(x){return x?Date.parse(x):NaN};
  if(cd.open&&status!=='closed'&&T(c.openAt)>now)return {to:T(c.openAt),t:'המכירה נפתחת בעוד'};
  if(cd.close&&open&&T(c.closeAt)>now)return {to:T(c.closeAt),t:'המכירה נסגרת בעוד'};
  if(cd.draw&&T(c.drawTime)>now)return {to:T(c.drawTime),t:'ההגרלה בעוד'};
  return null}
function cdHtml(x){if(!x)return '';return '<section class="cdw" aria-label="'+esc(x.t)+'"><div class="cdt">'+esc(x.t)+'</div><div class="cdb" id="cdb" data-to="'+x.to+'"></div><div class="cdd">'+new Date(x.to).toLocaleString('he-IL',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'</div></section>'}
function cdRun(){clearInterval(CDT);var el=document.getElementById('cdb');if(!el)return;var to=+el.dataset.to;
  var tick=function(){var ms=to-Date.now();if(ms<=0){clearInterval(CDT);location.reload();return}
    var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
    el.innerHTML=[[d,'ימים'],[h,'שעות'],[m,'דקות'],[s,'שניות']].filter(function(x,i){return i>0||d>0}).map(function(x){return '<span><b>'+(x[0]<10&&x[1]!=='ימים'?'0':'')+x[0]+'</b><i>'+x[1]+'</i></span>'}).join('')};
  tick();CDT=setInterval(tick,1000)}
/* רשימת המוצרים והזוכים */
function winList(j){return '<div class="wins">'+j.products.map(function(p){return '<div class="win">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':'')+'<div><div class="pn">'+p.num+' · '+esc(p.name)+'</div><ul>'+p.winners.map(function(w){return '<li>'+(p.draws>1?'<small>הגרלה '+w.round+': </small>':'')+'<b>'+esc(w.name)+'</b>'+(w.city?', '+esc(w.city):'')+' <small>· כרטיס '+w.serial+'</small></li>'}).join('')+'</ul></div></div>'}).join('')+'</div>'}
function winView(){get({a:'winners',s:SLUG}).then(function(j){
  if(j._st!==200){closed('רשימת הזוכים לא פורסמה');return}
  document.title='הזוכים · '+j.title;
  app.innerHTML='<header class="top"><div class="t"><div class="kick">המכירה הסינית של '+esc(j.title)+'</div><h1>הזוכים בהגרלות</h1><div class="sub">מזל טוב לכל הזוכים, ותודה לכל המשתתפים!</div></div>'+(j.logo?'<img class="logo" src="'+esc(j.logo)+'" alt="">':'')+'</header>'
   +'<main class="wrap" style="max-width:820px;margin:0 auto;padding:18px 16px">'+(j.products.length?winList(j):'<p class="msg">ההגרלות עוד לא התקיימו. רשימת הזוכים תופיע כאן אחרי ההגרלה.</p>')
   +'<p class="msg" style="text-align:center;margin-top:20px"><a href="?s='+SLUG+'" style="color:inherit">לדף המכירה</a></p></main>';
}).catch(function(){closed('לא הצלחנו לטעון')})}
function closed(t){app.innerHTML='<div class="cen"><h1 style="font-size:28px;margin-bottom:10px">'+esc(t)+'</h1><p class="msg">אם הגעתם מקישור, בדקו שהוא שלם.</p></div>'}
function home(){
  document.title='מכירה סינית לארגונים · MyLuach';
  get({a:'home'}).then(function(H){
    if(H._st!==200)H={canOpen:false};
    var F=[['חבילות וכרטיסים','כרטיס לכל מוצר, וחבילות במחיר מיוחד, בהרכב שאתם קובעים'],['תשלום באתר ובטלפון','נדרים פלוס או קשר/קהילות, והכסף נכנס ישירות לארגון'],['שלוחה טלפונית','שמיעת המוצרים, בחירה ותשלום בטלפון, עם סל שמור'],['מגייסים ונציגים','קישור אישי ודף אישי לכל מגייס, וקוד נציג בהזמנה'],['הגרלה מסודרת','הגרלה נפרדת לכל זוכה, ורשימת זוכים לציבור'],['שעוני ספירה','לפתיחה, לסגירה ולהגרלה'],['דוחות וניהול לקוחות','פירוט כל ההזמנות, התקדמות המכירה ורשימת תורמים'],['שילוב עם התרמה','קמפיין התרמה במקביל למכירה, בחלון אחד']];
    var h='<header class="top"><div class="t"><div class="kick">MyLuach</div><h1>מכירה סינית לארגון שלכם</h1><div class="sub">'+esc(H.intro||'מערכת למכירה סינית בלי עבודה ידנית: מוצרים, כרטיסים, חבילות, תשלום באתר ובטלפון, מגייסים והגרלה מסודרת. כל ארגון מנהל את המכירה שלו.')+'</div>'
     +'<div class="hbtn">'+(H.canOpen?'<a class="hb pri" href="/auction-manage">פתיחת מכירה חדשה</a>':'')+'<a class="hb'+(H.canOpen?'':' pri')+'" href="#rq">'+(H.canOpen?'בקשה / קבלת פרטים':'בקשה לפתיחת מכירה')+'</a><a class="hb" href="/auction-manage">כניסה לניהול</a></div></div></header>'
     +'<main class="hm">'
     +'<section class="sec" aria-labelledby="hs"><h2 id="hs">איך זה עובד</h2><ol class="hsteps"><li><b>פותחים מכירה</b><br>מגדירים מוצרים, מחירים וחבילות.</li><li><b>מפיצים</b><br>קישור לדף המכירה, קישורים אישיים למגייסים ומספר טלפון.</li><li><b>הקהל קונה</b><br>באתר או בטלפון, ומקבל מספרי כרטיסים במייל.</li><li><b>מגרילים</b><br>בדף ההגרלות, ומפרסמים את הזוכים.</li></ol></section>'

    b.disabled=true;m.textContent='רושמים…';m.className='msg';
    post({a:'repOrder',s:SLUG,t:Q.get('rep'),pin:pin,name:$('rn').value,phone:$('rp').value,email:$('rm').value,city:$('rc').value,pkg:pk()?pk().id:null,items:its(),method:$('rh').value,note:$('rt').value}).then(function(x){
      b.disabled=false;if(!x.id){if(x.error==='pin'){try{sessionStorage.removeItem('arpin-'+Q.get('rep'))}catch(e){}}m.textContent=x.message||'לא נרשם.';m.className='msg bad';return}
      try{if(pin)sessionStorage.setItem('arpin-'+Q.get('rep'),pin)}catch(e){}
      alert('ההזמנה נרשמה: '+x.count+' כרטיסים, '+nis(x.amount)+(x.tickets&&x.tickets.length?'\nמספרי הכרטיסים: '+x.tickets.map(function(t){return t.num+': '+t.serials.join(', ')}).join(' · '):'\nממתינה לאישור מנהל המכירה'));location.reload();
    }).catch(function(){b.disabled=false;m.textContent='אין חיבור לשרת.';m.className='msg bad'});
  };
}

/* ===== הדף האישי של מגייס ===== */
function repView(){
  get({a:'rep',s:SLUG,t:Q.get('rep')}).then(function(j){
    if(j._st!==200){closed('הדף לא נמצא');return}
    var pct=j.rep.goal?Math.min(100,Math.round(j.amount/j.rep.goal*100)):0;
    document.title='הדף של '+(j.rep.name||'מגייס')+' · '+j.sale.title;
    app.innerHTML='<header class="top"><div class="t"><div class="kick">המכירה הסינית של '+esc(j.sale.title)+'</div><h1>הדף של '+esc(j.rep.name||'מגייס')+'</h1><div class="sub">כל רכישה דרך הקישור, הקוד או הקו האישי נרשמת כאן</div></div></header>'
     +'<div class="repw"><section class="card"><div class="row"><span>גויס עד כה</span>'+(j.rep.goal?'<span>היעד: '+nis(j.rep.goal)+'</span>':'')+'</div><div style="font-size:34px;font-weight:700">'+nis(j.amount)+'</div>'
     +(j.rep.goal?'<div class="lb"><div class="t" role="img" aria-label="'+pct+' אחוז מהיעד" style="height:12px"><i style="width:'+pct+'%"></i></div></div>':'')
     +'<div class="row"><span>'+j.orders+' רכישות</span><span>'+j.tickets+' כרטיסים</span></div>'+(j.pending?'<div class="row"><span>ממתין לאישור מנהל המכירה</span><b>'+nis(j.pending)+'</b></div>':'')+'</section>'
     +'<section class="card"><h2 style="font-size:18px;font-family:Heebo">הקישור האישי</h2><div class="lnk" id="lnk">'+esc(j.link)+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button type="button" class="go" style="height:46px;font-size:15px" id="cp">העתקת הקישור</button><a class="ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit" href="mailto:?subject='+encodeURIComponent('המכירה הסינית של '+j.sale.title)+'&body='+encodeURIComponent(j.link)+'">שליחה במייל</a></div></section>'
     +'<section class="card" style="background:var(--cream);border-color:var(--cream-line)"><h2 style="font-size:18px;font-family:Heebo;color:var(--cream-ink)">למי שקונה בטלפון</h2><div class="row"><span style="color:var(--cream-ink)">קוד הנציג שלך</span><span class="code">'+esc(j.rep.code)+'</span></div>'
     +(j.sale.phoneLine?'<p style="margin:0;color:var(--cream-ink);font-size:14px">מתקשרים ל־'+esc(j.sale.phoneLine)+' ומקישים את הקוד כשהמערכת מבקשת קוד נציג. אפשר להקיש אותו גם ברכישה באתר.</p>':'')+'</section>'
     +(j.canOrder!=='off'&&j.sale.open?repForm(j):'')
     +'<section class="sec"><h2 style="font-size:18px;font-family:Heebo">רכישות אחרונות</h2>'+(j.recent.length?j.recent.map(function(r){return '<div class="card" style="flex-direction:row;justify-content:space-between;padding:12px 14px"><span>'+esc(r.name)+' · '+(r.channel==='phone'?'בטלפון':r.channel==='manual'?'ידני':r.channel==='rep'?'דרך נציג':'באתר')+'</span><b>'+nis(r.amount)+'</b></div>'}).join(''):'<p class="msg">עוד אין רכישות.</p>')+'</section></div>';
    if(j.canOrder!=='off'&&j.sale.open)wireRepForm(j);
    $('cp').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(j.link):Promise.reject()).then(function(){b.textContent='הועתק'}).catch(function(){var r=document.createRange();r.selectNodeContents($('lnk'));var s=getSelection();s.removeAllRanges();s.addRange(r)})};
  }).catch(function(){closed('לא הצלחנו לטעון')});
}
})();
</script>
</body>
</html>
