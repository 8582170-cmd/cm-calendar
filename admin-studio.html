<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סטודיו רקעים · ניהול MyLuach</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-180.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* סטודיו רקעים: כלי פנימי לייצור רקעים לברכות והזמנות. בונה פרומפטים, פרומפטים מוכנים, תהליך העבודה */
:root{--paper:#f6f7f4;--sheet:#fff;--ink:#172126;--mute:#5c686c;--line:#dde2df;--teal:#1f5c63;--teal-ink:#fff;--teal-soft:#e4eeec;--bad:#b3261e;--code-bg:#13221f;--code-fg:#eef3e8;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1517;--sheet:#172024;--ink:#e6ecea;--mute:#9aa7a8;--line:#28343a;--teal:#79c0b8;--teal-ink:#0d1a1b;--teal-soft:#1b2b2d;--bad:#ef8a80;--code-bg:#0a1112;--code-fg:#e3ece4;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f1517;--sheet:#172024;--ink:#e6ecea;--mute:#9aa7a8;--line:#28343a;--teal:#79c0b8;--teal-ink:#0d1a1b;--teal-soft:#1b2b2d;--bad:#ef8a80;--code-bg:#0a1112;--code-fg:#e3ece4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Assistant",Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin-inline:auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px}
h2{margin:0;font-size:20px}
.sub{margin:0;color:var(--mute);font-size:14px}
section{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
a{color:var(--teal)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:8px 16px;border-radius:9px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.sm{padding:5px 12px;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.fields{grid-template-columns:minmax(0,1fr)}}
.fields label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;min-width:0}
.fields .wide{grid-column:span 2}
@media (max-width:440px){.fields .wide{grid-column:auto}}
pre{margin:0;background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:14px 16px;border-radius:10px;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{background:var(--teal-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--paper)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0;font-size:16px}
.card .meta{font-size:13px;color:var(--mute)}
.card pre{font-size:12.5px;flex:1}
.tag{font-size:12px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:0 7px}
ol.steps{margin:0;padding:0 1.4em 0 0;display:flex;flex-direction:column;gap:8px}
ol.steps b{display:inline}
.rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px 22px}
.rules li{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.rules b{display:block}
code{font-family:var(--mono);font-size:.9em;direction:ltr;unicode-bidi:isolate}
.pr-list{display:flex;flex-direction:column;gap:12px}
.pr{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.pr.off{opacity:.6}
.pr .fields{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.pr .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);width:100%;min-height:60px;resize:vertical}
.pr .tx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.pr .tx{grid-template-columns:minmax(0,1fr)}}
.pr .tx label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;min-width:0}
.pr .tx .full{grid-column:1/-1}
.pr details summary{cursor:pointer;font-weight:700;color:var(--teal);font-size:14px}
.pr .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pr .hd b{font-size:17px}
.savebar{position:sticky;bottom:0;background:var(--sheet);padding-block:10px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ok{color:#1f7a3a;font-weight:700}
.fl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fl-bar select,.fl-bar input{width:auto}
.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.fl-c{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.fl-c.off{opacity:.55}
.fl-c .smp{font-size:30px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;min-height:42px}
.fl-c .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.fl-c .nm{font-size:12px;color:var(--mute);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-c label.tg{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.fl-c label.tg input{width:18px;height:18px;accent-color:var(--teal)}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.tp-c{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.tp-c.off{opacity:.55}
.tp-c canvas{width:100%;aspect-ratio:794/1123;border-radius:4px;background:var(--sheet);box-shadow:0 1px 4px rgb(0 0 0 / .15)}
.tp-c b{font-size:15px}.tp-c .m{font-size:13px;color:var(--mute)}
.tp-ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;border:2px solid var(--teal);border-radius:14px;padding:14px}
@media (max-width:820px){.tp-ed{grid-template-columns:minmax(0,1fr)}}
.tp-pv{position:relative;width:100%;max-width:420px;aspect-ratio:794/1123;touch-action:none;cursor:crosshair;justify-self:center}
.tp-pv canvas{width:100%;height:100%;display:block;border-radius:4px;box-shadow:0 2px 10px rgb(0 0 0 / .2)}
.tp-pv .ar{position:absolute;border:2px dashed #e0457b;background:rgb(224 69 123 / .08);pointer-events:none}
.tp-f{display:flex;flex-direction:column;gap:12px;min-width:0}
.tp-f .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.tp-f input[type=color]{width:100%;height:38px;padding:2px}
.cat-l{display:flex;flex-wrap:wrap;gap:6px}
.cat-i{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:14px;background:var(--paper)}
.cat-i.off{opacity:.5;text-decoration:line-through}
.cat-i button{font:inherit;font-size:12px;border:0;background:none;color:var(--teal);cursor:pointer;padding:2px 4px}
.login{max-width:360px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
.msg{font-weight:700;color:var(--bad)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="/assets/greetings/greetings.js?v=8"></script>
</head>
<body>
<div class="wrap" id="app">
  <form class="login" id="login">
    <h1>סטודיו רקעים</h1>
    <label>סיסמת הניהול<br><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">כניסה</button>
    <span class="msg" id="lmsg"></span>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<template id="studio">
  <div class="top">
    <div>
      <h1>סטודיו רקעים</h1>
      <p class="sub">ייצור רקעים לברכות ולהזמנות. בוחרים שילוב, מעתיקים את הפרומפט לכלי ה־AI, ומורידים את התוצאה.</p>
    </div>
    <nav><a class="btn sm" href="/brachot/" target="_blank" rel="noopener">הגלריה ללקוחות</a><a class="btn sm" href="/admin">חזרה לניהול</a><button class="btn sm" type="button" id="out">יציאה</button></nav>
  </div>

  <section aria-labelledby="b-h">
    <h2 id="b-h">בונה הפרומפטים</h2>
    <div class="fields">
      <label for="tool">כלי<select id="tool"><option value="firefly">Adobe Firefly</option><option value="mj">Midjourney</option></select></label>
      <label for="occ">אירוע<select id="occ"></select></label>
      <label for="kind">סוג<select id="kind"></select></label>
      <label for="ar">גודל<select id="ar">
        <option value="5:7">דף לאורך (A4/A3)</option>
        <option value="7:5">דף לרוחב</option>
        <option value="1:1">ריבוע לוואטסאפ</option>
        <option value="9:16">סטורי / מסך טלפון</option>
      </select></label>
      <label for="style">סגנון מסגרת<select id="style"></select></label>
      <label for="pal">צבעי המסגרת<select id="pal"></select></label>
      <label for="center" class="wide">צבע אזור הטקסט<select id="center">
        <option value="cream">שמנת בהיר</option>
        <option value="white">לבן נקי</option>
        <option value="parchment">קלף בהיר</option>
        <option value="dark">כהה (לטקסט בזהב)</option>
        <option value="auto">לפי בחירת ה־AI</option>
      </select></label>
      <label for="extra" class="wide" style="grid-column:1/-1">תוספת חופשית (באנגלית)<input id="extra" dir="ltr" placeholder="e.g. with a small crown at the top"></label>
    </div>
    <pre id="out-p" aria-live="polite"></pre>
    <p class="hint" id="toolHint"></p>
    <div class="actions">
      <button class="btn primary" id="copy" type="button">העתקת הפרומפט</button>
      <button class="btn" id="rand" type="button">שילוב אקראי</button>
    </div>
  </section>

  <section aria-labelledby="pr-h">
    <h2 id="pr-h">נוסחים מוכנים לברכות</h2>
    <p class="sub">נוסחים שהלקוחות יכולים לבחור בעורך, ואחר כך לערוך. כל נוסח שייך לאירוע ולסוג (ברכה או הזמנה), או לכולם. שדה שנשאר ריק לא משנה את מה שכבר כתוב בעיצוב.</p>
    <div class="actions"><label style="display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px">הצגה<select id="prFilter" style="width:auto"><option value="">כל האירועים</option></select></label>
      <button class="btn primary" type="button" id="prAdd">נוסח חדש</button></div>
    <div class="pr-list" id="prList"><p class="sub">טוען…</p></div>
    <div class="savebar"><button class="btn primary" type="button" id="prSave">שמירת הנוסחים</button><span id="prMsg" role="status"></span></div>
  </section>

  <section aria-labelledby="tp-h">
    <h2 id="tp-h">עיצובים ללקוחות (דפים מוכנים)</h2>
    <p class="sub">כאן מעלים רקע שייצרת (למשל ב־Firefly), מסמנים עליו בגרירה את אזור הטקסט, ובוחרים אירוע וסוג. אחרי שמירה העיצוב מופיע בגלריה ללקוחות ב־myluach.org/brachot.</p>
    <div class="actions"><button class="btn primary" type="button" id="tpNew">+ עיצוב חדש</button><label style="display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px">הצגה<select id="tpFilter" style="width:auto"><option value="">כל האירועים</option></select></label></div>
    <div id="tpEd"></div>
    <div class="tp-grid" id="tpList"><p class="sub">טוען…</p></div>
    <h3 style="margin:8px 0 0;font-size:17px">אירועים (קטגוריות בגלריה)</h3>
    <p class="sub">אפשר להוסיף אירוע חדש, לשנות שם, או להסתיר אירוע מהגלריה. אירוע מוסתר לא מוצג ללקוחות גם אם יש בו עיצובים.</p>
    <div class="cat-l" id="catList"></div>
    <div class="actions"><input id="catNew" placeholder="שם אירוע חדש, למשל אפשערניש" style="width:auto;min-width:220px"><button class="btn sm" type="button" id="catAdd">הוספת אירוע</button></div>
    <div class="savebar"><button class="btn primary" type="button" id="tpSave">שמירת העיצובים והאירועים</button><span id="tpMsg" role="status"></span></div>
  </section>

  <section aria-labelledby="fl-h">
    <h2 id="fl-h">גופנים לברכות</h2>
    <p class="sub">כל הגופנים שבאתר, כולל האוספים שהעלית. מסמנים אילו מוצגים ללקוחות בבוחר הגופנים, ונותנים לכל אחד שם בעברית וסוג (הקבוצה שבה הוא יופיע).</p>
    <div class="fl-bar">
      <input type="search" id="flQ" placeholder="חיפוש לפי שם או יצרן" aria-label="חיפוש גופן">
      <select id="flS" aria-label="סינון לפי מצב"><option value="">הכל</option><option value="on">מוצגים ללקוחות</option><option value="off">מוסתרים</option></select>
      <select id="flC" aria-label="סינון לפי סוג"><option value="">כל הסוגים</option></select>
      <select id="flL" aria-label="סינון לפי מקור"><option value="">כל המקורות</option><option value="my">האוספים שלך</option><option value="he">Google עברית</option><option value="en">Google אנגלית</option></select>
      <input id="flT" placeholder="טקסט לדוגמה" value="מזל טוב · שנה טובה" aria-label="טקסט לדוגמה בעברית"><input id="flTe" dir="ltr" placeholder="English sample" value="Mazal Tov · Celebrate" aria-label="טקסט לדוגמה באנגלית">
      <span class="sub" id="flN"></span>
    </div>
    <div class="fl-bar"><button class="btn sm primary" type="button" id="flAllOn">הצגת כל הגופנים ללקוחות</button><button class="btn sm" type="button" id="flAllOff">הסתרת כל הגופנים</button><span class="sub">אחרי הלחיצה צריך ללחוץ "שמירת הגופנים" בתחתית.</span></div>
    <div class="fl-grid" id="flGrid"><p class="sub">טוען…</p></div>
    <div class="actions"><button class="btn" type="button" id="flMore" hidden>עוד גופנים</button></div>
    <div class="savebar"><button class="btn primary" type="button" id="flSave">שמירת הגופנים</button><span id="flMsg" role="status"></span></div>
  </section>

  <section aria-labelledby="r-h">
    <h2 id="r-h">פרומפטים מוכנים לפי אירוע</h2>
    <p class="sub">לכל אירוע שלושה שילובים שמתאימים לו. "לבונה" טוען את השילוב למעלה כדי לשנות בו משהו.</p>
    <div class="chips" id="chips" role="group" aria-label="סינון לפי אירוע"></div>
    <div class="grid" id="cards"></div>
  </section>

  <section aria-labelledby="w-h">
    <h2 id="w-h">מהפרומפט לרקע מוכן</h2>
    <ol class="steps">
      <li><b>הגדרות ב־Firefly:</b> מודל Firefly Image בלי כתר (חוסך קרדיטים), יחס Portrait (3:4), הרזולוציה הכי גבוהה שפתוחה.</li>
      <li><b>מייצרים:</b> מדביקים, לוחצים Generate. לא אהבתם? מריצים שוב, כל ריצה שונה.</li>
      <li><b>מנקים את המרכז:</b> אם נכנס משהו לאזור הטקסט, ב־Firefly: Generative Fill על המרכז עם <code>plain smooth light cream panel</code>. ב־Midjourney: Vary Region.</li>
      <li><b>מגדילים להדפסה:</b> ב־Upscayl (חינם). ל־A4 לפחות 2480×3508 פיקסלים, ל־A3 לפחות 3508×4961.</li>
      <li><b>מתקנים פגמים:</b> ב־Photopea, בזום 100%: עלים מעוותים, קווים שבורים, חוסר סימטריה. שומרים JPG באיכות 95.</li>
      <li><b>שומרים לפי קטגוריה:</b> שם קובץ כמו <code>wedding-gate-navy-01.jpg</code>, כדי שיהיה קל להעלות לאתר.</li>
    </ol>
  </section>

  <section aria-labelledby="t-h">
    <h2 id="t-h">כללים שחוסכים זמן</h2>
    <ul class="rules">
      <li><b>אף פעם לא טקסט בתמונה</b>ה־AI משבש אותיות עבריות. את כל הטקסט האתר מניח מעל הרקע.</li>
      <li><b>בלי דמויות</b>הפרומפטים מבקשים בלי אנשים. אם בכל זאת הופיעה דמות, פוסלים.</li>
      <li><b>לספור קנים בחנוכייה</b>חנוכייה: 8 קנים ושמש. מגן דוד: 6 קצוות. ה־AI טועה בזה הרבה.</li>
      <li><b>סדרה תואמת</b>רקע מוצלח מעלים כ־Reference image בסגנון (Style), ומייצרים ממנו קטגוריות נוספות באותו קו.</li>
      <li><b>רק תמונות שלנו כרפרנס</b>לא מעלים עיצובים של אתרים אחרים. רוצים משהו ברוחם? מתארים במילים.</li>
      <li><b>מרכז ריק בגודל נכון</b>לברכה ארוכה צריך כ־60% מהדף ריק. מסגרת עבה מדי? מוסיפים <code>thin elegant frame</code>.</li>
    </ul>
  </section>
</template>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),app=$('app');
let PW='';try{PW=sessionStorage.getItem('myluach-admin')||''}catch(e){}
function check(){
  return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PW},body:JSON.stringify({action:'contentget',page:'studio'})})
    .then(r=>{if(!r.ok)throw Object.assign(new Error('auth'),{code:r.status});});
}
function login(){
  check().then(()=>{try{sessionStorage.setItem('myluach-admin',PW)}catch(e){}start()})
    .catch(e=>{$('lmsg').textContent=e.code===401?'סיסמה שגויה':e.code===503?'לא הוגדרה סיסמת ניהול בשרת':'שגיאה בכניסה, נסו שוב';try{sessionStorage.removeItem('myluach-admin')}catch(x){}});
}
$('login').addEventListener('submit',e=>{e.preventDefault();PW=$('pw').value;login()});
if(PW)login();

const STYLES={
 gate:["שער מפואר","grand ornate arch gateway framing the page, carved marble columns on both sides with gilded capitals"],
 filigree:["פיליגרן מוזהב","intricate gold filigree border with baroque scrollwork and embossed corner ornaments"],
 curtain:["וילון מלכותי","luxurious draped velvet curtains with gold tassels framing the top and sides, regal stage feel"],
 floral:["זר פרחים","lush realistic floral frame of roses, peonies and greenery around the edges"],
 watercolor:["אקוורל עדין","soft watercolor botanical corners, delicate hand-painted illustration, airy and light"],
 parchment:["מגילת קלף","antique parchment scroll with rolled wooden handles, aged paper texture"],
 jerusalem:["אבן ירושלמית","Jerusalem stone arched window, golden limestone texture, Old City architecture"],
 papercut:["חיתוך נייר","layered laser-cut paper art border, intricate papercut lace pattern, soft shadows between layers"],
 deco:["ארט דקו","art deco geometric gold border, symmetrical lines and fan motifs, refined 1920s style"],
 engraving:["תחריט וינטג׳","vintage copperplate engraving style ornamental border, fine line work, classic bookplate"]
};
const PALS={
 navygold:["כחול וזהב","deep navy blue and rich metallic gold"],
 burgundy:["בורדו וזהב","deep burgundy and antique gold"],
 emerald:["ירוק אמרלד וזהב","emerald green and gold"],
 ivory:["שנהב ושמפניה","ivory white and soft champagne gold"],
 blackgold:["שחור וזהב","black and polished gold, high contrast luxury"],
 blush:["ורוד עתיק","blush pink, dusty rose and rose gold"],
 sky:["תכלת וכסף","light sky blue, white and silver"],
 sage:["מרווה ושמנת","sage green, cream and muted gold"],
 royal:["סגול מלכותי","royal purple and gold"],
 silver:["לבן וכסף","pure white and brushed silver"]
};
const CENTERS={
 cream:"the large center area is a plain smooth light cream panel, much lighter than the ornate frame around it, empty and ready for dark text",
 white:"the large center area is a plain clean white panel, much lighter than the ornate frame around it, empty and ready for dark text",
 parchment:"the large center area is plain light parchment paper with a subtle even texture, lighter than the frame, empty and ready for text",
 dark:"the large center area is a plain smooth dark background in the main palette color, empty and ready for gold text",
 auto:"center area plain and empty for text"
};
const BOTH=["greeting","invite"],G=["greeting"];
const OCC=[
 ["wedding","חתונה","wedding celebration theme, roses, grapevines and pomegranates, chuppah canopy inspiration",BOTH,[["gate","navygold"],["curtain","burgundy"],["floral","ivory"]]],
 ["engagement","אירוסין / וורט","engagement celebration, delicate roses and pearls, gentle sparkle",BOTH,[["filigree","blush"],["watercolor","ivory"],["deco","blackgold"]]],
 ["anniversary","יום נישואין","wedding anniversary, two silver candlesticks, roses and grapevines",G,[["floral","burgundy"],["filigree","ivory"],["watercolor","blush"]]],
 ["barmitzvah","בר מצווה","bar mitzvah theme, tallit stripes pattern, stack of holy books, Torah scroll with silver crown",BOTH,[["gate","navygold"],["jerusalem","ivory"],["parchment","emerald"]]],
 ["batmitzvah","בת מצווה","bat mitzvah theme, Shabbat candlesticks, delicate flowers, pearls and soft ribbons",BOTH,[["watercolor","blush"],["papercut","ivory"],["floral","sage"]]],
 ["birth","ברית / הולדת","newborn celebration, soft clouds, little stars, gentle and tender",BOTH,[["watercolor","sky"],["papercut","silver"],["filigree","blush"]]],
 ["birthday","יום הולדת","joyful birthday, balloons, confetti and festive ribbons",BOTH,[["papercut","sky"],["watercolor","blush"],["deco","navygold"]]],
 ["donors","תורמים והוקרה","honor and gratitude, laurel wreaths, regal crown, grand pillars",BOTH,[["gate","burgundy"],["curtain","navygold"],["filigree","blackgold"]]],
 ["torah","הכנסת ספר תורה","Torah scroll with ornate silver crown, Torah ark curtain, lanterns and festive flags",BOTH,[["curtain","burgundy"],["gate","royal"],["jerusalem","navygold"]]],
 ["siyum","סיום מסכת","completion of Talmud study, stacks of Gemara volumes, quill and inkwell, warm candlelight",BOTH,[["engraving","ivory"],["parchment","emerald"],["filigree","navygold"]]],
 ["home","חנוכת בית","new home dedication, Jerusalem stone doorway with a mezuzah, olive branches, warm lights",BOTH,[["jerusalem","ivory"],["floral","sage"],["deco","emerald"]]],
 ["business","פתיחת עסק","grand opening of a new business, elegant ribbon with a bow, shop doorway, olive branches, festive and prosperous",BOTH,[["deco","blackgold"],["filigree","emerald"],["curtain","navygold"]]],
 ["shul","חנוכת בית כנסת","dedication of a new synagogue, majestic synagogue facade with arched windows, Torah ark with ornate curtain, hanging lamps, Jerusalem stone",BOTH,[["jerusalem","navygold"],["gate","burgundy"],["curtain","royal"]]],
 ["shabbat","שבת התאחדות / אירוע תורני","community Shabbat gathering, Shabbat candles, braided challah under embroidered cover, silver wine goblet",BOTH,[["curtain","navygold"],["filigree","royal"],["engraving","ivory"]]],
 ["roshhashana","ראש השנה","Rosh Hashana, pomegranates, apples, honey jar and shofar",BOTH,[["floral","burgundy"],["watercolor","ivory"],["filigree","emerald"]]],
 ["yomkippur","יום כיפור / גמר חתימה","Yom Kippur atmosphere, pure white, glowing candles, open prayer book, serene",G,[["engraving","silver"],["filigree","ivory"],["papercut","silver"]]],
 ["sukkot","סוכות","Sukkot, etrog and lulav, sukkah with palm branch roof, hanging decorations",BOTH,[["floral","sage"],["parchment","emerald"],["jerusalem","ivory"]]],
 ["simchattorah","שמחת תורה","Simchat Torah, Torah scrolls, festive flags, joyful",BOTH,[["deco","navygold"],["papercut","sky"],["curtain","royal"]]],
 ["chanukah","חנוכה","Hanukkah, golden menorah with glowing oil lights, olive oil jugs, dreidels",BOTH,[["gate","navygold"],["filigree","blackgold"],["engraving","sky"]]],
 ["tubishvat","ט״ו בשבט","Tu BiShvat, the seven species of the Land of Israel, blossoming almond branches",BOTH,[["watercolor","sage"],["floral","ivory"],["engraving","emerald"]]],
 ["purim","פורים","Purim, royal crown, megillah scroll, festive gift baskets, masks",BOTH,[["curtain","royal"],["deco","burgundy"],["papercut","blush"]]],
 ["pesach","פסח","Passover, matzah, seder plate, silver wine cup, spring flowers",BOTH,[["floral","ivory"],["filigree","navygold"],["watercolor","sky"]]],
 ["lagbaomer","ל״ג בעומר","Lag BaOmer, bonfire flames, Meron mountain landscape at night, bow and arrow",BOTH,[["engraving","navygold"],["parchment","ivory"],["jerusalem","burgundy"]]],
 ["shavuot","שבועות","Shavuot, wheat sheaves, abundant flowers and greenery, two tablets of the covenant",BOTH,[["floral","sage"],["watercolor","ivory"],["gate","emerald"]]],
 ["condolence","ניחום אבלים","condolence, a single candle flame, olive branch, calm and respectful, subdued tones",G,[["engraving","silver"],["filigree","navygold"],["jerusalem","ivory"]]]
];
const KINDS={greeting:["ברכה","generous empty center space for a long blessing text"],invite:["הזמנה","generous empty center space for invitation text, a small ornament at the top center"]};
const MJ_NO=" --no text, letters, words, watermark, signature, people, faces, hands";
const FF_AR={"5:7":"Portrait (3:4)","7:5":"Landscape (4:3)","1:1":"Square (1:1)","9:16":"Widescreen לאורך (9:16)"};

function build(o){
  const occ=OCC.find(x=>x[0]===o.occ);
  let t=`${STYLES[o.style][1]}, ${occ[2]}, ${KINDS[o.kind][1]}, ${PALS[o.pal][1]} color palette for the frame, ${CENTERS[o.center||'cream']}, symmetrical composition, highly detailed, elegant premium print design`;
  if(o.extra&&o.extra.trim())t+=', '+o.extra.trim();
  return o.tool==='mj'?`${t} --ar ${o.ar}${MJ_NO}`:`${t}. No text, no letters, no people.`;
}

let current='';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600)}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function copy(text,el){
  try{navigator.clipboard.writeText(text).then(()=>toast('הועתק'),()=>{selectEl(el);toast('סומן, העתיקו עם Ctrl+C')})}
  catch(e){selectEl(el);toast('סומן, העתיקו עם Ctrl+C')}
}

/* נוסחים מוכנים */
var PR=[], GR=window.Greetings;
var MAIN=['quote','title','intro','occasion','body','signLabel','sign'];
function api(body){return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PW},body:JSON.stringify(body)}).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error||'error');return j}))}
function prInit(){
  GR.CATS.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1];$('prFilter').appendChild(o)});
  $('prFilter').onchange=prRender;
  $('prAdd').onclick=()=>{const f=$('prFilter').value;PR.unshift({id:Math.random().toString(36).slice(2,10),title:'',cat:f||'all',kind:'greeting',on:true,fields:{}});prRender();const t=document.querySelector('#prList [data-f="title"]');if(t)t.focus()};
  $('prSave').onclick=()=>{$('prMsg').className='';$('prMsg').textContent='שומר…';
    api({action:'greetsave',presets:PR}).then(d=>{PR=d.presets||[];prRender();$('prMsg').className='ok';$('prMsg').textContent='נשמר. הלקוחות יראו את הנוסחים תוך כמה דקות.'})
      .catch(e=>{$('prMsg').className='msg';$('prMsg').textContent='השמירה נכשלה: '+e.message})};
  api({action:'greetget'}).then(d=>{PR=d.presets||[];prRender()}).catch(e=>{$('prList').innerHTML='<p class="msg">לא הצלחתי לטעון את הנוסחים: '+e.message+'</p>'});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function prRender(){
  const f=$('prFilter').value,box=$('prList');box.innerHTML='';
  const list=PR.filter(p=>!f||p.cat===f||p.cat==='all');
  if(!list.length){box.innerHTML='<p class="sub">אין עדיין נוסחים'+(f?' לאירוע הזה':'')+'. לוחצים "נוסח חדש".</p>';return}
  const catOpts='<option value="all">כל האירועים</option>'+GR.CATS.map(c=>'<option value="'+c[0]+'">'+esc(c[1])+'</option>').join('');
  const lab=k=>(GR.FIELDS.find(x=>x[0]===k)||[k,k])[1];
  list.forEach(p=>{
    const el=document.createElement('div');el.className='pr'+(p.on===false?' off':'');
    const ta=k=>'<label class="'+(k==='body'||k==='invite'?'full':'')+'">'+esc(lab(k))+'<textarea data-k="'+k+'" rows="'+(k==='body'||k==='invite'?4:2)+'">'+esc((p.fields||{})[k]||'')+'</textarea></label>';
    const more=GR.FIELDS.map(x=>x[0]).filter(k=>MAIN.indexOf(k)<0);
    el.innerHTML='<div class="hd"><b>'+esc(p.title||'נוסח בלי שם')+'</b><div class="actions"><label style="display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700"><input type="checkbox" data-f="on" style="width:18px;height:18px"'+(p.on!==false?' checked':'')+'> מוצג ללקוחות</label><button class="btn sm" type="button" data-del>מחיקה</button></div></div>'+
      '<div class="fields"><label class="wide">שם הנוסח (הלקוח רואה אותו ברשימה)<input data-f="title" value="'+esc(p.title)+'"></label>'+
      '<label>אירוע<select data-f="cat">'+catOpts+'</select></label>'+
      '<label>סוג<select data-f="kind"><option value="greeting">ברכה</option><option value="invite">הזמנה</option><option value="all">ברכה והזמנה</option></select></label></div>'+
      '<div class="tx">'+MAIN.map(ta).join('')+'</div>'+
      '<details'+(more.some(k=>(p.fields||{})[k])?' open':'')+'><summary>שדות נוספים (הזמנות, שמות)</summary><div class="tx" style="margin-top:10px">'+more.map(ta).join('')+'</div></details>';
    el.querySelector('[data-f=cat]').value=p.cat||'all';el.querySelector('[data-f=kind]').value=p.kind||'greeting';
    el.querySelector('[data-f=title]').oninput=e=>{p.title=e.target.value;el.querySelector('.hd b').textContent=p.title||'נוסח בלי שם'};
    el.querySelector('[data-f=cat]').onchange=e=>{p.cat=e.target.value};
    el.querySelector('[data-f=kind]').onchange=e=>{p.kind=e.target.value};
    el.querySelector('[data-f=on]').onchange=e=>{p.on=e.target.checked;el.classList.toggle('off',!p.on)};
    el.querySelectorAll('textarea[data-k]').forEach(t=>t.oninput=()=>{p.fields=p.fields||{};p.fields[t.dataset.k]=t.value});
    const del=el.querySelector('[data-del]');del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent='בטוח? לחצו שוב';return}PR.splice(PR.indexOf(p),1);prRender()};
    box.appendChild(el);
  });
}

/* גופנים לברכות */
var FL={}, flShown=60, flIO=null;
var FCATS=[['STAM','סת״ם, רש״י וקודש'],['CLASSIC','קלאסי'],['HAND','כתב יד'],['OUTLINE','חלול ומעוטר'],['DISPLAY','כותרות'],['FUN','שמח וצבעוני'],['NEW','נוספים (לא ממוין)'],['SERIF','קלאסי (Google)'],['SANS_SERIF','מודרני (Google)'],['HANDWRITING','כתב יד (Google)']];
function flInit(){
  FCATS.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1];$('flC').appendChild(o)});
  ['flQ','flS','flC','flL'].forEach(id=>$(id).addEventListener(id==='flQ'?'input':'change',()=>{flShown=60;flRender()}));
  ['flT','flTe'].forEach(id=>$(id).addEventListener('input',()=>document.querySelectorAll('.fl-c .smp').forEach(e=>e.textContent=e.dir==='ltr'?$('flTe').value:$('flT').value)));
  $('flMore').onclick=()=>{flShown+=60;flRender()};
  $('flAllOn').onclick=()=>{flList().forEach(m=>flSet(m.id,{on:true}));flRender();$('flMsg').className='';$('flMsg').textContent='סומנו. ללחוץ "שמירת הגופנים" כדי שזה יעבור ללקוחות.'};
  $('flAllOff').onclick=()=>{flList().forEach(m=>flSet(m.id,{on:false}));flRender();$('flMsg').className='';$('flMsg').textContent='הוסתרו. ללחוץ "שמירת הגופנים" כדי שזה יעבור ללקוחות.'};
  $('flSave').onclick=()=>{$('flMsg').className='';$('flMsg').textContent='שומר…';
    api({action:'greetfontssave',fonts:FL}).then(d=>{FL=d.fonts||{};GR.applySettings(FL);$('flMsg').className='ok';$('flMsg').textContent='נשמר. הלקוחות יראו את השינוי תוך כמה דקות.'})
      .catch(e=>{$('flMsg').className='msg';$('flMsg').textContent='השמירה נכשלה: '+e.message})};
  Promise.all([GR.catalog(),api({action:'greetfontsget'})]).then(([_,d])=>{FL=d.fonts||{};GR.applySettings(FL);flRender()})
    .catch(e=>{$('flGrid').innerHTML='<p class="msg">לא הצלחתי לטעון את הגופנים: '+esc(e.message)+'</p>'});
}
function flSet(id,o){FL[id]=Object.assign({},FL[id]||{},o);GR.applySettings(FL)}
function flList(){
  const q=$('flQ').value.trim().toLowerCase(),st=$('flS').value,c=$('flC').value,l=$('flL').value;
  const LO={my:0,he:1,en:2};
  return GR.pickList(true).sort((a,b)=>LO[a.lang]-LO[b.lang]).filter(m=>(!q||(m.id+' '+m.label+' '+m.maker).toLowerCase().includes(q))&&(!st||(st==='on')===m.on)&&(!c||m.cat===c)&&(!l||m.lang===l));
}
function flRender(){
  const all=flList(),box=$('flGrid');box.innerHTML='';
  $('flN').textContent=all.length+' גופנים · '+GR.pickList().length+' מוצגים ללקוחות';
  if(flIO)flIO.disconnect();
  flIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){GR.fontCss(e.target.dataset.f);flIO.unobserve(e.target)}}),{rootMargin:'300px'}):null;
  const catOpts=FCATS.map(c=>'<option value="'+c[0]+'">'+esc(c[1])+'</option>').join('');
  all.slice(0,flShown).forEach(m=>{
    const el=document.createElement('div');el.className='fl-c'+(m.on?'':' off');el.dataset.f=m.id;
    el.innerHTML='<div class="smp"></div><div class="nm"></div><div class="row2"><input aria-label="שם בעברית"><select aria-label="סוג">'+catOpts+'</select></div><label class="tg"><input type="checkbox"> מוצג ללקוחות</label>';
    const smp=el.querySelector('.smp');if(m.lang==='en')smp.dir='ltr';smp.textContent=m.lang==='en'?$('flTe').value:$('flT').value;smp.style.fontFamily='"'+m.id+'", serif';
    el.querySelector('.nm').textContent=m.id+(m.maker?' · '+m.maker:'')+(m.lang==='en'?' · אנגלית בלבד':'');
    const inp=el.querySelector('input:not([type])');inp.value=m.label;inp.oninput=()=>flSet(m.id,{label:inp.value});
    const sel=el.querySelector('select');sel.value=m.cat;sel.onchange=()=>flSet(m.id,{cat:sel.value});
    const cb=el.querySelector('input[type=checkbox]');cb.checked=m.on;cb.onchange=()=>{flSet(m.id,{on:cb.checked});el.classList.toggle('off',!cb.checked);$('flN').textContent=all.length+' גופנים · '+GR.pickList().length+' מוצגים ללקוחות'};
    box.appendChild(el);if(flIO)flIO.observe(el);else GR.fontCss(m.id);
  });
  const filt=$('flQ').value.trim()||$('flS').value||$('flC').value||$('flL').value;
  $('flAllOn').textContent=filt?'הצגת '+all.length+' הגופנים שבסינון':'הצגת כל '+all.length+' הגופנים ללקוחות';
  $('flAllOff').textContent=filt?'הסתרת '+all.length+' הגופנים שבסינון':'הסתרת כל '+all.length+' הגופנים';
  $('flMore').hidden=all.length<=flShown;
  if(!all.length)box.innerHTML='<p class="sub">לא נמצאו גופנים.</p>';
}

/* עיצובים ללקוחות */
var TP={cats:[],hideCats:[],templates:[]}, tpEdit=null;
const TPCATS=()=>{const m=new Map(GR.CATS.map(c=>[c[0],c[1]]));(TP.cats||[]).forEach(c=>m.set(c.id,c.name));return [...m.entries()]};
const tpCatName=id=>(TPCATS().find(c=>c[0]===id)||[id,id])[1];
function tpInit(){
  $('tpNew').onclick=()=>tpOpen(null);
  $('tpFilter').onchange=tpRender;
  $('catAdd').onclick=()=>{const n=$('catNew').value.trim();if(!n)return;TP.cats.push({id:'c'+Date.now().toString(36),name:n});$('catNew').value='';tpCats();tpMsg('נוסף. ללחוץ "שמירה" בתחתית.')};
  $('tpSave').onclick=tpSaveAll;
  Promise.all([GR.catalog(),api({action:'greettplget'})]).then(([_,d])=>{TP=d;tpCats();tpRender()}).catch(e=>{$('tpList').innerHTML='<p class="msg">לא הצלחתי לטעון: '+esc(e.message)+'</p>'});
}
function tpMsg(t,ok){$('tpMsg').className=ok?'ok':'';$('tpMsg').textContent=t}
function tpSaveAll(){tpMsg('שומר…');api({action:'greettplsave',...TP}).then(d=>{TP=d;tpCats();tpRender();tpMsg('נשמר. הלקוחות יראו את השינוי תוך כמה דקות.',true)}).catch(e=>{$('tpMsg').className='msg';$('tpMsg').textContent='השמירה נכשלה: '+e.message})}
function tpCats(){
  const box=$('catList');box.innerHTML='';const hid=new Set(TP.hideCats||[]);
  TPCATS().forEach(([id,name])=>{
    const custom=(TP.cats||[]).some(c=>c.id===id&&!GR.CATS.some(x=>x[0]===id)),used=(TP.templates||[]).filter(t=>t.cat===id||(t.variants||[]).some(v=>v.cat===id)).length;
    const el=document.createElement('span');el.className='cat-i'+(hid.has(id)?' off':'');
    el.innerHTML='<span></span><button type="button" data-a="ren">שינוי שם</button><button type="button" data-a="hide"></button>'+(custom?'<button type="button" data-a="del">מחיקה</button>':'');
    el.querySelector('span').textContent=name+(used?' ('+used+')':'');
    el.querySelector('[data-a=hide]').textContent=hid.has(id)?'הצגה':'הסתרה';
    el.querySelector('[data-a=ren]').onclick=()=>{const inp=document.createElement('input');inp.value=name;inp.style.width='140px';el.firstChild.replaceWith(inp);inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};inp.onblur=()=>{const v=inp.value.trim();if(v&&v!==name){const c=(TP.cats||[]).find(c=>c.id===id);if(c)c.name=v;else TP.cats.push({id,name:v})}tpCats();tpRender()}};
    el.querySelector('[data-a=hide]').onclick=()=>{TP.hideCats=hid.has(id)?TP.hideCats.filter(x=>x!==id):[...(TP.hideCats||[]),id];tpCats();tpMsg('ללחוץ "שמירה" בתחתית.')};
    const del=el.querySelector('[data-a=del]');if(del)del.onclick=()=>{if(used){tpMsg('יש באירוע הזה '+used+' עיצובים. קודם מעבירים אותם לאירוע אחר.');return}if(!del.dataset.sure){del.dataset.sure=1;del.textContent='בטוח?';return}TP.cats=TP.cats.filter(c=>c.id!==id);tpCats()};
    box.appendChild(el);
  });
  const f=$('tpFilter'),cur=f.value;f.innerHTML='<option value="">כל האירועים</option>'+TPCATS().map(c=>'<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>').join('');f.value=cur;
}
function tpObj(t){return {id:t.id,bg:{img:t.bg.img,thumb:t.bg.thumb},area:t.area,blocks:t.blocks,colors:[]}}
function tpRender(){
  const box=$('tpList'),f=$('tpFilter').value;box.innerHTML='';
  const list=(TP.templates||[]).filter(t=>!f||t.cat===f||(t.variants||[]).some(v=>v.cat===f)).sort((a,b)=>(a.order||0)-(b.order||0));
  if(!list.length){box.innerHTML='<p class="sub">עדיין אין עיצובים שהעלית'+(f?' לאירוע הזה':'')+'. לוחצים "+ עיצוב חדש".</p>';return}
  list.forEach(t=>{
    const el=document.createElement('div');el.className='tp-c'+(t.on===false?' off':'');
    el.innerHTML='<canvas></canvas><b></b><span class="m"></span><div class="actions"><button class="btn sm" type="button" data-a="ed">עריכה</button><button class="btn sm" type="button" data-a="on"></button><button class="btn sm" type="button" data-a="del">מחיקה</button></div>';
    el.querySelector('b').textContent=t.title||'בלי שם';
    el.querySelector('.m').textContent=(GR.KINDS[t.kind]||'')+' · '+tpCatName(t.cat)+((t.variants||[]).length?' + עוד '+t.variants.length+' אירועים':'')+(t.price?' · ₪'+t.price:' · חינם');
    el.querySelector('[data-a=on]').textContent=t.on===false?'הצגה':'הסתרה';
    el.querySelector('[data-a=ed]').onclick=()=>tpOpen(t);
    el.querySelector('[data-a=on]').onclick=()=>{t.on=t.on===false;tpRender();tpMsg('ללחוץ "שמירה" בתחתית.')};
    const d=el.querySelector('[data-a=del]');d.onclick=()=>{if(!d.dataset.sure){d.dataset.sure=1;d.textContent='בטוח?';return}TP.templates=TP.templates.filter(x=>x!==t);tpRender();tpCats();tpMsg('נמחק. ללחוץ "שמירה" בתחתית.')};
    box.appendChild(el);
    GR.render(el.querySelector('canvas'),tpObj(t),{colors:{},blocks:t.blocks,scale:1},{scale:.35,thumb:true}).catch(()=>{});
  });
}
function tpOpen(t){
  const isNew=!t;
  const w=t?JSON.parse(JSON.stringify(t)):{variants:[],id:'u'+Date.now().toString(36),title:'',cat:$('tpFilter').value||'wedding',kind:'greeting',price:0,on:true,order:(TP.templates||[]).length,bg:{img:''},area:{x:150,y:230,w:494,h:700,valign:'center'},blocks:GR.starter('greeting','#14213d','#8a6a22')};
  const box=$('tpEd');box.innerHTML='';
  const ed=document.createElement('div');ed.className='tp-ed';
  ed.innerHTML='<div class="tp-pv" id="tpPv"><canvas id="tpCv"></canvas><div class="ar" id="tpAr"></div></div>'+
   '<div class="tp-f"><h3 style="margin:0">'+(isNew?'עיצוב חדש':'עריכת עיצוב')+'</h3>'+
   '<div class="actions"><button class="btn primary" type="button" id="tpUp">העלאת רקע (JPG / PNG)</button><span class="sub" id="tpUpMsg"></span></div>'+
   '<p class="sub">אחרי ההעלאה: <b>גוררים על התמונה</b> מלבן במקום שבו יופיע הטקסט. הכי מתאים רקע ביחס של דף A4 לאורך.</p>'+
   '<div class="fields"><label>שם העיצוב<input id="tpT"></label><label>אירוע<select id="tpC"></select></label>'+
   '<label>סוג<select id="tpK"><option value="greeting">ברכה</option><option value="invite">הזמנה</option></select></label><label>מחיר (0 = חינם)<input id="tpP" type="number" min="0"></label>'+
   '<label>צבע הטקסט הראשי<input id="tpM" type="color" value="#14213d"></label><label>צבע להדגשות ולקישוטים<input id="tpA" type="color" value="#8a6a22"></label>'+
   '<label>גופן לכותרות<select id="tpFH"></select></label><label>גופן לטקסט<select id="tpFB"></select></label>'+
   '<label>מיקום הטקסט בתוך האזור<select id="tpV"><option value="center">ממורכז לגובה</option><option value="top">צמוד למעלה</option></select></label>'+
   '<label>מבנה התחלתי<select id="tpS"><option value="greeting">ברכה (כותרת, שם, לרגל, ברכה, חתימה)</option><option value="invite">הזמנה (חתן וכלה, מועד, הורים)</option></select></label></div>'+
   '<div class="actions"><button class="btn" type="button" id="tpApply">החלת הצבעים והגופנים על הטקסט</button></div>'+
   '<p class="sub">ללקוח יהיה אפשר לשנות הכל בעורך: טקסט, גופנים, צבעים, להוסיף ולמחוק פסקאות.</p>'+
   '<h4 style="margin:6px 0 0">אותו רקע באירועים נוספים</h4><p class="sub">העיצוב יופיע בגלריה גם באירועים האלה. לכל אירוע בוחרים נוסח מוכן (מהחלק "נוסחים מוכנים לברכות"), והוא ממלא את הטקסט.</p>'+
   '<div id="tpVars" style="display:flex;flex-direction:column;gap:8px"></div><div class="actions"><button class="btn sm" type="button" id="tpVarAdd">+ הוספת אירוע לעיצוב</button></div>'+
   '<div class="actions"><button class="btn primary" type="button" id="tpOk">'+(isNew?'הוספה לרשימה':'עדכון')+'</button><button class="btn" type="button" id="tpCancel">ביטול</button></div></div>';
  box.appendChild(ed);ed.scrollIntoView({block:'start',behavior:'smooth'});
  $('tpC').innerHTML=TPCATS().map(c=>'<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>').join('');
  const fonts=GR.pickList().filter(m=>m.lang!=='en');
  const fo=fonts.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.label)+'</option>').join('');$('tpFH').innerHTML=fo;$('tpFB').innerHTML=fo;
  const head=(w.blocks.find(b=>b.type==='text'&&b.size>=26)||{}).font||'Suez One',body=(w.blocks.find(b=>b.type==='text'&&b.size<26&&b.size>=15)||{}).font||'Frank Ruhl Libre';
  $('tpFH').value=head;$('tpFB').value=body;
  $('tpT').value=w.title;$('tpC').value=w.cat;$('tpK').value=w.kind;$('tpP').value=w.price||0;$('tpV').value=w.area.valign||'center';$('tpS').value=w.kind;
  const cv=$('tpCv'),ar=$('tpAr'),pv=$('tpPv');
  let pend=false;const draw=()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;
    const r=pv.getBoundingClientRect();ar.style.cssText='left:'+(w.area.x/794*100)+'%;top:'+(w.area.y/1123*100)+'%;width:'+(w.area.w/794*100)+'%;height:'+(w.area.h/1123*100)+'%';
    if(!w.bg.img){const c=cv.getContext('2d');cv.width=400;cv.height=566;c.fillStyle='#eee';c.fillRect(0,0,400,566);c.fillStyle='#888';c.font='18px Assistant';c.textAlign='center';c.fillText('עדיין לא הועלה רקע',200,283);return}
    GR.render(cv,tpObj(w),{colors:{},blocks:w.blocks,scale:1},{scale:Math.max(.4,r.width*(devicePixelRatio||1)/794)}).catch(()=>{$('tpUpMsg').textContent='לא הצלחתי להציג את התמונה'})})};
  const apply=()=>{const nb=GR.starter($('tpS').value,$('tpM').value,$('tpA').value);nb.forEach(b=>{if(b.type==='text')b.font=b.size>=26?$('tpFH').value:$('tpFB').value});w.blocks=nb;draw()};
  $('tpApply').onclick=apply;['tpS'].forEach(id=>$(id).onchange=()=>{$('tpK').value=$('tpS').value;apply()});
  $('tpV').onchange=()=>{w.area.valign=$('tpV').value;draw()};
  /* גרירת אזור הטקסט */
  let st=null;
  pv.addEventListener('pointerdown',e=>{if(!w.bg.img)return;const r=pv.getBoundingClientRect();st={x:(e.clientX-r.left)/r.width*794,y:(e.clientY-r.top)/r.height*1123};pv.setPointerCapture(e.pointerId)});
  pv.addEventListener('pointermove',e=>{if(!st)return;const r=pv.getBoundingClientRect(),x=Math.max(0,Math.min(794,(e.clientX-r.left)/r.width*794)),y=Math.max(0,Math.min(1123,(e.clientY-r.top)/r.height*1123));
    w.area.x=Math.round(Math.min(st.x,x));w.area.y=Math.round(Math.min(st.y,y));w.area.w=Math.max(40,Math.round(Math.abs(x-st.x)));w.area.h=Math.max(40,Math.round(Math.abs(y-st.y)));ar.style.cssText='left:'+(w.area.x/794*100)+'%;top:'+(w.area.y/1123*100)+'%;width:'+(w.area.w/794*100)+'%;height:'+(w.area.h/1123*100)+'%'});
  pv.addEventListener('pointerup',()=>{if(st){st=null;draw()}});
  /* העלאת רקע */
  $('tpUp').onclick=()=>{const fi=document.createElement('input');fi.type='file';fi.accept='image/jpeg,image/png,image/webp';fi.onchange=async()=>{const f=fi.files[0];if(!f)return;$('tpUpMsg').textContent='מעלה…';
    try{const s=await api({action:'libmedia',name:f.name,type:f.type,size:f.size});if(s.error)throw new Error(s.error);
      const up=await fetch(s.upload,{method:'PUT',headers:{'Content-Type':f.type,'x-upsert':'true'},body:f});if(!up.ok)throw new Error('ההעלאה נכשלה ('+up.status+')');
      w.bg.img=s.url;
      try{const th=await new Promise((ok,bad)=>{const im=new Image();im.onload=()=>{const k=420/im.width,c=document.createElement('canvas');c.width=420;c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):bad(),'image/jpeg',.82);URL.revokeObjectURL(im.src)};im.onerror=bad;im.src=URL.createObjectURL(f)});
        const s2=await api({action:'libmedia',name:'thumb.jpg',type:'image/jpeg',size:th.size});if(!s2.error){const u2=await fetch(s2.upload,{method:'PUT',headers:{'Content-Type':'image/jpeg','x-upsert':'true'},body:th});if(u2.ok)w.bg.thumb=s2.url}}catch(e){}
      if(!$('tpT').value)$('tpT').value=f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');$('tpUpMsg').textContent='הרקע הועלה. עכשיו גוררים מלבן לאזור הטקסט.';draw()}catch(err){$('tpUpMsg').textContent=err.message}};fi.click()};
  w.variants=w.variants||[];
  const presetOpts=(cat,kind)=>'<option value="">בלי נוסח מיוחד (הטקסט של העיצוב)</option>'+PR.filter(p=>p.on!==false&&(p.cat==='all'||p.cat===cat)&&(p.kind==='all'||p.kind===kind)).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title||'נוסח בלי שם')+'</option>').join('');
  const vars=()=>{const vb=$('tpVars');vb.innerHTML='';
    w.variants.forEach((v,i)=>{const r=document.createElement('div');r.className='fields';r.style.gridTemplateColumns='repeat(3,minmax(0,1fr)) auto';
      r.innerHTML='<label>אירוע<select data-f="cat">'+TPCATS().map(c=>'<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>').join('')+'</select></label><label>סוג<select data-f="kind"><option value="greeting">ברכה</option><option value="invite">הזמנה</option></select></label><label>נוסח<select data-f="preset"></select></label><button class="btn sm" type="button" style="align-self:end">הסרה</button>';
      const c=r.querySelector('[data-f=cat]'),k=r.querySelector('[data-f=kind]'),p=r.querySelector('[data-f=preset]');
      c.value=v.cat;k.value=v.kind;p.innerHTML=presetOpts(v.cat,v.kind);p.value=v.preset||'';
      c.onchange=()=>{v.cat=c.value;p.innerHTML=presetOpts(v.cat,v.kind);v.preset='';};k.onchange=()=>{v.kind=k.value;p.innerHTML=presetOpts(v.cat,v.kind);v.preset='';};p.onchange=()=>{v.preset=p.value};
      r.querySelector('button').onclick=()=>{w.variants.splice(i,1);vars()};vb.appendChild(r)});
    if(!w.variants.length)vb.innerHTML='<p class="sub">רק באירוע הראשי.</p>'};
  $('tpVarAdd').onclick=()=>{w.variants.push({cat:$('tpC').value,kind:$('tpK').value,preset:''});vars()};
  vars();
  $('tpCancel').onclick=()=>{box.innerHTML=''};
  $('tpOk').onclick=()=>{if(!w.bg.img){$('tpUpMsg').textContent='קודם מעלים רקע.';return}
    w.title=$('tpT').value.trim();w.cat=$('tpC').value;w.kind=$('tpK').value;w.price=+$('tpP').value||0;
    const i=(TP.templates||[]).findIndex(x=>x.id===w.id);if(i>=0)TP.templates[i]=w;else TP.templates.push(w);
    box.innerHTML='';tpRender();tpCats();tpSaveAll()};
  draw();window.addEventListener('resize',draw);
}
function start(){
  app.innerHTML='';app.appendChild($('studio').content.cloneNode(true));
  $('out').onclick=()=>{try{sessionStorage.removeItem('myluach-admin')}catch(e){}location.reload()};
  OCC.forEach(x=>{const op=document.createElement('option');op.value=x[0];op.textContent=x[1];$('occ').appendChild(op)});
  const fill=(sel,obj)=>{for(const [k,v] of Object.entries(obj)){const op=document.createElement('option');op.value=k;op.textContent=v[0];sel.appendChild(op)}};
  fill($('style'),STYLES);fill($('pal'),PALS);
  try{const t=localStorage.getItem('studio-tool');if(t)$('tool').value=t}catch(e){}
  const syncKinds=()=>{const occ=OCC.find(x=>x[0]===$('occ').value),cur=$('kind').value;$('kind').innerHTML='';occ[3].forEach(k=>{const op=document.createElement('option');op.value=k;op.textContent=KINDS[k][0];$('kind').appendChild(op)});if(occ[3].includes(cur))$('kind').value=cur};
  const val=()=>({tool:$('tool').value,occ:$('occ').value,kind:$('kind').value,style:$('style').value,pal:$('pal').value,ar:$('ar').value,center:$('center').value,extra:$('extra').value});
  const render=()=>{
    current=build(val());$('out-p').textContent=current;
    $('toolHint').textContent=$('tool').value==='mj'
      ?'ב־Midjourney מדביקים כמו שזה. הגודל והחסימות כבר בתוך הפרומפט (הקודים שמתחילים ב־--).'
      :'ב־Firefly: לפני Generate בוחרים בהגדרות יחס '+FF_AR[$('ar').value]+' ומודל Firefly Image בלי כתר.';
  };
  $('occ').addEventListener('change',()=>{syncKinds();render()});
  ['kind','style','pal','ar','center'].forEach(id=>$(id).addEventListener('change',render));
  $('tool').addEventListener('change',()=>{try{localStorage.setItem('studio-tool',$('tool').value)}catch(e){}render();cards()});
  $('extra').addEventListener('input',render);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  $('rand').onclick=()=>{$('occ').value=pick(OCC)[0];syncKinds();$('kind').value=pick(OCC.find(x=>x[0]===$('occ').value)[3]);$('style').value=pick(Object.keys(STYLES));$('pal').value=pick(Object.keys(PALS));render()};
  $('copy').onclick=()=>copy(current,$('out-p'));

  let filter='all';
  const chips=()=>{const box=$('chips');box.innerHTML='';
    [['all','הכל'],...OCC.map(x=>[x[0],x[1]])].forEach(([id,he])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=he;b.setAttribute('aria-pressed',String(filter===id));b.onclick=()=>{filter=id;chips();cards()};box.appendChild(b)})};
  function cards(){const box=$('cards');box.innerHTML='';
    OCC.filter(o=>filter==='all'||o[0]===filter).forEach(o=>o[4].forEach(([s,p],i)=>{
      const kind=o[3][i%o[3].length],opt={tool:$('tool').value,occ:o[0],kind,style:s,pal:p,ar:'5:7',center:'cream',extra:''},txt=build(opt);
      const c=document.createElement('article');c.className='card';
      c.innerHTML='<div class="hd"><h3></h3><span class="tag"></span></div><div class="meta"></div><pre></pre><div class="actions"><button type="button" class="btn sm primary">העתקה</button><button type="button" class="btn sm">לבונה</button></div>';
      c.querySelector('h3').textContent=o[1];c.querySelector('.tag').textContent=KINDS[kind][0];
      c.querySelector('.meta').textContent=STYLES[s][0]+' · '+PALS[p][0];
      const pre=c.querySelector('pre');pre.textContent=txt;
      const [b1,b2]=c.querySelectorAll('button');
      b1.onclick=()=>copy(txt,pre);
      b2.onclick=()=>{$('occ').value=o[0];syncKinds();$('kind').value=kind;$('style').value=s;$('pal').value=p;$('ar').value='5:7';$('center').value='cream';$('extra').value='';render();$('b-h').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
      box.appendChild(c)}))}
  $('occ').value='wedding';$('style').value='gate';$('pal').value='navygold';syncKinds();render();chips();cards();
  prInit();
  flInit();
  tpInit();
}
})();
