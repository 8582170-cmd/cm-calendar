<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>האזור האישי · ברכות והזמנות | MyLuach</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap">
<link rel="stylesheet" href="/assets/greetings/greetings.css?v=7">
<script src="/assets/a11y.js?v=1" defer></script>
<script src="/assets/greetings/greetings.js?v=59"></script>
<script src="/assets/greetings/mine.js?v=6"></script>
<script src="/assets/pay.js?v=4" defer></script>
<style>
.acc-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.acc-h h1{font-size:clamp(30px,4vw,42px);font-weight:900}
.acc-h .who{color:var(--mute);font-size:16px}
.acc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.acc-tabs button{font:inherit;font-weight:800;font-size:17px;min-height:46px;padding:6px 18px;border-radius:12px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.acc-tabs button[aria-selected="true"]{border-color:var(--teal);background:var(--teal);color:var(--teal-ink)}
.acc-card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.acc-card h2{font-size:22px}
.acc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.acc-list li{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc-list b{font-size:18px;display:block}.acc-list small{display:block;color:var(--mute);font-size:15px}
.acc-btns{display:flex;gap:8px;flex-wrap:wrap}
.acc-btn{font:inherit;font-size:15px;font-weight:700;min-height:40px;padding:6px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.acc-btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.ok{color:#1d7a3a;font-weight:700}.bad{color:#b3261e;font-weight:700}
.my-t{font:inherit;font-size:17px;font-weight:800;border:1px dashed transparent;border-radius:6px;padding:2px 4px;background:none;color:var(--ink);width:100%}
.my-t:hover,.my-t:focus{border-color:var(--line);outline:none;background:var(--paper)}
.empty{color:var(--mute);font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <a class="logo" href="/"><img class="logo-img" src="/assets/logo.svg?v=2" alt="" width="36" height="36">MyLuach</a>
    <nav class="nav-links" aria-label="ניווט ראשי">
      <a href="/brachot/">ברכות והזמנות</a>
      <a href="/brachot/my.html" aria-current="page">👤 האזור האישי</a>
      <a href="/gallery.html">לוחות שנה</a>
    </nav>
  </header>
  <main id="main">
    <div class="acc-h"><div><h1>האזור האישי</h1><div class="who" id="who"></div></div><div class="acc-btns" id="topB"></div></div>
    <div id="body"><p class="empty">טוען…</p></div>
  </main>
</div>
<script>
(function(){
'use strict';
var G = window.Greetings, M = window.MyGreets, $ = function(id){ return document.getElementById(id); }, body = $('body');
var TABS = [['designs', '🎨 העיצובים שלי'], ['buys', '🧾 הרכישות שלי'], ['subs', '🔁 מנוי וחבילות'], ['me', '✎ הפרטים שלי'], ['help', 'עזרה']];
var tab = (/^#(\w+)/.exec(location.hash) || [])[1]; if (!TABS.some(function(t){ return t[0] === tab; })) tab = 'designs';
function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function dt(d){ try { return new Date(d).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' }); } catch (e) { return ''; } }
function dtt(d){ try { return new Date(d).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function money(a){ return (+a ? (+a).toLocaleString('he-IL') + ' ₪' : 'בחינם'); }

M.user().then(function(u){
  if (!u) {
    body.innerHTML = '';
    var c = el('div', 'acc-card'); c.appendChild(el('h2', '', 'נכנסים לחשבון'));
    c.appendChild(el('p', 'note', 'באזור האישי שומרים עיצובים ופותחים אותם שוב, רואים את הברכות וההזמנות שקניתם ומורידים אותן שוב, ושומרים את השמות והחתימה שלכם לכל העיצובים. זה אותו חשבון של האתר (גם של בונה הלוחות).'));
    var r = el('div', 'acc-btns'), a = el('a', 'acc-btn pri', 'כניסה / הרשמה'); a.href = M.loginUrl(); r.appendChild(a); c.appendChild(r); body.appendChild(c);
    return;
  }
  $('who').textContent = u.email;
  var cal = el('a', 'acc-btn', '📅 האזור האישי של הלוחות'); cal.href = '/app.html'; cal.title = 'המסלול, הלוחות, ההורדות והתזכורות';
  var out = el('button', 'acc-btn', 'יציאה'); out.type = 'button'; out.onclick = function(){ M.signOut().then(function(){ location.reload(); }); };
  $('topB').append(cal, out);
  var tb = el('div', 'acc-tabs'); tb.setAttribute('role', 'tablist');
  TABS.forEach(function(t){ var b = el('button', '', t[1]); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.t = t[0]; b.onclick = function(){ show(t[0]); }; tb.appendChild(b); });
  var pane = el('div'); pane.setAttribute('role', 'tabpanel');
  body.innerHTML = ''; body.append(tb, pane);
  function show(k){ tab = k; try { history.replaceState(null, '', '#' + k); } catch (e) {}
    tb.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.t === k)); });
    pane.innerHTML = '<p class="empty">טוען…</p>';
    ({ designs: designs, buys: buys, subs: subs, me: me, help: help })[k](pane); }
  show(tab);
}).catch(function(){ body.innerHTML = '<p class="bad">לא הצלחנו לטעון. בדקו את החיבור ונסו שוב.</p>'; });

/* העיצובים ששמרו בחשבון */
function designs(pane){
  M.list().then(function(ix){
    pane.innerHTML = '';
    var ids = Object.keys(ix).sort(function(a, b){ return String(ix[b].updated).localeCompare(String(ix[a].updated)); });
    if (!ids.length) { var c = el('div', 'acc-card'); c.appendChild(el('p', 'empty', 'עוד לא שמרתם עיצובים. בעורך לוחצים "💾 שמירה בעיצובים שלי", והעיצוב נשמר כאן: פותחים אותו שוב ומשנים רק מה שצריך, למשל את השם.')); var a = el('a', 'acc-btn pri', 'לבחירת עיצוב'); a.href = '/brachot/'; c.appendChild(a); pane.appendChild(c); return; }
    var g = el('div', 'gal'); pane.appendChild(g);
    ids.forEach(function(id){ var x = ix[id], a = el('div', 'card my');
      var href = '/brachot/edit.html?t=' + encodeURIComponent(x.tpl) + (x.v >= 0 ? '&v=' + x.v : '') + '&my=' + encodeURIComponent(id);
      var sh = el('a', 'sheet'); sh.href = href; if (x.thumb) { var im = el('img'); im.alt = ''; im.src = x.thumb; sh.appendChild(im); } a.appendChild(sh);
      var t = el('input', 'my-t'); t.value = x.title || 'עיצוב'; t.setAttribute('aria-label', 'שם העיצוב (אפשר לשנות)'); t.title = 'לחיצה לשינוי השם';
      t.onchange = function(){ var v = t.value.trim(); if (!v) { t.value = x.title || 'עיצוב'; return; } M.rename(id, v).then(function(){ x.title = v; }); };
      a.appendChild(t);
      a.appendChild(el('span', 'meta', (x.kind === 'invite' ? 'הזמנה' : 'ברכה') + ' · נשמר ' + dt(x.updated)));
      var bb = el('div', 'my-b'), op = el('a', 'pill', 'פתיחה ועריכה'); op.href = href;
      var cp = el('button', 'pill', 'שכפול'); cp.type = 'button'; cp.title = 'עותק נוסף, למשל לאותה ברכה עם שם אחר';
      cp.onclick = function(){ cp.disabled = true; cp.textContent = 'משכפל…'; M.duplicate(id).then(function(){ designs(pane); }).catch(function(){ cp.textContent = 'שגיאה'; }); };
      var del = el('button', 'pill', 'מחיקה'); del.type = 'button';
      del.onclick = function(){ if (!del.dataset.sure) { del.dataset.sure = 1; del.textContent = 'בטוח? ללחוץ שוב'; return; } del.disabled = true; M.remove(id).then(function(){ designs(pane); }); };
      bb.append(op, cp, del); a.appendChild(bb); g.appendChild(a); });
  }).catch(function(){ pane.innerHTML = '<p class="bad">לא הצלחנו לטעון את העיצובים.</p>'; });
}

/* ברכות והזמנות שנקנו: פתיחה מחדש, הורדה, אישור תשלום */
function buys(pane){
  M.purchases().then(function(j){
    pane.innerHTML = ''; var L = j.list || [], now = Date.parse(j.now) || Date.now();
    if (!L.length) { var c = el('div', 'acc-card'); c.appendChild(el('p', 'empty', 'עוד לא נמצאו רכישות של ברכות או הזמנות בחשבון הזה.')); c.appendChild(el('p', 'note', 'שילמתם עם כתובת מייל אחרת? הקישור לעיצוב נשלח למייל ששילמתם בו. אפשר גם להתחבר עם הכתובת הזו.')); pane.appendChild(c); return; }
    var ul = el('ul', 'acc-list'); pane.appendChild(ul);
    L.forEach(function(o){ var li = el('li'), s = el('span');
      s.appendChild(el('b', '', o.title + ' · ' + (o.via === 'sub' ? 'מהמנוי' : o.via === 'pack' ? 'מהחבילה' : money(o.amount))));
      s.appendChild(el('small', '', dt(o.at) + ' · הזמנה ' + o.no));
      var st = el('small'), ed = o.editUntil && now <= Date.parse(o.editUntil), dl = o.dlUntil && now <= Date.parse(o.dlUntil);
      if (o.status === 'refunded') { st.className = 'bad'; st.textContent = 'בוצע החזר'; }
      else if (ed) { st.className = 'ok'; st.textContent = 'אפשר לשנות עד ' + dtt(o.editUntil) + ', ולהוריד עד ' + dtt(o.dlUntil); }
      else if (dl) { st.textContent = 'זמן העריכה הסתיים. אפשר להוריד עד ' + dtt(o.dlUntil); }
      else st.textContent = 'תוקף ההורדה הסתיים';
      s.appendChild(st); li.appendChild(s);
      var bb = el('div', 'acc-btns');
      if (o.rc) { var rcb = el('button', 'pill', '🧾 קבלה'); rcb.type = 'button'; rcb.onclick = function(){ var w = window.open('', '_blank'); rcb.disabled = true; M.receipt(o.id).then(function(r){ rcb.disabled = false; if (w) w.location = r.url; }).catch(function(er){ if (w) w.close(); rcb.disabled = false; rcb.textContent = er.msg || 'עוד לא מוכנה'; }); }; bb.appendChild(rcb); }
      if (o.link) { var a = el('a', 'acc-btn pri', ed ? 'פתיחה ועריכה' : 'פתיחה והורדה'); a.href = o.link + (ed ? '' : '#download'); bb.appendChild(a); }
      if (o.status === 'paid') { var cf = el('button', 'acc-btn', 'אישור תשלום'); cf.type = 'button'; cf.onclick = function(){ conf(o); }; bb.appendChild(cf); }
      li.appendChild(bb); ul.appendChild(li); });
    pane.appendChild(el('p', 'note', 'אחרי שתוקף ההורדה מסתיים: אם שמרתם את העיצוב ב"העיצובים שלי", אפשר לפתוח אותו משם ולקנות שוב. שאלה על הזמנה? כתבו ל־contact@myluach.org'));
  }).catch(function(){ pane.innerHTML = '<p class="bad">לא הצלחנו לטעון את הרכישות. נסו שוב בעוד רגע.</p>'; });
}
function conf(o){
  var w = window.open('', '_blank'); if (!w) return;
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.document.write('<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>אישור תשלום ' + esc(o.no) + ' · MyLuach</title><style>body{font:16px/1.7 Arial,sans-serif;color:#1a232c;max-width:640px;margin:40px auto;padding:0 20px}h1{font-size:24px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin:20px 0}td{padding:8px 10px;border-bottom:1px solid #dde}td:first-child{color:#5c686c;width:40%}.n{color:#5c686c;font-size:14px}@media print{button{display:none}}</style></head><body>' +
    '<h1>אישור תשלום</h1><div class="n">MyLuach · www.myluach.org · contact@myluach.org</div><table>' +
    [['מספר הזמנה', o.no], ['תאריך', dt(o.at)], ['מוצר', 'ברכה / הזמנה מעוצבת: ' + o.title], ['סכום', money(o.amount)], ['סטטוס', 'שולם'], ['לקוח', $('who').textContent]].map(function(r){ return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') +
    '</table><p class="n">זהו אישור על ביצוע ההזמנה באתר, ואינו מהווה חשבונית מס. קבלה רשמית נשלחת מחברת הסליקה, או לפי בקשה.</p><button onclick="print()">הדפסה / שמירה כ־PDF</button></body></html>');
  w.document.close();
}

/* הפרטים שממלאים פעם אחת: נשמרים בחשבון ובדפדפן, ומופיעים בכל העיצובים */
/* מנוי וחבילות: מה יש לי עכשיו, ומה אפשר לקנות (תשלום מראש לתקופה, בלי חיוב אוטומטי) */
function subs(pane){
  M.ent().then(function(j){
    pane.innerHTML = ''; var e = j.ent || {}, o = j.offers || {}, c = el('div', 'acc-card');
    c.appendChild(el('h2', '', 'מה יש לי עכשיו'));
    var L = [];
    if (e.sub) L.push((e.sub.auto && e.sub.auto.state === 'active' ? '🔁 ' : '') + 'מנוי: ' + e.sub.name + ' (' + (e.sub.per === 'y' ? 'שנתי' : 'חודשי') + '), בתוקף עד ' + dt(e.sub.end) + '. ' + (e.sub.quota ? 'החודש: נוצלו ' + e.sub.used + ' מתוך ' + e.sub.quota + ' עיצובים' + (e.sub.cycleEnd ? ' (מתחדש ב־' + dt(e.sub.cycleEnd) + ')' : '') : 'ללא הגבלת עיצובים') + '.');
    (e.packs || []).forEach(function(p){ L.push('חבילה: ' + p.name + ' · נשארו ' + Math.max(0, p.n - p.used) + ' מתוך ' + p.n + (p.end ? ', בתוקף עד ' + dt(p.end) : '') + '.'); });
    if (!L.length) L.push('אין מנוי או חבילה פעילים.');
    L.forEach(function(t){ c.appendChild(el('p', 'note', t)); });
    /* חידוש אוטומטי: מצב וביטול (גם של מנוי התזכורות) */
    var autos = []; if (e.sub && e.sub.auto) autos.push({ order: e.sub.order, name: 'מנוי ' + e.sub.name, st: e.sub.auto.state, end: e.sub.end });
    ((j.rent && j.rent.via) || []).forEach(function(v){ if (v.auto && v.order) autos.push({ order: v.order, name: 'מנוי תזכורות ' + v.name, st: v.auto.state, end: v.until }); });
    autos.forEach(function(a){ var p = el('p', 'note');
      if (a.st === 'active') { p.textContent = a.name + ': מתחדש אוטומטית. '; var x = el('button', 'pill', 'ביטול החידוש'); x.type = 'button';
        x.onclick = function(){ if (!x.dataset.sure) { x.dataset.sure = 1; x.textContent = 'לבטל? התוקף יישאר עד ' + dt(a.end) + '. ללחוץ שוב'; return; } x.disabled = true;
          M.cancelAuto(a.order).then(function(){ subs(pane); }).catch(function(er){ x.disabled = false; x.textContent = er.msg || 'לא הצליח, נסו שוב'; }); };
        p.appendChild(x); }
      else p.textContent = a.name + ': החידוש האוטומטי בוטל. בתוקף עד ' + dt(a.end) + '.';
      c.appendChild(p); });
    if (e.can) c.appendChild(el('p', 'note', 'איך משתמשים: פותחים עיצוב בתשלום, ובמקום "תשלום והורדה" לוחצים "לקבל מהמנוי" או "מהחבילה".'));
    pane.appendChild(c);
    var G = o.gsubs || [], P = o.gpacks || [];
    if (!o.on || (!G.length && !P.length)) return;
    var c2 = el('div', 'acc-card'); c2.appendChild(el('h2', '', 'מנויים'));
    var AU = o.auto || {};
    var buy = function(body, title, sub){ if (!window.MLPay) return; window.MLPay.open({ title: title, sub: sub, mailNote: 'המנוי משויך לחשבון עם המייל הזה', email: $('who').textContent, body: body, onPaid: function(){ setTimeout(function(){ subs(pane); }, 1500); } }); };
    G.forEach(function(x){ var d = el('div', 'acc-card');
      d.appendChild(el('h3', '', x.name + (x.best ? ' ⭐' : ''))); if (x.desc) d.appendChild(el('p', 'note', x.desc));
      d.appendChild(el('p', 'note', x.quota ? 'עד ' + x.quota + ' עיצובים בתשלום בכל חודש' : 'עיצובים בתשלום ללא הגבלה'));
      var r = el('div', 'acc-btns');
      if (x.pm >= 1 && AU.m) { var am = el('button', 'acc-btn pri', 'חודשי · ' + x.pm + ' ₪ · מתחדש אוטומטית'); am.type = 'button'; am.onclick = function(){ buy({ plan: 'sub', kind: 'gsub', id: x.id, per: 'm', auto: 1 }, 'מנוי חודשי · ' + x.name, x.pm + ' ₪ לחודש, מתחדש אוטומטית. אפשר לבטל בכל עת באזור האישי.'); }; r.appendChild(am); }
      if (x.py >= 1 && AU.y) { var ay = el('button', 'acc-btn' + (AU.m ? '' : ' pri'), 'שנתי · ' + x.py + ' ₪ · מתחדש אוטומטית'); ay.type = 'button'; ay.onclick = function(){ buy({ plan: 'sub', kind: 'gsub', id: x.id, per: 'y', auto: 1 }, 'מנוי שנתי · ' + x.name, x.py + ' ₪ לשנה, מתחדש אוטומטית. אפשר לבטל בכל עת באזור האישי.'); }; r.appendChild(ay); }
      if (x.pm >= 1) { var a = el('button', 'acc-btn' + (AU.m ? '' : ' pri'), 'חודש אחד · ' + x.pm + ' ₪'); a.type = 'button'; a.onclick = function(){ buy({ plan: 'sub', kind: 'gsub', id: x.id, per: 'm' }, 'מנוי חודשי · ' + x.name, x.pm + ' ₪ לחודש. תשלום אחד, בלי חיוב אוטומטי.'); }; r.appendChild(a); }
      if (x.py >= 1) { var b = el('button', 'acc-btn', 'שנה אחת · ' + x.py + ' ₪'); b.type = 'button'; b.onclick = function(){ buy({ plan: 'sub', kind: 'gsub', id: x.id, per: 'y' }, 'מנוי שנתי · ' + x.name, x.py + ' ₪ לשנה. תשלום אחד, בלי חיוב אוטומטי.'); }; r.appendChild(b); }
      d.appendChild(r); c2.appendChild(d); });
    if (G.length) pane.appendChild(c2);
    if (P.length) { var c3 = el('div', 'acc-card'); c3.appendChild(el('h2', '', 'חבילות'));
      P.forEach(function(x){ var d = el('div', 'acc-card'); d.appendChild(el('h3', '', x.name)); if (x.desc) d.appendChild(el('p', 'note', x.desc));
        d.appendChild(el('p', 'note', x.n + ' עיצובים בתשלום' + (x.months ? ', לשימוש תוך ' + x.months + ' חודשים' : ', בלי הגבלת זמן')));
        var r = el('div', 'acc-btns'), a = el('button', 'acc-btn pri', 'קנייה · ' + x.price + ' ₪'); a.type = 'button'; a.onclick = function(){ buy({ plan: 'sub', kind: 'gpack', id: x.id }, 'חבילה · ' + x.name, x.price + ' ₪, תשלום אחד.'); }; r.appendChild(a); d.appendChild(r); c3.appendChild(d); });
      pane.appendChild(c3); }
