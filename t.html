<style>

.stack .clock{margin-top:8px;gap:0;align-items:flex-start;max-width:520px;margin-inline:auto}
.stack .clock .n{font-size:clamp(20px,7vw,46px)}
.sep{font:800 clamp(20px,7vw,46px)/1 var(--nfont);color:var(--acc);padding:10px 2px 0;flex:none}
.stack .clock .u{max-width:120px}
/* תמונה */
.ph{display:block;margin:0 auto 10px;object-fit:cover;border:3px solid var(--acc)}
.ph-circle{width:clamp(84px,24vw,130px);height:clamp(84px,24vw,130px);border-radius:50%}
.ph-rect{width:clamp(110px,34vw,190px);height:clamp(84px,24vw,140px);border-radius:14px}
.ph-wide{width:100%;height:clamp(110px,30vw,220px);border-radius:12px;border:0}
body.embed .ph-wide{height:clamp(90px,26vw,170px)}

body.inv{display:block}
#pg{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.invimg{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line)}
.box2{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.to{font:400 clamp(20px,5vw,28px)/1.35 var(--tfont);color:var(--acc);margin:0}
.it{white-space:pre-line;margin:6px 0 0;font-size:17px}
.hd{padding:22px 16px}.hd .nm{font:400 clamp(30px,8.5vw,50px)/1.15 var(--tfont);color:var(--ink);margin:6px 0 0;overflow-wrap:anywhere}
.hd .sub{font:400 clamp(20px,5vw,26px)/1.3 var(--tfont);color:var(--acc);margin:2px 0 10px}
.par{display:flex;justify-content:center;gap:12px 36px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.par small{display:block;color:var(--mute);font-size:14px}.par b{font-size:17px}
.det{display:grid;gap:4px;font-size:16px}.det b{color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.bt{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--acc);color:var(--acc);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.bt.pri{background:var(--acc);color:var(--card)}
.bt:focus-visible,.fm input:focus-visible,.fm textarea:focus-visible,.fm select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fm{display:grid;gap:10px;text-align:start;max-width:520px;margin:12px auto 0}
.fm label{display:grid;gap:4px;font-weight:600;font-size:15px}
.fm input,.fm textarea,.fm select{font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}

.wall{display:grid;gap:10px;text-align:start}

.wsw{display:flex;gap:6px;flex-wrap:wrap}.wsw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.wsw button[aria-pressed="true"]{outline:3px solid var(--acc);outline-offset:2px}
.rdy{display:flex;gap:6px;flex-wrap:wrap}.rdy button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer;text-align:start}

h2.sec{font:400 clamp(19px,4.6vw,24px)/1.3 var(--tfont);color:var(--acc);margin:0 0 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;margin:10px 0;direction:rtl}
.tgrid button{font:inherit;font-size:14px;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.tgrid button[aria-pressed="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}

.tbar{height:10px;border-radius:99px;background:var(--box);overflow:hidden;margin:6px auto;max-width:420px}.tbar i{display:block;height:100%;background:var(--acc)}

.fr1 .u{background:transparent;border:2px solid var(--acc)}
.fr2 .clock,.fr2 .top{border:2px solid var(--acc);border-radius:16px;padding:8px 6px}

.fr2.stack .clock{margin-top:10px}
